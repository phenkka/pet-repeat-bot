# Kubernetes. Лекция спецкурса УЦСБ «Основы Kubernetes».
# kind М: по методичке. keys: варианты через |.

[[card]]
id = "k8s-pod-pause"
q = "Что общего у контейнеров одного пода и зачем в каждом поде pause-контейнер?"
a = """Под — это группа контейнеров, которые работают вместе. Они делят общую сеть и память (Linux namespaces) и всегда стоят на одной ноде, поэтому общаются друг с другом через localhost.
Эти общие namespaces держит отдельный маленький pause-контейнер: он создаётся первым и живёт всё время. Остальные контейнеры пода присоединяются к нему. Благодаря этому, если приложение перезапустится, сеть пода не развалится — её держит pause.
Коротко: контейнеры пода делят сеть и память, а pause держит их, чтобы рестарт не ломал сеть."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:45-69"
kind = "М"
keys = [
  "namespace | сеть общ | localhost | одна нода | одной нод",
  "pause | держит namespace | первым",
]

[[card]]
id = "k8s-deploy-strategy"
q = "Deployment обновляет приложение: чем Recreate отличается от RollingUpdate?"
a = """Deployment умеет обновлять приложение двумя способами.
Recreate: сначала гасит все старые поды, потом поднимает новые. Между этим есть простой — приложение недоступно.
RollingUpdate: заменяет поды по одному, старые ещё работают, пока поднимаются новые. Простоя нет. Технически Deployment создаёт новый набор подов (ReplicaSet) и постепенно переливает нагрузку на него.
Коротко: Recreate гасит всё сразу (простой), RollingUpdate меняет постепенно (без простоя)."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:45-69"
kind = "М"
keys = [
  "recreate | убив все | простой | сначала все",
  "rolling | постепенн | без прерыв | по очеред",
]

[[card]]
id = "k8s-liveness-readiness"
q = "Провалилась liveness-проба, а в другом поде - readiness. Что сделает Kubernetes в каждом случае?"
a = """Это две проверки состояния пода, и реакция на них разная.
liveness («жив ли?») провалилась — kubelet считает контейнер зависшим и перезапускает его.
readiness («готов ли принимать трафик?») провалилась — под убирают из балансировки (Service перестаёт слать на него запросы), но не перезапускают. Как прогреется — вернут.
Есть ещё startup — для приложений с долгим стартом: пока она не прошла, две другие не проверяются.
Коротко: liveness провал = перезапуск; readiness провал = убрать из трафика без перезапуска."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:70-89"
kind = "М"
keys = [
  "liveness | перезапуск | рестарт",
  "readiness | трафик | убира из service | балансир | не перезапуск",
]

[[card]]
id = "k8s-secret-base64"
q = "Secret в Kubernetes «в закодированном виде». Насколько он защищён и чем его защищают на самом деле?"
a = """Secret в Kubernetes хранится в base64. Это не шифрование, а просто кодировка: любой, кто может прочитать объект, делает `base64 -d` и получает исходное значение.
Реально секреты защищают двумя вещами: RBAC (кто вообще имеет право читать секреты) и шифрование хранилища etcd на диске. Без этого доступ к etcd или к его бэкапу = все секреты кластера открытым текстом.
Коротко: base64 — не защита; защищают RBAC и шифрование etcd на диске."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:90-102, 249-262"
kind = "М"
keys = [
  "не шифр | кодирован | base64 | декод | любой прочита",
  "rbac | etcd | шифрован at rest | encryption | права на чтение",
]

[[card]]
id = "k8s-service-types"
q = "ClusterIP, NodePort, LoadBalancer - чем отличаются и какой из них чаще всего становится нежданной дырой наружу?"
a = """Service — постоянная точка доступа к подам. Три типа:
ClusterIP — адрес только внутри кластера, снаружи не виден (по умолчанию).
NodePort — открывает один и тот же порт (из диапазона 30000–32767) на всех нодах сразу, достучаться можно по IP любой ноды.
LoadBalancer — внешний балансировщик поверх NodePort, для доступа из интернета.
Нежданной дырой чаще всего становится NodePort: он открывает порт на каждой ноде, и про это легко забыть.
Коротко: ClusterIP внутри, NodePort на всех нодах (частая дыра), LoadBalancer наружу."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:103-121"
kind = "М"
keys = [
  "clusterip | внутри кластер",
  "nodeport | все нод | 30000",
  "loadbalancer | балансировщ | внешн",
]
need = 2

[[card]]
id = "k8s-ingress-controller"
q = "Создал Ingress с правилами, а трафик снаружи не доходит. Что первым проверить?"
a = """Ingress — это только правила маршрутизации (по какому адресу куда вести трафик). Сами по себе они ничего не делают: их применяет Ingress Controller (nginx, HAProxy, Istio). Нет контроллера — трафик снаружи и не доходит.
Поэтому первым делом проверяешь: есть ли в кластере Ingress Controller и совпадает ли у Ingress `ingressClassName` с ним. Дальше — Service, его selector, порты, pathType.
Коротко: Ingress — только правила; без Ingress Controller они не работают, его и проверить первым."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:103-121"
kind = "М"
keys = [
  "controller | контроллер | ingressclass",
  "только правила | сам не | применя",
]
need = 1

[[card]]
id = "k8s-pv-pvc"
q = "Зачем три сущности PV, PVC и StorageClass, если поду просто нужен диск?"
a = """Поду нужен диск, но между подом и реальным хранилищем три сущности, чтобы они не зависели друг от друга.
PV — реальный кусок хранилища в кластере.
PVC — запрос пода: сколько места, какой режим доступа, какой класс. Под знает только PVC.
StorageClass — правила, по которым PV создаётся автоматически под запрос.
Так под не привязан к конкретному диску. А `reclaimPolicy` решает судьбу PV после удаления PVC: удалить (Delete) или сохранить данные (Retain).
Коротко: PV — хранилище, PVC — запрос пода, StorageClass — правила автосоздания; под знает только PVC."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:122-147"
kind = "М"
keys = [
  "pv | хранилищ | реальн",
  "pvc | запрос",
  "storageclass | динамич | правила создан",
]
need = 2

[[card]]
id = "k8s-apiserver-etcd"
q = "Почему kube-apiserver и etcd защищают в первую очередь?"
a = """etcd — это база, где лежит всё состояние кластера, включая секреты. Напрямую в etcd ходит только один компонент — API-сервер.
Через API-сервер работают вообще все: и компоненты кластера, и мы с kubectl. Поэтому у кого есть доступ к API-серверу с нужными правами, у того и весь кластер. Отсюда защита в первую очередь: RBAC (кто что может), закрытый etcd и шифрование его на диске.
Коротко: etcd хранит всё и секреты, API-сервер — единственная дверь к управлению; их и защищают."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:162-190"
kind = "М"
keys = [
  "etcd | состояни | все данные | секрет",
  "api | все компонент | единственн | управлен кластер | rbac",
]

[[card]]
id = "k8s-scheduler-taints"
q = "На ноду с taint не садятся обычные поды. Как всё-таки посадить туда, например, агент мониторинга?"
a = """taint на ноде — это «отметка отторжения»: обычные поды на такую ноду не сядут. Чтобы посадить туда конкретный под (например, агент мониторинга), поду дают toleration — «разрешение терпеть этот taint».
Агенты на каждую ноду обычно оформляют как DaemonSet с нужными tolerations. Кроме taint, при выборе ноды scheduler смотрит ещё на запрошенные ресурсы, nodeSelector, affinity и приоритет пода.
Коротко: taint отталкивает поды, toleration разрешает конкретному поду сесть."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:191-208, 234-248"
kind = "М"
keys = [
  "toleration | толеран",
  "taint | отталкива | daemonset",
]
need = 1

[[card]]
id = "k8s-qos-eviction"
q = "QoS-классы подов: как их получить и кого выселят первым при нехватке памяти на ноде?"
a = """QoS-класс пода зависит от того, как заданы запросы (requests) и лимиты (limits) ресурсов.
BestEffort — не заданы ни requests, ни limits.
Burstable — requests меньше limits.
Guaranteed — requests равны limits.
Когда на ноде кончается память, поды выселяют именно в этом порядке: первыми BestEffort (им ничего не обещали), последними Guaranteed.
Коротко: класс задаётся requests/limits; при нехватке памяти первым выселяют BestEffort."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:191-208"
kind = "М"
keys = [
  "besteffort | без requests | нет лимит",
  "guaranteed | равны | requests = limits",
  "первым | выселя | evict",
]
need = 2

[[card]]
id = "k8s-cni-flannel"
q = "Написал NetworkPolicy, а трафик между подами всё равно ходит. Кластер на Flannel. Почему?"
a = """Kubernetes сам сеть не делает — это задача CNI-плагина. И не каждый плагин умеет сетевые политики. Flannel — простой плагин без их поддержки: NetworkPolicy ты написал, но применять её некому, поэтому трафик ходит свободно.
Нужен плагин, который умеет политики: Calico, Cilium или Canal.
Коротко: Flannel не умеет NetworkPolicy, применять её некому; нужен Calico/Cilium/Canal."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:209-221"
kind = "М"
keys = [
  "flannel | не поддерж | без политик | некому примен",
  "calico | cilium | canal | cni",
]

[[card]]
id = "k8s-statefulset-vs-deploy"
q = "Почему базу данных в Kubernetes кладут в StatefulSet, а не в Deployment?"
a = """В Deployment поды одинаковые и взаимозаменяемые: без своего имени и без привязки к конкретному диску. Базе данных так нельзя — ей нужно постоянство.
StatefulSet как раз даёт постоянство: у каждого пода стабильное имя, определённый порядок запуска и свой собственный диск (через volumeClaimTemplates). Для стабильных имён нужен headless Service.
Коротко: базе нужны стабильное имя, порядок и свой диск — это StatefulSet, а не Deployment."""
src = "kubernetes/теория/основы-абстракции-и-компоненты.md:234-248"
kind = "М"
keys = [
  "идентичн | стабильн имя | порядок",
  "свой pvc | свой диск | volumeclaimtemplate | headless",
]
