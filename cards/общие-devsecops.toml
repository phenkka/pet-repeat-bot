[[card]]
id = "secret-mgmt-general"
q = "Где должны жить секреты приложения и почему не в переменных окружения образа?"
a = """Не в коде и не зашиты в образ: `docker history` и `inspect` их показывают, они едут с образом везде.
Внешнее хранилище: Vault, Secret Manager, Kubernetes Secrets, секреты compose из файла. В приложение - в момент запуска. Плюс ротация и CI-проверка на утечки (gitleaks)."""
