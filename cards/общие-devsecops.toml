# Общие вопросы: эксплуатация, диагностика, основы. Что спрашивают на собесе
# помимо конкретного пайплайна.
# kind М: общие знания и методичка. keys: варианты через |.

[[card]]
id = "container-restart-loop"
q = "Контейнер всё время перезапускается (restarting). Твои шаги диагностики по порядку?"
a = """Контейнер в цикле перезапуска — смотрим по порядку, почему он падает.
1. `docker logs <имя>` — что приложение пишет перед смертью, обычно причина прямо там.
2. `docker ps -a` и `docker inspect` — код выхода и не стоит ли OOMKilled (убит по памяти).
3. `dmesg | grep -i oom` — не ядро ли убило по памяти.
4. Запустить руками без политики перезапуска и воспроизвести.
Типовое: нет нужной переменной или конфига, порт занят, приложение падает на старте, не хватило памяти (слишком низкий mem_limit).
Коротко: сначала логи, потом код выхода и OOM, потом ручной запуск; обычно конфиг, порт или память."""
src = "ci-cd/опыт/zap-dast-в-pipeline.md:163-184; linux/практика/1.10-логирование.md:242-261"
kind = "М"
keys = [
  "logs | логи | docker logs | что пишет",
  "inspect | код выхода | exit | oom | ps -a | память",
]

[[card]]
id = "container-exits-immediately"
q = "Контейнер стартует и сразу завершается (Exited 0), хотя должен работать. Почему?"
a = """Контейнер живёт ровно пока жив его главный процесс. Если тот завершился — контейнер встал, даже с кодом 0.
Частые причины: запущена команда, которая отработала и вышла (а не сервис, который должен висеть); демон ушёл в фон, а в контейнере надо оставаться на переднем плане (foreground); не та команда запуска (ENTRYPOINT/CMD).
Смотреть: `docker logs` и чем реально запускается главный процесс, не уходит ли он в фон.
Коротко: главный процесс завершился — контейнер встал; обычно это не сервис или уход в фон."""
src = "linux/практика/1.13-контейнеризация.md:55-66"
kind = "М"
keys = [
  "главн процесс | pid 1 | процесс закончил | процесс вышел | нет сервис | команда отработ",
  "foreground | в фон | демон | entrypoint | cmd | не держит",
]
need = 1

[[card]]
id = "vm-vs-container"
q = "Чем контейнер отличается от виртуальной машины на уровне ядра?"
a = """Виртуальная машина — это полноценный гость со своим собственным ядром поверх гипервизора. Тяжёлая, но изоляция полная.
Контейнер — это просто процесс хоста, ядро у него общее с хостом. Изоляцию дают namespaces (что видит) и cgroups (сколько ресурсов берёт). Поэтому контейнер легче и быстрее, но изоляция слабее: уязвимость в общем ядре бьёт по всем контейнерам.
Коротко: у ВМ своё ядро и полная изоляция, у контейнера ядро общее с хостом — легче, но изоляция слабее."""
src = "linux/практика/1.13-контейнеризация.md:25-54"
kind = "М"
keys = [
  "ядро | kernel | гипервизор | своё ядро | общее ядро",
  "namespace | cgroup | процесс хоста | легче | изоляц",
]

[[card]]
id = "namespaces-cgroups"
q = "За что в контейнерах отвечают namespaces, а за что cgroups?"
a = """Это два разных механизма ядра, на которых держатся контейнеры.
namespaces — изоляция видимости: у процесса свои процессы, своя сеть, свои точки монтирования, свои пользователи. Чужого он не видит.
cgroups — ограничение ресурсов: сколько процессу можно взять CPU, памяти, ввода-вывода.
Коротко: namespace отвечает «что я вижу», cgroup — «сколько я могу взять»."""
src = "linux/практика/1.13-контейнеризация.md:42-54"
kind = "М"
keys = [
  "namespace | видимост | изоляц | свой pid | сеть | не видит",
  "cgroup | ресурс | памят | cpu | ограничен | лимит",
]

[[card]]
id = "why-non-root-container"
q = "Почему контейнер нельзя запускать от root, если «он же изолирован»?"
a = """Ядро у контейнера общее с хостом. Поэтому root внутри контейнера — при нужных правах или при побеге — это настоящий root на хосте. Проверено руками в Kubernetes: привилегированный под писал прямо на файловую систему ноды.
И если в приложении найдут дыру (RCE), атакующий сразу получает root внутри контейнера: ставит инструменты, крадёт секреты, двигается дальше.
Защита: указать обычного пользователя (`USER` в Dockerfile), сбросить права (`cap_drop: ALL`), запретить их повышение (`no-new-privileges`).
Коротко: ядро общее, root в контейнере = root на хосте; запускать от обычного пользователя и резать права."""
src = "linux/практика/1.13-контейнеризация.md:836-880; kubernetes/опыт/k8s-защита-кластера.md"
kind = "С"
keys = [
  "общее ядро | root на хост | побег | это root | на ноде | privileged",
  "rce | капабилит | cap | user | минимальн прав",
]

[[card]]
id = "docker-sock-danger"
q = "Почему прокидывать `/var/run/docker.sock` в контейнер опасно?"
a = """Сокет docker.sock — это пульт управления демоном Docker. Доступ к нему = фактически root на хосте: через него можно запустить новый контейнер, примонтировать в него корень хоста и выйти наружу.
В CI это значит, что взломанная джоба получает весь сервер. Поэтому у тебя раннер работает через dind (свой Docker в песочнице), а не через сокет хоста.
Коротко: docker.sock = управление демоном = root на хосте; в CI через него уводят весь сервер."""
src = "ci-cd/опыт/gitlab-локальный-стенд-скрипт.md:53-58"
kind = "С"
keys = [
  "root на хост | управлен демон | весь хост | контроль docker | наружу | побег",
  "dind | не сокет | монтир корень | новый контейнер",
]
need = 1

[[card]]
id = "image-layer-order"
q = "Почему в Dockerfile зависимости ставят до копирования кода приложения?"
a = """Каждая инструкция Dockerfile создаёт слой, и слои кэшируются между сборками. Если скопировать весь код приложения ДО установки зависимостей, то любая правка кода сбрасывает кэш, и зависимости качаются и ставятся заново каждый раз.
Поэтому сначала копируют только файл со списком зависимостей (requirements.txt), ставят их, и лишь потом копируют код. Тогда правка кода не ломает кэш установки — сборка быстрее.
Коротко: сначала зависимости, потом код, иначе правка кода каждый раз пересобирает зависимости."""
src = "linux/практика/1.13-контейнеризация.md:519-571"
kind = "М"
keys = [
  "слой | кэш | layer | cache",
  "правк код | сбрасыва | заново | инвалид | не ломает кэш | быстрее сборк",
]

[[card]]
id = "service-unreachable"
q = "Сервис в контейнере не отвечает снаружи, хотя контейнер запущен. Как искать?"
a = """Контейнер запущен, а сервис снаружи не отвечает — проверяем снизу вверх.
1. Слушает ли процесс внутри контейнера (`ss -tlnp`).
2. Слушает на 0.0.0.0, а не на 127.0.0.1 — иначе снаружи контейнера его не видно.
3. Проброшен ли порт наружу (`docker ps`, флаг `-p`).
4. Не режет ли файрвол хоста. Правильный ли адрес и сеть.
Самая частая ошибка — приложение слушает localhost внутри контейнера, и поэтому снаружи недоступно.
Коротко: проверить, что процесс слушает на 0.0.0.0 и порт проброшен; частая ошибка — слушает localhost."""
src = "ci-cd/опыт/gitlab-локальный-стенд-скрипт.md:60-78; observability/опыт/opensearch-телеметрия-стенд.md:45-55"
kind = "С"
keys = [
  "слуша | listen | ss | netstat | 0.0.0.0 | localhost | 127",
  "порт | проброс | -p | docker ps | файрвол | сеть",
]

[[card]]
id = "linux-high-cpu"
q = "На сервере процесс ест 100% CPU. Как найти и что посмотреть, прежде чем убивать?"
a = """Процесс ест 100% CPU — сначала понять, кто и почему, и только потом убивать.
`top` или `htop` — кто ест, запоминаем номер процесса (PID). `ps -p <pid> -o cmd` — что это за процесс. Смотрим его логи, при необходимости `strace -p <pid>` — на чём он залип.
Убивать осознанно: обычный `kill` (сигнал SIGTERM, даёт процессу закрыться по-хорошему), а `kill -9` (SIGKILL, жёстко) только если не реагирует. Если убить, не поняв причину, он перезапустится и всё повторится.
Коротко: top → что за процесс → логи/strace → kill; сначала причина, потом kill -9."""
src = "linux/практика/1.7-процессы-потоки.md:129-171"
kind = "М"
keys = [
  "top | htop | pid | кто ест | нагрузк",
  "ps | что за процесс | логи | strace | причин",
  "kill | sigterm | sigkill | -9 | убить",
]
need = 2

[[card]]
id = "linux-disk-full"
q = "`No space left on device`, а по `df` диск вроде есть. Что ещё проверить?"
a = """Пишет «нет места», а `df` показывает свободное — значит, кончилось что-то другое.
`df -h` — само место на диске. `df -i` — inode (это «номерки» для файлов, их конечное число): если мелких файлов стало слишком много, место есть, а inode кончились.
Где жрёт место: `du -sh /* | sort -h`, обычно это логи и артефакты. Отдельный случай: файл удалили, но его держит открытым процесс — место не вернётся, пока процесс жив. Такие ищут `lsof | grep deleted`.
Коротко: проверить inode через df -i и удалённые-но-открытые файлы через lsof; место ищут через du."""
src = "linux/практика/1.2-файловая-система.md:42-74"
kind = "М"
keys = [
  "inode | df -i | мелк файл | кончил inode",
  "du | где жрёт | логи | lsof | deleted | открыт файл",
]
need = 1

[[card]]
id = "chmod-numbers"
q = "Права `640` на файле - кто что может? И почему конфиг с паролем лучше `600`?"
a = """Права из трёх цифр — это владелец, группа, остальные. Значения: 6 = чтение и запись, 4 = только чтение, 0 = ничего.
Значит, `640` — владелец читает и пишет, группа только читает, остальные ничего.
Конфиг с паролем лучше `600`: только владелец, даже группа не прочитает. Так другой пользователь на машине до секрета не доберётся.
Коротко: 640 — владелец rw, группа r, остальные ничего; секрет на 600, чтобы и группа не читала."""
src = "linux/практика/1.6-пользователи-группы-права.md"
kind = "С"
keys = [
  "владелец | группа | остальн | rw | чтение",
  "600 | только владелец | группа не | никто кроме",
]
need = 1

[[card]]
id = "tcp-handshake"
q = "Трёхстороннее рукопожатие TCP: какие три пакета и зачем вообще три, а не два?"
a = """Чтобы установить TCP-соединение, стороны обмениваются тремя пакетами: клиент шлёт SYN, сервер отвечает SYN-ACK, клиент отвечает ACK. Так обе стороны убеждаются, что и отправка, и приём работают в обе стороны.
Двух пакетов мало: после двух сервер ещё не знает, дошёл ли до клиента его ответ (SYN-ACK). Третий пакет это подтверждает — и обе стороны согласовали начальные номера пакетов.
Коротко: SYN → SYN-ACK → ACK; третий пакет подтверждает, что ответ сервера дошёл."""
src = "networks/протоколы/транспортный-уровень.md:23-61"
kind = "М"
keys = [
  "syn | syn-ack | ack",
  "обе сторон | подтвержд | номер последоват | сервер знает | согласова",
]
need = 1

[[card]]
id = "secret-mgmt-general"
q = "Где должны жить секреты приложения и почему не в переменных окружения образа?"
a = """Секреты приложения не должны лежать в коде и быть зашиты в образ: `docker history` и `docker inspect` их покажут, и они поедут с образом везде, куда он попадёт.
Правильно — внешнее хранилище: Vault, Secret Manager облака, Kubernetes Secrets или секрет compose из файла. Приложение получает секрет в момент запуска. Плюс ротация (регулярная замена) и проверка на утечки в CI (gitleaks).
Коротко: не в коде и не в образе (видно в inspect), а во внешнем хранилище и в приложение при запуске."""
