[[card]]
id = "chmod-numbers"
q = "Права `640` на файле - кто что может? И почему конфиг с паролем лучше `600`?"
a = """Три цифры: владелец, группа, остальные. 6=rw, 4=r, 0=нет. `640` - владелец читает и пишет, группа читает, остальные ничего.
Конфиг с секретом - `600`: только владелец, даже группа не читает. Чужой пользователь на машине секрет не достанет."""
src = "linux/практика/1.6-пользователи-группы-права.md"
kind = "С"
keys = [
  "владелец | группа | остальн | rw | чтение",
  "600 | только владелец | группа не | никто кроме",
]
