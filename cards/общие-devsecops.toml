# Общие вопросы: эксплуатация, диагностика, основы. Что спрашивают на собесе
# помимо конкретного пайплайна.
# kind М: общие знания и методичка. keys: варианты через |.

[[card]]
id = "container-restart-loop"
q = "Контейнер всё время перезапускается (restarting). Твои шаги диагностики по порядку?"
a = """1. `docker logs <имя>` - что пишет приложение перед падением.
2. `docker ps -a` и код выхода, `docker inspect` - OOMKilled, exit code.
3. Проверить `dmesg | grep -i oom` - не убило ли ядро по памяти.
4. Запустить руками без restart-политики, воспроизвести.
Типовое: нет переменной/конфига, порт занят, приложение падает на старте, не хватило памяти (mem_limit)."""
src = "работа/zap-dast-в-pipeline.md:163-184; linux/практика/1.10-логирование.md:242-261"
kind = "М"
keys = [
  "logs | логи | docker logs | что пишет",
  "inspect | код выхода | exit | oom | ps -a | память",
]

[[card]]
id = "container-exits-immediately"
q = "Контейнер стартует и сразу завершается (Exited 0), хотя должен работать. Почему?"
a = """Контейнер живёт, пока жив его главный процесс (PID 1). Процесс закончился - контейнер встал.
Частые причины: команда отработала и вышла (не сервис), демон ушёл в фон (а надо foreground), не тот ENTRYPOINT/CMD.
Смотреть: `docker logs`, чем запускается PID 1, не форкается ли процесс в фон."""
src = "linux/практика/1.13-контейнеризация.md:55-66"
kind = "М"
keys = [
  "главн процесс | pid 1 | процесс закончил | процесс вышел | нет сервис | команда отработ",
  "foreground | в фон | демон | entrypoint | cmd | не держит",
]
need = 1

[[card]]
id = "vm-vs-container"
q = "Чем контейнер отличается от виртуальной машины на уровне ядра?"
a = """ВМ - свой гость с собственным ядром поверх гипервизора, тяжёлая, полная изоляция.
Контейнер - процесс хоста, ядро общее с хостом, изоляция через namespaces и cgroups. Легче и быстрее, но изоляция слабее: уязвимость ядра - общая."""
src = "linux/практика/1.13-контейнеризация.md:25-54"
kind = "М"
keys = [
  "ядро | kernel | гипервизор | своё ядро | общее ядро",
  "namespace | cgroup | процесс хоста | легче | изоляц",
]

[[card]]
id = "namespaces-cgroups"
q = "За что в контейнерах отвечают namespaces, а за что cgroups?"
a = """Namespaces - изоляция видимости: свой PID, сеть, точки монтирования, пользователи. Процесс не видит чужого.
Cgroups - ограничение ресурсов: сколько CPU, памяти, IO процесс может взять.
Namespace отвечает «что вижу», cgroup - «сколько возьму»."""
src = "linux/практика/1.13-контейнеризация.md:42-54"
kind = "М"
keys = [
  "namespace | видимост | изоляц | свой pid | сеть | не видит",
  "cgroup | ресурс | памят | cpu | ограничен | лимит",
]

[[card]]
id = "why-non-root-container"
q = "Почему контейнер нельзя запускать от root, если «он же изолирован»?"
a = """Ядро общее с хостом. Root в контейнере с нужными capability или при побеге - это root на хосте. Проверено руками в Kubernetes: privileged-под писал на файловую систему ноды.
Любой RCE в приложении сразу даёт root внутри контейнера: установка инструментов, кража секретов, движение дальше.
Защита: `USER` в Dockerfile, `cap_drop: ALL`, `no-new-privileges`."""
src = "linux/практика/1.13-контейнеризация.md:836-880; работа/k8s-защита-кластера.md"
kind = "С"
keys = [
  "общее ядро | root на хост | побег | это root | на ноде | privileged",
  "rce | капабилит | cap | user | минимальн прав",
]

[[card]]
id = "docker-sock-danger"
q = "Почему прокидывать `/var/run/docker.sock` в контейнер опасно?"
a = """Доступ к docker.sock - это управление демоном Docker, то есть фактически root на хосте: можно запустить новый контейнер с монтированием корня хоста и выйти наружу.
В CI это значит, что скомпрометированная джоба получает весь хост. Поэтому у тебя раннер на dind, а не на сокете хоста."""
src = "работа/gitlab-локальный-стенд-скрипт.md:53-58"
