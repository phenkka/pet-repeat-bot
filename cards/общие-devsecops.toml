[[card]]
id = "image-layer-order"
q = "Почему в Dockerfile зависимости ставят до копирования кода приложения?"
a = """Каждая инструкция - слой, слои кэшируются. Если скопировать весь код до `pip install`, любая правка кода сбрасывает кэш и зависимости ставятся заново.
Сначала копируют только манифест (`requirements.txt`), ставят зависимости, потом код. Правка кода не ломает кэш установки - сборка быстрее."""
src = "linux/практика/1.13-контейнеризация.md:519-571"
kind = "М"
keys = [
  "слой | кэш | layer | cache",
  "правк код | сбрасыва | заново | инвалид | не ломает кэш | быстрее сборк",
]

[[card]]
id = "service-unreachable"
q = "Сервис в контейнере не отвечает снаружи, хотя контейнер запущен. Как искать?"
a = """Снизу вверх: процесс слушает внутри? (`ss -tlnp` в контейнере). Слушает на 0.0.0.0, а не на 127.0.0.1? (иначе снаружи не видно). Проброшен ли порт (`docker ps`, `-p`)? Файрвол хоста? Правильный ли адрес/сеть.
Частая ошибка: приложение слушает localhost внутри контейнера - снаружи недоступно."""
src = "работа/gitlab-локальный-стенд-скрипт.md:60-78; работа/opensearch-телеметрия-стенд.md:45-55"
