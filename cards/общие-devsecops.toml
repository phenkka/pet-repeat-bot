[[card]]
id = "linux-high-cpu"
q = "На сервере процесс ест 100% CPU. Как найти и что посмотреть, прежде чем убивать?"
a = """`top` или `htop` - кто ест, запомнить PID. `ps -p <pid> -o cmd` - что за процесс. Логи этого процесса, `strace -p <pid>` при необходимости - на чём залип.
Убивать осознанно: `kill` (SIGTERM, даёт закрыться), `kill -9` (SIGKILL) только если не реагирует. Сначала понять причину, иначе перезапустится и повторит."""
src = "linux/практика/1.7-процессы-потоки.md:129-171"
