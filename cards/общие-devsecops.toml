[[card]]
id = "pipeline-gate"
q = "Что такое гейт безопасности в CI/CD и чем он отличается от просто запуска сканера?"
a = """Сканер находит и отчитывается. Гейт - решение: по порогу (severity, число находок) он роняет пайплайн и не пускает дальше.
Без гейта сканер зелёный при любых находках, релиз уезжает. Гейт делает проверку обязательной. Порог настраивают, чтобы не блокировать на шуме (MEDIUM), но падать на CRITICAL/HIGH."""
src = "работа/gitlab-pipeline-гейты-безопасности.md:155-181"
kind = "С"
keys = [
  "роняет | блокир | не пуска | падает | останавл | решени | порог",
  "severity | critical | high | порог | не на шум | обязательн",
]

[[card]]
id = "shift-left"
q = "Что значит shift-left в безопасной разработке и зачем это нужно?"
a = """Сдвигать проверки безопасности раньше по конвейеру: pre-commit и SAST на код, а не только пентест готового приложения.
Чем раньше найдена уязвимость, тем дешевле правка: до коммита - минуты, в проде - инцидент. Поэтому гейты стоят на push, а не только на staging."""
