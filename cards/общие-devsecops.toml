[[card]]
id = "linux-disk-full"
q = "`No space left on device`, а по `df` диск вроде есть. Что ещё проверить?"
a = """Два разных исчерпания. `df -h` - место на диске. `df -i` - inode: мелких файлов стало слишком много, место есть, а inode кончились.
Где жрёт место: `du -sh /* | sort -h`, типично - логи и артефакты. Удалённый, но открытый процессом файл место не отдаёт, пока процесс жив: `lsof | grep deleted`."""
