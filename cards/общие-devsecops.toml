[[card]]
id = "tcp-handshake"
q = "Трёхстороннее рукопожатие TCP: какие три пакета и зачем вообще три, а не два?"
a = """SYN (клиент) -> SYN-ACK (сервер) -> ACK (клиент). Обе стороны подтверждают, что и шлют, и принимают.
Два мало: после двух сервер не знает, дошёл ли его SYN-ACK. Третий пакет это подтверждает - обе стороны согласовали начальные номера последовательности."""
src = "сети/протоколы/транспортный-уровень.md:23-61"
kind = "М"
keys = [
  "syn | syn-ack | ack",
  "обе сторон | подтвержд | номер последоват | сервер знает | согласова",
]
