[[card]]
id = "pipeline-gate"
q = "Что такое гейт безопасности в CI/CD и чем он отличается от просто запуска сканера?"
a = """Сканер просто находит проблемы и пишет отчёт — сам по себе он пайплайн не останавливает. Гейт — это решение поверх сканера: он смотрит на находки и по порогу (важность, количество) роняет пайплайн и не пускает релиз дальше.
Без гейта сканер остаётся зелёным при любых находках, и релиз спокойно уезжает. Гейт делает проверку обязательной. Порог настраивают так, чтобы не падать на мелочах (MEDIUM), но останавливаться на серьёзном (CRITICAL/HIGH).
Коротко: сканер находит, гейт по порогу роняет пайплайн; без гейта находки не останавливают релиз."""
src = "ci-cd/опыт/gitlab-pipeline-гейты-безопасности.md:155-181"
kind = "С"
keys = [
  "роняет | блокир | не пуска | падает | останавл | решени | порог",
  "severity | critical | high | порог | не на шум | обязательн",
]

[[card]]
id = "shift-left"
q = "Что значит shift-left в безопасной разработке и зачем это нужно?"
a = """Shift-left — сдвигать проверки безопасности ближе к началу разработки, а не оставлять их на пентест готового приложения. То есть pre-commit и SAST прямо по коду, на раннем этапе.
Смысл в деньгах и времени: чем раньше нашли уязвимость, тем дешевле исправить. До коммита — минуты правки, в проде — уже инцидент. Поэтому гейты ставят на push, а не только на staging.
Коротко: двигать проверки к началу (push, а не только staging); ранняя находка дешевле поздней."""
src = "security/devsecops/теория/классы-проверок-и-инструменты.md:199-210"
kind = "М"
keys = [
  "раньше | ранн | до коммит | левее | в начал конвейер | на push",
