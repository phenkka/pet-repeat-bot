# Собес: IaC (Terraform, Ansible). Вопросы ZUBAT, ответы пересказаны просто.
# kind М: чужой материал, руками не проверялось. keys: варианты через |.

[[card]]
id = "z-tfstate-secret"
q = "Почему state-файл Terraform - это секрет, и помогает ли `sensitive = true`?"
a = """В state Terraform записывает все атрибуты созданных ресурсов открытым текстом: пароли баз, приватные ключи, токены. Кто прочитал state — получил всё это.
`sensitive = true` только скрывает значение в выводе команды на экран. В state и в файле плана оно всё равно лежит.
Поэтому: state в удалённом хранилище с шифрованием (например, S3 + KMS), с версионированием и строгим доступом; в git не коммитить (*.tfstate и *.tfplan в .gitignore); руками не править. А лучше вообще не пропускать секреты через state — ephemeral-значения и write-only аргументы.
Коротко: в state пароли и ключи открытым текстом; sensitive прячет только вывод; хранить зашифрованно удалённо и не коммитить."""
src = "iac/теория/собес-zubat-terraform.md:193-208"
kind = "М"
keys = [
  "открыт | пароль | ключ | секрет",
  "только вывод | только экран | скрыва | не в state",
  "шифр | s3 | kms | удален | backend | gitignore",
]
need = 2

[[card]]
id = "z-tf-locking"
q = "Зачем нужна блокировка state в Terraform, и что делать, если lock завис?"
a = """Блокировка не даёт двум процессам (двум инженерам или двум джобам CI) одновременно делать plan/apply над одним state. Иначе они перезапишут изменения друг друга и испортят state. Terraform берёт lock сам перед любым изменением.
Раньше для S3 блокировку делали отдельной таблицей DynamoDB, с Terraform 1.10+ S3 умеет сам (`use_lockfile = true`).
Если процесс упал и lock остался — `terraform force-unlock LOCK_ID`, но только убедившись, что никто сейчас правда не работает. Подождать освобождения — `-lock-timeout=5m`.
Коротко: lock не даёт двум apply испортить один state; завис — force-unlock, только убедившись, что никто не работает."""
src = "iac/теория/собес-zubat-terraform.md:209-230"
kind = "М"
keys = [
  "одновремен | два процесс | параллельн | двух",
  "force-unlock | force unlock | unlock",
]

[[card]]
id = "z-tf-drift"
q = "Что такое drift в Terraform и как его ловить регулярно?"
a = """Drift — реальная инфраструктура разошлась с кодом и state: кто-то руками в консоли поменял security group или удалил ресурс.
Увидеть: `terraform plan -refresh-only` — чем реальность отличается от state. Дальше либо поправить код под реальность, либо обычным apply вернуть всё как описано.
Ловить регулярно: по расписанию в CI `terraform plan -detailed-exitcode`. Код 0 — расхождений нет, 1 — ошибка, 2 — есть изменения, и по нему шлют алерт. Для безопасности это важно: ручная правка — это и открытый «временно» порт, который все забыли.
Коротко: drift — ручные изменения мимо кода; plan -refresh-only; регулярно — plan -detailed-exitcode, код 2 = расхождение."""
src = "iac/теория/собес-zubat-terraform.md:231-242"
kind = "М"
keys = [
  "вручн | руками | расхожд | консол",
  "refresh-only | refresh only | detailed-exitcode | detailed exitcode | код 2",
]

[[card]]
id = "z-tf-count-vs-foreach"
q = "В Terraform удалили элемент из середины списка, а план хочет пересоздать половину ресурсов. Почему?"
a = """С count ресурсы адресуются по номеру: vm[0], vm[1], vm[2]. Удалил "b" из ["a", "b", "c"] — и "c" сдвинулся с номера 2 на номер 1. Terraform видит: vm[1] теперь должен быть другим, а vm[2] больше не нужен. Он изменит или пересоздаст vm[1] и удалит vm[2] — вместо того, чтобы удалить только "b".
С for_each ключом служит само значение: vm["a"], vm["c"]. Удаление "b" трогает только "b".
count оставляют для одинаковых взаимозаменяемых ресурсов и для «создать или нет» (`count = var.enabled ? 1 : 0`).
Коротко: count адресует по номеру — удаление из середины сдвигает номера; for_each адресует по ключу, адреса стабильны."""
src = "iac/теория/собес-zubat-terraform.md:306-324"
kind = "М"
keys = [
  "индекс | номер | сдвиг",
  "for_each | for each | ключ",
]

[[card]]
id = "z-tf-lock-hcl"
q = "Что такое .terraform.lock.hcl, и почему его коммитят в git?"
a = """В .terraform.lock.hcl Terraform записывает точные выбранные версии провайдеров и их хэши.
Его коммитят, чтобы у всех разработчиков и в CI были одни и те же провайдеры. Это как lock-файл для зависимостей: без него каждый `init` может скачать новую версию — и поведение изменится незаметно. А хэши защищают от подмены: скачанный провайдер должен совпасть с записанным отпечатком.
Обновлять осознанно: `terraform init -upgrade`. Модули фиксируют через version (из registry) или ref на тег или SHA (из git).
Коротко: lock.hcl — точные версии и хэши провайдеров; коммитят, чтобы у всех одно и то же и подмену было видно."""
src = "iac/теория/собес-zubat-terraform.md:325-345"
kind = "М"
keys = [
  "верси | провайдер",
  "хэш | хеш | одинаков | у всех | подмен",
]

[[card]]
id = "z-tf-ephemeral"
q = "Чем в Terraform `ephemeral` отличается от `sensitive`?"
a = """sensitive = true только прячет значение при выводе на экран. В state и в plan оно сохраняется открытым текстом.
ephemeral (Terraform 1.10+) — значение существует только во время выполнения и не пишется ни в plan, ни в state. Например, пароль базы генерируется ephemeral-ресурсом и передаётся в write-only аргумент (`password_wo`) — Terraform его отдал и забыл. Чтобы потом сменить пароль, увеличивают парный `password_wo_version`.
Коротко: sensitive прячет только вывод, в state значение остаётся; ephemeral в state и plan вообще не попадает."""
src = "iac/теория/собес-zubat-terraform.md:435-458"
kind = "М"
keys = [
  "sensitive | вывод | экран",
  "ephemeral | не пиш | не попада | не сохраня",
]

[[card]]
id = "z-tf-ci-plan-apply"
q = "Как устроить безопасный CI/CD для Terraform? Почему apply делают из сохранённого плана?"
a = """На merge request: fmt и validate, tflint; сканер конфигурации (Checkov, trivy config); `terraform plan -out=tfplan` и план комментарием в MR; проверка политик по плану (OPA/Conftest: «нет публичных бакетов», «обязательные теги»).
После ревью — `terraform apply tfplan`. Именно сохранённый план: тогда применяется ровно то, что проверили люди и политики. Если делать apply заново, за это время код или реальность могли поменяться, и применится не то, что одобрили.
Доступ CI к облаку — через OIDC без постоянных ключей, параллельные apply в один state запрещены. Atlantis делает то же по командам в комментариях MR.
Коротко: plan → ревью и политики → apply именно этого tfplan; так применяется то, что проверили; доступ через OIDC."""
src = "iac/теория/собес-zubat-terraform.md:496-508"
kind = "М"
keys = [
  "plan | tfplan | сохранен план",
  "провер | ревью | одобр | политик | opa",
  "oidc | checkov | trivy | atlantis",
]
