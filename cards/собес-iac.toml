[[card]]
id = "z-ansible-agentless"
q = "Ansible работает по push или pull, и что нужно на управляемом хосте?"
a = """По умолчанию push и без агента: управляющая машина подключается к хостам по SSH, копирует туда код модуля на Python, выполняет и забирает результат. На хосте нужны только SSH-доступ и Python.
Плюс для безопасности: на сервере нет постоянно работающего агента с правами root, который можно атаковать. Минус: у управляющей машины ключи ко всем серверам — её надо беречь.
Есть и pull — ansible-pull: хост сам по cron забирает плейбуки из git и применяет к себе.
Коротко: push по SSH без агента, на хосте нужен только SSH и Python; управляющая машина с ключами — ценная цель."""
src = "iac/теория/собес-zubat-ansible.md:116-125"
kind = "М"
keys = [
  "push",
  "ssh",
  "без агент | агент не нуж | python",
]
