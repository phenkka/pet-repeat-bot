[[card]]
id = "z-ansible-idempotent"
q = "Что такое идемпотентность в Ansible, и почему с модулями command и shell она ломается?"
a = """Идемпотентность — повторный запуск плейбука на уже настроенной системе ничего не меняет (changed=0). Обычные модули (package, copy, template, user) сначала проверяют текущее состояние и действуют только если оно не то.
command и shell проверять не умеют: они всегда выполняют команду и всегда пишут changed. Повторный запуск может сломать систему (например, второй раз выполнить kubeadm init).
Чинят так: `creates: /etc/kubernetes/admin.conf` — не выполнять, если файл уже есть; `changed_when: false` для команд, которые только читают; changed_when и failed_when по выводу. А лучше взять нужный модуль вместо команды.
Коротко: повторный запуск ничего не меняет; command/shell всегда changed — нужны creates, changed_when или настоящий модуль."""
src = "iac/теория/собес-zubat-ansible.md:126-149"
kind = "М"
keys = [
  "повторн | ничего не меня | changed 0",
  "creates | changed_when | changed when | removes | модул",
]

[[card]]
id = "z-ansible-handlers"
q = "Как работают handlers и notify в Ansible, и когда handler не выполнится?"
a = """Handler — задача, которая запускается, только если её уведомила (notify) задача со статусом changed. Классика: поменялся конфиг nginx — перезагрузить nginx. Конфиг не менялся — перезагрузки нет.
Особенности: handler выполнится один раз, сколько бы задач его ни позвали, и по умолчанию в конце play, а не сразу. Раньше — через `meta: flush_handlers`.
Подвох: если play упал посередине, накопленные handlers не выполнятся — конфиг уже новый, а сервис не перезагружен. Спасает `force_handlers: true`.
Коротко: handler запускается по notify от changed-задачи, один раз и в конце play; при падении play не выполнится без force_handlers."""
src = "iac/теория/собес-zubat-ansible.md:168-190"
kind = "М"
keys = [
  "changed | notify | уведом",
  "один раз | в конце | конце play",
  "упал | force_handlers | не выполн",
]
need = 2

[[card]]
id = "z-ansible-vault"
q = "Как хранить секреты для Ansible в git, и что сделать, чтобы они не утекли в логи?"
a = """Ansible Vault шифрует файлы переменных или отдельные значения: `ansible-vault create group_vars/prod/vault.yml`, `ansible-vault encrypt_string 'S3cr3t' --name 'db_password'`. Запуск — с `--ask-vault-pass` или `--vault-id prod@файл`.
Практики: открытый vars.yml ссылается на зашифрованный vault.yml (`db_password: "{{ vault_db_password }}"`) — поиск по именам переменных работает; разные пароли Vault для разных окружений.
Чтобы не утекло в логи: на задачах с секретами `no_log: true` — иначе значение покажется в выводе плейбука и в логах CI.
Альтернатива — вообще не хранить в репозитории, а брать из HashiCorp Vault через lookup.
Коротко: ansible-vault шифрует переменные; разные пароли на окружения; no_log: true, чтобы секрет не попал в вывод."""
src = "iac/теория/собес-zubat-ansible.md:262-285"
kind = "М"
keys = [
  "ansible-vault | vault | шифр",
  "no_log | no log | вывод | лог",
]
