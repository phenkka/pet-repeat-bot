# Свои сокращения: слово в ответе = чем его считать.
# Опечатки сюда не нужны, их прощает сравнение. Сюда то, что не похоже
# на исходное слово: «прст», «тк», «дт». Пополняется по спорам (/disputes).

[alias]
"прст" = "просто"
"тк" = "так как"
"ссш" = "ssh"
"дт" = "dependency track"
"мб" = "может быть"
"чтоб" = "чтобы"
