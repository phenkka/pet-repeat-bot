# Собес: мониторинг и SRE. Вопросы ZUBAT, ответы пересказаны просто.
# kind М: чужой материал, руками не проверялось. keys: варианты через |.

[[card]]
id = "z-use-red"
q = "Что такое методы USE и RED, и для чего каждый?"
a = """USE — для ресурсов (CPU, диск, сеть, память, пул соединений): Utilization — насколько занят, Saturation — есть ли очередь ожидания, Errors — ошибки.
RED — для сервисов, которые обрабатывают запросы: Rate — сколько запросов в секунду, Errors — доля ошибок, Duration — время ответа (перцентили).
Golden Signals от Google — по сути RED плюс насыщенность: задержка, трафик, ошибки, насыщение.
Простое правило: смотришь на железо — USE, смотришь на сервис глазами пользователя — RED.
Коротко: USE (загрузка, очередь, ошибки) — для ресурсов; RED (запросы, ошибки, время ответа) — для сервисов."""
src = "observability/теория/собес-zubat-observability.md:51-66"
kind = "М"
keys = [
  "use | utilization | saturation | ресурс",
  "red | rate | duration | сервис",
]

[[card]]
id = "z-prometheus-pull"
q = "Prometheus сам забирает метрики (pull). Какие у этого плюсы и минусы?"
a = """Prometheus по расписанию сам ходит по HTTP на /metrics каждой цели и сохраняет данные у себя.
Плюсы: он знает список целей и сразу видит, что цель недоступна (метрика up == 0) — при push молчание цели не отличить от «всё хорошо»; метрики легко посмотреть руками (`curl host:9100/metrics`); нагрузку регулирует сам сервер мониторинга.
Минусы: цели должны быть доступны по сети с Prometheus (NAT и файрволы мешают); неудобно для коротких задач — они успевают закончиться до опроса (для них Pushgateway); один Prometheus хранит данные локально и растёт только вверх.
Коротко: pull сразу видит недоступную цель (up == 0) и легко проверяется curl; но цели должны быть доступны, а короткие задачи — через Pushgateway."""
src = "observability/теория/собес-zubat-observability.md:81-98"
kind = "М"
keys = [
  "up | недоступн | видит что цель",
  "доступн по сети | nat | файрвол | pushgateway | коротк",
]

[[card]]
id = "z-cardinality"
q = "Что такое кардинальность в Prometheus, и почему user_id или IP в метке может уронить мониторинг?"
a = """Каждая уникальная комбинация меток у метрики — отдельный временной ряд. Кардинальность — число таких рядов. Пример: 5 методов × 200 путей × 10 кодов × 50 подов = 500 тысяч рядов.
Если положить в метку что-то почти уникальное — user_id, request_id, IP клиента, полный URL с параметрами — рядов становится миллионы. Prometheus держит активные ряды в памяти: растёт RAM, тормозят запросы, Prometheus падает по OOM. Мониторинг умирает как раз когда он нужен.
Лечение: убрать такую метку в коде, нормализовать путь (/users/{id}), выкинуть метку через metric_relabel_configs, ограничить sample_limit.
Коротко: каждая комбинация меток — ряд в памяти; уникальные метки (user_id, IP) дают миллионы рядов и OOM Prometheus."""
src = "observability/теория/собес-zubat-observability.md:112-126"
kind = "М"
keys = [
  "ряд | комбинац | series",
  "памят | ram | oom | падает",
  "уникальн | user_id | ip | request_id | url",
]
need = 2

[[card]]
id = "z-alert-for"
q = "Зачем в правиле алерта Prometheus параметр `for`?"
a = """Без for алерт срабатывает при первом же совпадении условия — даже от секундного всплеска. Получается флаппинг: алерт то загорается, то гаснет, и дежурный перестаёт им верить.
С `for: 10m` условие должно держаться непрерывно 10 минут. До этого алерт в состоянии pending, после — firing и уходит в Alertmanager.
Ещё хорошо к алерту приложить runbook_url — ссылку на инструкцию, что делать. Проверить правила: `promtool check rules`.
Коротко: for — сколько условие должно держаться, прежде чем алерт сработает; защита от флаппинга на коротких всплесках."""
src = "observability/теория/собес-zubat-observability.md:189-215"
kind = "М"
keys = [
  "держаться | непрерывн | сколько времен | длительн",
  "флаппинг | всплеск | кратковремен | pending",
]

[[card]]
id = "z-alertmanager"
q = "Что делает Alertmanager: grouping, inhibition и silences?"
a = """Alertmanager принимает алерты от Prometheus, убирает дубли, группирует и рассылает по получателям (Telegram, Slack, почта).
Grouping — похожие алерты собираются в одно сообщение (по group_by). Упал кластер — придёт одно сообщение, а не сто.
Inhibition — подавление одних алертов другими. Нода лежит — не надо слать предупреждения по каждому сервису на ней.
Silences — ручное временное заглушение по признакам, например на время плановых работ: `amtool silence add alertname="DiskFull" --duration=2h`.
Коротко: grouping — сто алертов в одно сообщение, inhibition — главный алерт глушит следствия, silence — заглушить на время работ."""
src = "observability/теория/собес-zubat-observability.md:216-241"
kind = "М"
keys = [
  "group | одно сообщен | объедин",
  "inhibit | подавл",
  "silence | заглуш | плановы",
]
need = 2

[[card]]
id = "z-structured-logs"
q = "Чем структурированные логи лучше текстовых, и чего в них не должно быть?"
a = """Структурированный лог — запись в JSON с постоянными полями: время, уровень, сервис, trace_id, сообщение. Не надо писать хрупкие регулярки для разбора текста; можно фильтровать и считать по полям; по trace_id легко связать лог с трейсом запроса.
Практики: писать в stdout (в контейнерах), одинаковые имена полей во всех сервисах, уровни логирования.
В логах не должно быть секретов и персональных данных: пароли, токены, номера карт маскируют. Логи уезжают в общее хранилище, доступ к которому есть у многих, — секрет в логе считай утёкшим.
Коротко: JSON с постоянными полями — фильтруется без регулярок и связывается по trace_id; секреты и персональные данные не писать."""
src = "observability/теория/собес-zubat-observability.md:340-353"
kind = "М"
keys = [
  "json | поля | без регуляр | машиночит",
  "секрет | парол | токен | персональн | маскир",
]

[[card]]
id = "z-slo-burn-rate"
q = "Что такое error budget и burn rate, и почему алертят по ним, а не по «CPU больше 80%»?"
a = """SLO 99.9% за 30 дней значит, что 0.1% запросов можно испортить — это error budget (бюджет ошибок).
Burn rate — во сколько раз быстрее нормы тратится бюджет. Burn rate 1 — бюджет кончится ровно к концу месяца; 14.4 — примерно за 2 дня.
Алертят по скорости сгорания бюджета, потому что это прямо про пользователей. CPU 80% может ничего не значить для клиентов, а может ничего не показать при реальном сбое. Схема из Google SRE: burn rate 14.4 за час и 5 минут — будить дежурного; медленное сгорание за 3 дня — тикет. Короткое окно нужно, чтобы алерт быстро погас после починки.
Коротко: бюджет ошибок — сколько можно испортить по SLO; burn rate — скорость его траты; алерт по нему — про пользователей, а не про CPU."""
src = "observability/теория/собес-zubat-observability.md:476-497"
kind = "М"
keys = [
  "budget | бюджет",
  "burn | скорост | быстрее | трат",
  "пользовател | симптом | не про cpu",
]
need = 2

[[card]]
id = "z-alert-fatigue"
q = "Что такое alert fatigue и как с ним бороться?"
a = """Алертов так много, и большая часть не требует действий, что дежурные начинают их игнорировать и пропускают настоящий сбой.
Что делать:
алертить по симптомам, которые видят пользователи (ошибки, задержка, SLO), а не по каждой причине — причины на дашборды;
каждый алерт, который будит человека, должен требовать действия и иметь runbook;
разделять срочное (будить ночью) и несрочное (тикет на утро);
for и окна побольше против флаппинга; группировка и подавление в Alertmanager;
регулярно разбирать: какие алерты срабатывали и сколько привели к действию. Шумные — чинить или удалять.
Коротко: шум приучает игнорировать алерты; алертить по симптомам, только actionable с runbook, разделять срочность, чистить шумные."""
src = "observability/теория/собес-zubat-observability.md:498-511"
kind = "М"
keys = [
  "игнорир | пропуска | шум | слишком много",
  "симптом | actionable | действи | runbook",
  "severity | срочн | тикет | удаля | чинить",
]
need = 2

[[card]]
id = "z-deadman-switch"
q = "Как узнать, что сломался сам мониторинг, если он же должен об этом сообщить?"
a = """Dead man's switch (watchdog): алерт, который горит всегда (`expr: vector(1)`) и постоянно уходит во внешний сервис (Healthchecks.io, PagerDuty heartbeat). Пока сигналы приходят — всё живо. Перестали приходить — сломался Prometheus, Alertmanager или доставка, и внешний сервис поднимет тревогу сам.
Плюс: два Prometheus, которые смотрят друг на друга; Alertmanager в кластере; алерты на метрики самого Prometheus (ошибки правил, потерянные уведомления); внешняя проверка из другой площадки — если упал весь ЦОД вместе с мониторингом.
Коротко: dead man's switch — вечный алерт во внешний сервис; пропал сигнал — мониторинг сломан; плюс HA-пара и проверка снаружи."""
src = "observability/теория/собес-zubat-observability.md:512-528"
kind = "М"
keys = [
  "dead man | watchdog | всегда горит | вечн | heartbeat",
  "внешн | снаружи | другой площадк",
]

[[card]]
id = "z-sli-slo-sla"
q = "Чем SLI, SLO и SLA отличаются друг от друга?"
a = """SLI — измеряемый показатель качества: доля успешных запросов, время ответа.
SLO — внутренняя цель по этому показателю: 99.9% запросов успешны за 30 дней.
SLA — договор с клиентом с последствиями: не выполнили — платим компенсацию.
SLO ставят строже SLA, чтобы успеть заметить и починить раньше, чем нарушится договор.
Коротко: SLI — что измеряем, SLO — наша цель, SLA — обещание клиенту с деньгами; SLO строже SLA."""
src = "sre/теория/собес-zubat-senior-sre.md:173-180"
