[[card]]
id = "z-rto-rpo"
q = "Что такое RTO и RPO, и как они определяют, какой нужен бэкап?"
a = """RPO — сколько данных можно потерять, считая во времени. RPO 1 час: при аварии допустимо потерять последний час изменений.
RTO — сколько можно восстанавливаться. RTO 4 часа: через 4 часа сервис должен снова работать.
Отсюда выбор бэкапа: RPO сутки — хватит ночного дампа; RPO минуты — нужен непрерывный архив журнала (WAL) или реплика. RTO минуты — нужна готовая реплика для переключения, а восстановление большого бэкапа с нуля займёт часы. И RTO надо проверять реальным восстановлением, а не верить на слово.
Коротко: RPO — сколько данных можно потерять, RTO — сколько можно лежать; RPO задаёт частоту бэкапа, RTO — способ восстановления."""
src = "sre/теория/собес-zubat-senior-sre.md:457-463"
kind = "М"
keys = [
  "rpo | потер данн | сколько данн",
  "rto | время восстанов | сколько лежать | сколько восстанав",
]

[[card]]
id = "z-circuit-breaker"
q = "Что такое circuit breaker и от какого сбоя он защищает?"
a = """Внешний сервис начал тормозить или падать. Если продолжать слать ему запросы, наши потоки и соединения висят в ожидании, кончаются — и падаем уже мы. Так сбой одного сервиса каскадом валит всех.
Circuit breaker («автомат-предохранитель») считает ошибки. Closed — обычная работа. Ошибок стало много — Open: запросы к сервису сразу отклоняются, не ожидая таймаута (можно отдать запасной ответ). Через время — Half-Open: пропускается немного запросов на пробу; прошли — снова Closed.
Коротко: при частых ошибках перестаёт слать запросы к больному сервису и сразу отказывает; защищает от каскадного отказа."""
src = "sre/теория/собес-zubat-senior-sre.md:420-429"
kind = "М"
keys = [
  "каскад | валит всех | распростран",
  "closed | open | half | размыка | перестает слать",
]
