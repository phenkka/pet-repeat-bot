[[card]]
id = "z-docker-disk-full"
q = "На сервере кончилось место из-за Docker. Что чаще всего виновато и как не допустить повторения?"
a = """Смотреть: `docker system df -v` — образы, контейнеры, volumes, кэш сборки; размер логов `du -sh /var/lib/docker/containers/*/*-json.log`.
Самая частая причина — логи: драйвер json-file по умолчанию пишет без ротации, лог растёт бесконечно.
Лечить: в /etc/docker/daemon.json задать ротацию `"log-opts": {"max-size": "10m", "max-file": "3"}`. Подвох: действует только на новые контейнеры, старые надо пересоздать.
Чистить: `docker image prune -a`, `docker builder prune`. Осторожно с `docker system prune -a --volumes` — удалит и volumes, то есть данные.
Коротко: обычно логи json-file без ротации; max-size/max-file в daemon.json (только для новых контейнеров); prune осторожно с --volumes."""
src = "docker/теория/собес-zubat-docker.md:604-622"
kind = "М"
keys = [
  "лог | json-file | json file",
  "ротац | max-size | max size | daemon.json",
  "prune | volumes | данн",
]
need = 2
