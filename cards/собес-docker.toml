[[card]]
id = "z-volume-bind-tmpfs"
q = "volume, bind mount, tmpfs - чем отличаются и что брать для данных БД, конфига и секрета?"
a = """volume — хранилище, которым управляет Docker. Переживает удаление контейнера, не зависит от путей на хосте. Для данных БД.
bind mount — произвольный путь хоста прямо в контейнер. Удобно для конфига (лучше только на чтение). Но зависит от прав и UID на хосте и может дать контейнеру доступ к важным путям хоста — монтировать осторожно.
tmpfs — в оперативной памяти, пропадает при остановке. Для временного и для секретов, которые не должны попасть на диск. Вместе с `--read-only` даёт место для записи в /tmp.
Коротко: volume — данные БД; bind — конфиг с хоста (осторожно, доступ к хосту); tmpfs — в памяти, для временного и секретов."""
src = "docker/теория/собес-zubat-docker.md:463-475"
kind = "М"
keys = [
  "volume | бд | данные",
  "bind | хост | путь",
  "tmpfs | памят",
]
