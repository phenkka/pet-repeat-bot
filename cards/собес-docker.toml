[[card]]
id = "z-compose-depends-healthy"
q = "В Compose приложение стартует раньше, чем база готова, и падает. depends_on же стоит. Почему и как правильно?"
a = """Простой depends_on задаёт только порядок запуска: контейнер базы запущен — а готова ли сама база принимать подключения, он не проверяет.
Правильно: у базы healthcheck (для postgres — `pg_isready`), а у приложения `depends_on: db: condition: service_healthy`. Для миграций — `condition: service_completed_successfully`: приложение стартует, только когда миграции успешно отработали.
И всё равно приложение должно уметь переподключаться к базе — она может перезапуститься и потом.
Коротко: depends_on — только порядок запуска; нужен healthcheck у базы и condition: service_healthy."""
src = "docker/теория/собес-zubat-docker.md:555-583"
kind = "М"
keys = [
  "порядок | только запуск | не готовност",
  "service_healthy | healthcheck | healthy | condition",
]

[[card]]
id = "z-debug-no-shell"
q = "Как отлаживать контейнер, в образе которого нет shell и утилит (distroless)?"
a = """Не ставить утилиты в образ, а прийти со своими.
Запустить отладочный контейнер в namespace целевого: `docker run --rm -it --pid=container:app --network=container:app nicolaka/netshoot` — видно процессы и сеть app, его файлы через /proc/<pid>/root.
С хоста через nsenter: узнать PID (`docker inspect -f '{{.State.Pid}}' app`), затем `nsenter -t PID -n ss -tlnp` — сеть контейнера, утилиты хоста.
Плюс docker logs, docker inspect, docker cp — забрать файл.
В Kubernetes то же делает `kubectl debug` с эфемерным контейнером.
Коротко: приходить со своими утилитами — отладочный контейнер в его namespace (--pid/--network=container:) или nsenter с хоста."""
src = "docker/теория/собес-zubat-docker.md:584-603"
kind = "М"
