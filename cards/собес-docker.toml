[[card]]
id = "z-user-bridge-dns"
q = "Почему контейнеры в сети по умолчанию не видят друг друга по имени, а в своей сети видят?"
a = """В пользовательской bridge-сети (`docker network create app-net`) работает встроенный DNS Docker: контейнеры находят друг друга по имени контейнера или сервиса. В сети по умолчанию (docker0) такого DNS нет — только по IP.
Ещё пользовательская сеть даёт изоляцию: контейнеры из разных сетей друг друга не видят. Docker Compose сам создаёт такую сеть на проект, поэтому сервисы там обращаются друг к другу по имени (`DB_HOST=db`).
Коротко: DNS по именам есть только в пользовательской сети; там же изоляция от других сетей; compose создаёт её сам."""
src = "docker/теория/собес-zubat-docker.md:448-462"
