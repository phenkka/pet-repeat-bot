[[card]]
id = "z-cmd-vs-entrypoint"
q = "Чем CMD отличается от ENTRYPOINT в Dockerfile, и как они работают вместе?"
a = """ENTRYPOINT — что запускается всегда, это сама программа контейнера. CMD — аргументы по умолчанию, их легко заменить.
`docker run образ другие аргументы` заменяет CMD, а ENTRYPOINT остаётся. Чтобы заменить ENTRYPOINT, нужен отдельный флаг `--entrypoint`.
Вместе: ENTRYPOINT ["ping"] и CMD ["8.8.8.8"] — по умолчанию пингует 8.8.8.8, а `docker run образ 1.1.1.1` пингует другой адрес.
Коротко: ENTRYPOINT — сама программа, остаётся всегда; CMD — аргументы по умолчанию, заменяются аргументами docker run."""
src = "docker/теория/собес-zubat-docker.md:54-191"
kind = "М"
keys = [
  "entrypoint | всегда | программ",
  "cmd | аргумент | по умолчан | заменя | переопредел",
]

[[card]]
id = "z-copy-vs-add"
q = "Чем COPY отличается от ADD, и почему обычно советуют COPY?"
a = """COPY просто копирует файлы из контекста сборки в образ.
ADD умеет больше: сам распаковывает tar-архивы и может скачивать файлы по URL. Из-за этой «магии» легко получить неожиданное: архив распаковался, хотя ты хотел положить его как есть, или в образ скачалось что-то без проверки контрольной суммы.
Поэтому по умолчанию COPY — он делает ровно то, что написано. ADD — только когда нужна именно распаковка.
Коротко: COPY только копирует; ADD ещё распаковывает tar и качает по URL — из-за неявности советуют COPY."""
src = "docker/теория/собес-zubat-docker.md:192-197"
kind = "М"
keys = [
  "copy | копир",
  "распаков | tar | url | скачива",
]

[[card]]
id = "z-overlay-cow"
q = "Как устроена файловая система контейнера (overlay2) и почему базе данных нельзя писать в слой контейнера?"
a = """overlay2 складывает несколько каталогов в одно дерево: снизу слои образа (только чтение, общие для всех контейнеров из этого образа), сверху тонкий слой контейнера для записи. Процесс видит их объединённо.
Copy-on-write: при первом изменении файла из нижнего слоя он целиком копируется наверх. Удаление файла снизу только ставит наверху пометку «удалён» — место не освобождается.
Базе данных так нельзя: каждое изменение большого файла — копирование, это медленно, и данные пропадут вместе с контейнером. Данные кладут в volume.
Коротко: слои образа только на чтение + тонкий слой записи; изменение копирует файл наверх (CoW); данные БД — в volume."""
src = "docker/теория/собес-zubat-docker.md:250-262"
kind = "М"
keys = [
  "слой | layer | только чтен",
  "копир | copy on write | cow",
  "volume | том | пропад",
]
need = 2

[[card]]
id = "z-multi-stage"
q = "Что такое multi-stage build и что он даёт с точки зрения безопасности?"
a = """В одном Dockerfile несколько FROM. В первой стадии есть компилятор, SDK, dev-зависимости — там собирается программа. В финальную стадию копируется только готовый результат (`COPY --from=build`).
В итоговый образ не попадают инструменты сборки, исходники и всё, что было в промежуточных стадиях. Образ меньше, и у атакующего меньше инструментов внутри: нет компилятора, пакетного менеджера, а с distroless даже shell.
Коротко: собираем в одной стадии, в финальную копируем только результат — образ меньше, инструментов для атаки нет."""
src = "docker/теория/собес-zubat-docker.md:291-307"
kind = "М"
keys = [
  "несколько from | стади | stage",
  "только результат | артефакт | без инструмент | компилятор | меньше",
]

[[card]]
id = "z-dockerignore"
q = "Что такое build context, и почему без .dockerignore `COPY . .` опасна?"
a = """Build context — все файлы каталога, которые отдаются сборщику при `docker build .`. COPY и ADD берут файлы только оттуда.
Без .dockerignore `COPY . .` утащит в образ всё подряд: .git со всей историей (и секретами из неё), локальный .env с паролями, ключи, дампы. А образ потом уезжает в registry, где его видят многие.
В .dockerignore пишут .git, .env, node_modules, логи. Заодно сборка быстрее, и кэш не сбрасывается из-за посторонних файлов.
Коротко: контекст — всё, что видит сборка; без .dockerignore в образ попадут .git, .env и ключи."""
src = "docker/теория/собес-zubat-docker.md:341-361"
kind = "М"
keys = [
  "git | env | ключ | секрет | парол",
  "контекст | context | все файлы",
]

[[card]]
id = "z-shell-vs-exec-form"
q = "Контейнер останавливается 10 секунд и умирает «грязно». Причём тут shell form в CMD и PID 1?"
a = """exec form `CMD ["nginx", "-g", "daemon off;"]` — программа запускается сама и становится PID 1.
shell form `CMD nginx -g 'daemon off;'` — запускается `/bin/sh -c ...`, и PID 1 становится shell.
docker stop шлёт SIGTERM процессу PID 1, ждёт 10 секунд и бьёт SIGKILL. В shell form SIGTERM получает sh, а он обычно не передаёт его приложению. Приложение ничего не знает, через 10 секунд его убивают — без корректного завершения.
Ещё у PID 1 особенность: без своего обработчика он игнорирует SIGTERM, и он должен убирать зомби. Решения: exec form, `exec "$@"` в entrypoint-скрипте, `docker run --init` (tini).
Коротко: в shell form PID 1 — это sh, он не передаёт SIGTERM; через 10 с SIGKILL; нужен exec form или --init."""
src = "docker/теория/собес-zubat-docker.md:362-372"
kind = "М"
keys = [
  "pid 1 | pid1",
  "sigterm | сигнал",
  "exec form | exec | init | tini",
]
need = 2

[[card]]
id = "z-exit-codes"
q = "Контейнер завершился с кодом 137, 143 или 139. Что значит каждый?"
a = """Код больше 128 значит «убит сигналом»: вычти 128 — получишь номер сигнала.
137 = 128 + 9 (SIGKILL): убит OOM killer по лимиту памяти, или docker kill, или не успел остановиться за таймаут docker stop.
143 = 128 + 15 (SIGTERM): обычная штатная остановка.
139 = 128 + 11 (SIGSEGV): приложение упало само — обращение к чужой памяти.
125/126/127 — ошибка самого docker run, команда не исполняемая или не найдена.
Проверить OOM: `docker inspect -f '{{.State.OOMKilled}}' app`.
Коротко: код − 128 = сигнал; 137 — SIGKILL (часто OOM), 143 — SIGTERM (штатно), 139 — SIGSEGV (упало приложение)."""
src = "docker/теория/собес-zubat-docker.md:373-389"
kind = "М"
keys = [
  "128",
  "137 | sigkill | oom",
  "143 | sigterm | штатн",
  "139 | sigsegv | segfault | упал",
]
need = 3

[[card]]
id = "z-distroless-alpine-scratch"
q = "Чем отличаются scratch, distroless и alpine как базовые образы?"
a = """scratch — совсем пустой образ. Только для статически собранных бинарников (Go, Rust). Нет даже корневых сертификатов и /etc/passwd — их кладут сами.
distroless — только то, что нужно программе для работы (библиотеки, сертификаты), без shell и пакетного менеджера. Меньше уязвимостей и нечем воспользоваться атакующему. Есть вариант :nonroot.
alpine — настоящий маленький дистрибутив (около 5 МБ) с sh и apk. Но на musl вместо glibc: бывают отличия в DNS-резолвинге и несовместимость с бинарниками под glibc.
Минус образов без shell — отлаживать сложнее.
Коротко: scratch — пусто, distroless — только рантайм без shell, alpine — маленький дистрибутив на musl."""
src = "docker/теория/собес-zubat-docker.md:390-400"
kind = "М"
keys = [
  "scratch | пуст",
  "distroless | без shell | без оболочк",
  "alpine | musl",
]
need = 2

[[card]]
id = "z-image-too-big"
q = "Образ весит несколько гигабайт. Как найти почему и уменьшить?"
a = """Найти: `docker history образ` — размер каждого слоя и какая инструкция его создала; `dive образ` — посмотреть, что внутри каждого слоя.
Частые причины и лечение:
толстый базовый образ → slim, alpine, distroless;
инструменты сборки в итоговом образе → multi-stage;
кэш пакетного менеджера → чистить в том же RUN (`rm -rf /var/lib/apt/lists/*`, `pip --no-cache-dir`);
файлы удаляются в отдельном RUN → удалять в той же инструкции, где появились, иначе предыдущий слой их хранит;
в контекст попали .git и node_modules → .dockerignore.
Коротко: docker history и dive; лечат slim-базой, multi-stage, чисткой кэша в том же RUN и .dockerignore."""
src = "docker/теория/собес-zubat-docker.md:401-420"
kind = "М"
keys = [
  "history | dive",
  "multi-stage | multistage | slim | alpine | distroless",
  "кэш | кеш | том же run | dockerignore",
]
