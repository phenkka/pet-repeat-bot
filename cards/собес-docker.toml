[[card]]
id = "z-healthcheck"
q = "Контейнер в статусе running, а приложение не отвечает. Чем поможет HEALTHCHECK и перезапустит ли Docker такой контейнер?"
a = """running значит только «процесс жив». Приложение при этом может висеть. HEALTHCHECK периодически выполняет проверку внутри контейнера (например, curl на /health) и ставит статус healthy или unhealthy.
Подвох: сам Docker unhealthy-контейнер не перезапускает. Статус нужен для другого: в Compose `depends_on: condition: service_healthy` (ждать, пока база реально готова) и для внешней автоматики. В Kubernetes HEALTHCHECK вообще игнорируется — там свои пробы.
Коротко: running — процесс жив, HEALTHCHECK проверяет, что приложение работает; Docker по нему не перезапускает."""
src = "docker/теория/собес-zubat-docker.md:476-488"
kind = "М"
keys = [
  "процесс жив | running | работает ли | провер",
  "не перезапуск | не рестарт | сам не",
]

[[card]]
id = "z-container-limits"
q = "Как ограничить контейнеру память, CPU и число процессов, и что будет при превышении каждого?"
a = """`docker run --memory 512m --memory-swap 512m --cpus 1.5 --pids-limit 200 образ`. Под капотом — cgroups.
Память превысил — OOM killer убивает процесс (код 137, OOMKilled=true).
CPU превысил — троттлинг: приложение тормозит, но не падает.
pids-limit — защита от fork-бомбы: больше процессов создать нельзя.
Без лимитов один контейнер может съесть всю память хоста и уронить соседей.
Коротко: --memory, --cpus, --pids-limit; память — убьют (137), CPU — тормозит, без лимитов один съест весь хост."""
src = "docker/теория/собес-zubat-docker.md:489-502"
kind = "М"
keys = [
  "memory | памят",
  "cpus | cpu | троттл | тормоз",
