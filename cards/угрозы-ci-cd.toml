[[card]]
id = "iast-vs-sast-dast"
q = "Чем IAST отличается от SAST и DAST, и какая у него цена?"
a = """IAST — это агент внутри работающего приложения во время тестов. Он видит сразу и код, и реальный запрос, который через этот код прошёл. За счёт этого он точнее DAST и даёт меньше ложных срабатываний, чем SAST.
Цена: нужно встроить агент в приложение, и проверен будет только тот код, который реально прогнали тесты.
Коротко: IAST — агент внутри приложения, видит код и запрос вместе; точнее, но покрывает только протестированный код."""
src = "security/devsecops/теория/devops-и-devsecops-основы.md:87-109"
