# Угрозы самому CI/CD и основы DevSecOps. Спецкурс УЦСБ (Зайцев Д.).
# kind М: по методичке. keys: варианты через |.

[[card]]
id = "ppe-direct"
q = "Что такое Direct PPE (Poisoned Pipeline Execution) и почему права на `.gitlab-ci.yml` равны правам на раннер?"
a = """CI/CD выполняет «отравленную» конфигурацию пайплайна. Кто правит `.gitlab-ci.yml`, тот выполняет любой код на раннере со всеми его секретами и доступами.
Защита по OWASP: манифест пайплайна отдельно от кода, защищённые ветки, изоляция выполнения, минимальные права пайплайна."""
src = "безопасность/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:36-60, 103-128"
kind = "М"
keys = [
  "отравлен | конфигурац пайплайн | gitlab-ci | правит пайплайн",
  "любой код | раннер | секрет | доступ",
  "отдельно | защищ ветк | protected | минимальн прав",
]
need = 2

[[card]]
id = "ppe-indirect"
q = "Чем Indirect PPE отличается от Direct, и почему тут не спасает запрет на правку `.gitlab-ci.yml`?"
a = """Файл пайплайна не трогают. Но честный пайплайн вызывает то, что контролирует атакующий: Makefile, скрипты package.json, setup.py, тесты.
Пайплайн легитимный, а выполненный в нём код чужой. Закрывают изоляцией выполнения, минимальными правами и сетью раннера."""
src = "безопасность/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:36-60"
kind = "М"
keys = [
  "не трога | файл пайплайна не | честный пайплайн | легитим",
  "makefile | package json | скрипт сборк | setup py | тест | файл сборки",
]

[[card]]
id = "dependency-poisoning"
q = "Почему SAST со сборкой проекта опасен на раннере, и что делают против отравления зависимостей?"
a = """Сборка ставит зависимости, а их скрипты установки (postinstall в npm) выполняются на раннере - это чужой код.
Меры: `npm install --ignore-scripts`, раннеры в отдельном сегменте: TCP только к списку хостов, UDP выключен - отравленному пакету некуда слать секреты."""
src = "безопасность/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:129-142"
kind = "М"
keys = [
  "скрипт установк | postinstall | чужой код | выполня при сборк",
  "ignore-scripts | ignore scripts",
  "сегмент | сеть раннер | tcp | udp | исходящ",
]
need = 2

[[card]]
id = "scanner-is-target"
q = "Почему сам сканер безопасности в пайплайне - тоже цель атаки?"
a = """Сканер - программа со своими уязвимостями. Подготовленный код может уронить сканер (результата нет, гейт проходит мимо) или выполнить на нём код.
Сканер и сканируемый код на одной машине с секретами - цель Indirect PPE. Поэтому изоляция и минимум прав и у сканирующих джоб."""
src = "безопасность/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:36-60, 160-169"
kind = "М"
keys = [
  "уязвим | уронить | падает | выполнить код",
  "секрет | изоляц | гейт мимо | нет результат",
]

[[card]]
id = "insider-results-tamper"
q = "Как в модели внутреннего нарушителя защищаются от подделки результатов сканирования?"
a = """Проверяемый (заказчик) не может менять результаты в Vulnerability Management и входить в UI GitLab. Никто не правит код заказчика.
Результаты AppSec-исполнителя проходят верификацию: один человек не может и найти, и тихо закрыть уязвимость. Артефакты анализов хранятся."""
src = "безопасность/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:61-102"
kind = "М"
keys = [
  "не может меня результат | запрет правк | только чтение | разделен",
  "верификац | проверка работ | второй человек | артефакт",
]

[[card]]
id = "devsecops-aas-network"
q = "Как сегментирована сеть в DevSecOps-aaS, чтобы заказчики не добрались до чужого и до инфраструктуры?"
a = """Заказчик ходит только в свой экземпляр сервиса и не видит внутренний GitLab. Экземпляр сервиса не ходит в инфраструктуру. Экземпляры разных заказчиков не видят друг друга.
Плюс WAF и network policies - первый эшелон из четырёх (сеть, подписи, логи, права)."""
src = "безопасность/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:61-102"
kind = "М"
keys = [
  "свой экземпляр | только свой | друг друга | изоляц заказчик",
  "инфраструктур | gitlab | network polic | waf",
]

[[card]]
id = "devops-dora"
q = "Зачем бизнесу DevOps? Назови, что именно должно улучшиться (это и есть метрики DORA)."
a = """Быстрее выход на рынок (частота деплоя и lead time), реже отказы релизов (change failure rate), быстрее исправления, меньше время восстановления после сбоя (MTTR)."""
src = "безопасность/devsecops/теория/devops-и-devsecops-основы.md:41-66"
kind = "М"
keys = [
  "частот деплоя | выход на рынок | lead time | быстрее релиз",
  "отказ | change failure | неудачн изменен",
  "восстановлен | mttr | время восстанов",
]
need = 2

[[card]]
id = "devsecops-not-just-scanners"
q = "Почему «мы поставили сканеры в пайплайн» - это ещё не DevSecOps?"
a = """Сканеры закрывают только анализ кода. Остальные практики: моделирование угроз, управление уязвимостями (собрать, разобрать, устранить), управление соответствием, обучение. Их инструментом не заменить.
И shift left не отменяет проверок в проде: часть уязвимостей видна только в работающей системе."""
src = "безопасность/devsecops/теория/devops-и-devsecops-основы.md:67-80, 124-131"
kind = "М"
keys = [
  "моделирован угроз | threat model",
  "управлен уязвим | соответстви | обучен",
]
need = 1

[[card]]
id = "security-champion"
q = "Кто такой Security Champion и зачем он нужен, если есть отдел AppSec?"
a = """Разработчик внутри продуктовой команды, отвечающий за безопасность: связывает команду с AppSec, разбирает находки сканеров вместе с коллегами, продвигает практики.
AppSec-инженеров мало, команд много - так безопасность масштабируется."""
src = "безопасность/devsecops/теория/devops-и-devsecops-основы.md:110-123"
kind = "М"
keys = [
  "разработчик | в команде | внутри команд",
  "мало appsec | масштаб | связ | находк",
]

[[card]]
id = "iast-vs-sast-dast"
q = "Чем IAST отличается от SAST и DAST, и какая у него цена?"
a = """IAST - агент внутри приложения во время тестов: видит и код, и реальный запрос. Точнее DAST, меньше ложных, чем у SAST.
Цена: агент в приложении и покрыт только тот код, который прогнали тесты."""
src = "безопасность/devsecops/теория/devops-и-devsecops-основы.md:87-109"
