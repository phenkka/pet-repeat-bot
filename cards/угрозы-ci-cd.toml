[[card]]
id = "devsecops-not-just-scanners"
q = "Почему «мы поставили сканеры в пайплайн» - это ещё не DevSecOps?"
a = """Сканеры в пайплайне закрывают только одну практику — анализ кода. А DevSecOps шире: моделирование угроз (где и как нас атакуют), управление уязвимостями (собрать, разобрать, устранить), соответствие требованиям, обучение людей. Всё это сканером не заменить.
И shift-left не отменяет проверок на проде: часть уязвимостей видна только в работающей системе.
Коротко: сканеры — только анализ кода; есть ещё угрозы, управление уязвимостями, обучение, прод."""
