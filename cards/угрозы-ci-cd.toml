[[card]]
id = "devops-dora"
q = "Зачем бизнесу DevOps? Назови, что именно должно улучшиться (это и есть метрики DORA)."
a = """DevOps бизнесу нужен, чтобы быстрее и надёжнее поставлять продукт. Конкретно улучшаются четыре вещи (это и есть метрики DORA): быстрее выходить на рынок (как часто деплоим и сколько времени от кода до прода), реже ломать релизами (доля неудачных изменений), быстрее чинить, быстрее восстанавливаться после сбоя (MTTR).
Коротко: частота деплоя, время от кода до прода, доля неудачных релизов, время восстановления."""
