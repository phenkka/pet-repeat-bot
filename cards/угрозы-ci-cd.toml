[[card]]
id = "security-champion"
q = "Кто такой Security Champion и зачем он нужен, если есть отдел AppSec?"
a = """Security Champion — это разработчик внутри продуктовой команды, который отвечает за безопасность. Он связывает свою команду с отделом AppSec, вместе с коллегами разбирает находки сканеров, продвигает хорошие практики.
Зачем, если есть AppSec: специалистов по безопасности мало, а команд много. Через чемпионов безопасность масштабируется на все команды.
Коротко: разработчик в команде, отвечающий за безопасность; через него AppSec охватывает много команд."""
src = "security/devsecops/теория/devops-и-devsecops-основы.md:110-123"
