# Угрозы самому CI/CD и основы DevSecOps. Спецкурс УЦСБ (Зайцев Д.).
# kind М: по методичке. keys: варианты через |.

[[card]]
id = "ppe-direct"
q = "Что такое Direct PPE (Poisoned Pipeline Execution) и почему права на `.gitlab-ci.yml` равны правам на раннер?"
a = """PPE (Poisoned Pipeline Execution) — отравление пайплайна. Direct PPE — это когда атакующий правит сам файл пайплайна (`.gitlab-ci.yml`) и пишет туда свой код. Пайплайн его честно выполняет — на раннере, со всеми его секретами и доступами. Поэтому право править файл пайплайна = право выполнить что угодно на раннере.
Защита (по OWASP): хранить файл пайплайна отдельно от кода, защищённые ветки (в них не пушат напрямую), изолированное выполнение, минимальные права пайплайна.
Коротко: кто правит .gitlab-ci.yml, тот выполняет код на раннере; файл пайплайна держат отдельно и под защитой."""
src = "security/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:36-60, 103-128"
kind = "М"
keys = [
  "отравлен | конфигурац пайплайн | gitlab-ci | правит пайплайн",
  "любой код | раннер | секрет | доступ",
  "отдельно | защищ ветк | protected | минимальн прав",
]
need = 2

[[card]]
id = "ppe-indirect"
q = "Чем Indirect PPE отличается от Direct, и почему тут не спасает запрет на правку `.gitlab-ci.yml`?"
a = """Indirect PPE — файл пайплайна не трогают вообще. Но пайплайн по ходу вызывает то, что контролирует атакующий: Makefile, скрипты в package.json, setup.py, тесты. Пайплайн честный, а код, который он запустил, — чужой. Поэтому запрет править `.gitlab-ci.yml` тут не спасает.
Закрывают это изоляцией выполнения, минимальными правами и ограничением сети раннера.
Коротко: пайплайн честный, но запускает чужой код из сборочных файлов; спасает изоляция и минимум прав."""
src = "security/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:36-60"
kind = "М"
keys = [
  "не трога | файл пайплайна не | честный пайплайн | легитим",
  "makefile | package json | скрипт сборк | setup py | тест | файл сборки",
]

[[card]]
id = "dependency-poisoning"
q = "Почему SAST со сборкой проекта опасен на раннере, и что делают против отравления зависимостей?"
a = """Отравление зависимостей: атакующий подсовывает вредоносный пакет. Когда проект собирается, менеджер пакетов ставит зависимости и выполняет их скрипты установки (например, postinstall в npm) — это уже чужой код на раннере.
Поэтому SAST со сборкой проекта опасен. Меры: отключить выполнение этих скриптов (`npm install --ignore-scripts`) и держать раннеры в отдельном сегменте сети — только нужные исходящие соединения, UDP закрыт. Тогда отравленному пакету некуда отправить украденное.
Коротко: скрипты установки пакетов выполняются на раннере; отключают их и режут сеть раннера."""
src = "security/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:129-142"
kind = "М"
keys = [
  "скрипт установк | postinstall | чужой код | выполня при сборк",
  "ignore-scripts | ignore scripts",
  "сегмент | сеть раннер | tcp | udp | исходящ",
]
need = 2

[[card]]
id = "scanner-is-target"
q = "Почему сам сканер безопасности в пайплайне - тоже цель атаки?"
a = """Сканер безопасности — это тоже программа, и у неё тоже бывают уязвимости. Специально подготовленный код, который он сканирует, может либо уронить сканер (результата нет, гейт проходит мимо), либо выполнить на нём свой код.
А сканер работает рядом со сканируемым кодом, на машине с секретами — это и есть мишень Indirect PPE. Поэтому изоляцию и минимум прав применяют и к сканирующим джобам, а не только к сборочным.
Коротко: сканер — программа с уязвимостями; его можно уронить или выполнить в нём код, поэтому его тоже изолируют."""
src = "security/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:36-60, 160-169"
kind = "М"
keys = [
  "уязвим | уронить | падает | выполнить код",
  "секрет | изоляц | гейт мимо | нет результат",
]

[[card]]
id = "insider-results-tamper"
q = "Как в модели внутреннего нарушителя защищаются от подделки результатов сканирования?"
a = """Это про модель, где нарушитель — свой сотрудник или сотрудник заказчика. Чтобы нельзя было подделать результаты сканирования, доступы режут: проверяемый (заказчик) не может менять результаты в системе учёта уязвимостей и не может войти в интерфейс GitLab, а никто со стороны исполнителя не правит код заказчика.
И главное: результаты исполнителя проходят проверку другим человеком — один сотрудник не может и «найти» уязвимость, и тихо её закрыть. Артефакты анализов сохраняются, чтобы можно было перепроверить.
Коротко: режут права на изменение результатов и вводят проверку вторым человеком."""
src = "security/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:61-102"
kind = "М"
keys = [
  "не может меня результат | запрет правк | только чтение | разделен",
  "верификац | проверка работ | второй человек | артефакт",
]

[[card]]
id = "devsecops-aas-network"
q = "Как сегментирована сеть в DevSecOps-aaS, чтобы заказчики не добрались до чужого и до инфраструктуры?"
a = """DevSecOps-aaS — это когда компания гоняет проверки безопасности кода заказчиков на своей инфраструктуре. Сеть сегментируют так, чтобы заказчики не добрались ни до чужого, ни до внутренней инфраструктуры: каждый заказчик видит только свой экземпляр сервиса, не видит внутренний GitLab, экземпляр сервиса не ходит во внутреннюю сеть, а экземпляры разных заказчиков не видят друг друга.
Это первый из четырёх эшелонов защиты: сеть, подписи, логи, права.
Коротко: каждый заказчик заперт в своём экземпляре, нет доступа к чужому и к инфраструктуре."""
src = "security/devsecops/теория/угрозы-ci-cd-ppe-и-внутренний-нарушитель.md:61-102"
kind = "М"
keys = [
  "свой экземпляр | только свой | друг друга | изоляц заказчик",
