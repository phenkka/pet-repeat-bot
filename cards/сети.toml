[[card]]
id = "managed-switch-attack"
q = "Чем управляемый коммутатор опаснее неуправляемого с точки зрения атаки?"
a = """У неуправляемого коммутатора задача простая — переслать кадр в нужный порт, и управлять им нельзя. А у управляемого есть свой процессор и протоколы удалённого администрирования: его настраивают по сети.
Вот это и делает его точкой атаки: раз есть куда зайти и чем управлять, туда можно попытаться пролезть и перенастроить сеть. У неуправляемого ломать нечего.
Коротко: у управляемого есть процессор и удалённый доступ — есть куда зайти; у неуправляемого нечего."""
src = "networks/теория/введение-в-сети.md:52-59"
kind = "М"
keys = [
  "процессор | микропроцесс | cpu",
  "удален | администрир | ssh | telnet | управлен | настро",
  "точка атаки | вектор | атак",
]

[[card]]
id = "proxy-intermediate"
q = "Прокси пересылает твой запрос на сайт. Конечное устройство или промежуточное, и по какому признаку?"
a = """Прокси — промежуточное устройство. Признак простой: оно соединяет узлы и ведёт поток данных, но само данные не создаёт — только передаёт чужие.
Конечное устройство — это источник или получатель данных (твой компьютер, сервер сайта). Прокси ни тем, ни другим не является, он посередине.
Коротко: прокси передаёт чужие данные, сам их не создаёт — значит, промежуточное."""
