[[card]]
id = "sqli-mechanism"
q = "Что такое SQL-инъекция, почему она возникает и как её закрыть по-настоящему (не фильтром)?"
a = """Ввод склеивается в текст SQL, команда и данные не разделены. Атакующий меняет логику запроса: `' OR '1'='1' --`, `UNION SELECT` из других таблиц.
Защита: параметризованные запросы (плейсхолдеры) или ORM - команда и данные всегда раздельно. Фильтрация символов ненадёжна. Минимальные права у подключения к БД."""
