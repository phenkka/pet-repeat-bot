[[card]]
id = "race-condition-fix"
q = "Race condition на лимите (промокод, купон): где окно и как его закрыть?"
a = """Окно между проверкой лимита и его изменением. Пачка параллельных запросов проходит проверку, пока счётчик ещё не обновлён - лимит обойдён. Усиливается паузой между проверкой и записью.
Защита: критическая секция под одной блокировкой на ключ, или атомарная операция в БД/Redis (increment если меньше N). Убрать паузу. Идемпотентный ключ запроса."""
