[[card]]
id = "cookie-flags"
q = "Три флага у cookie сессии и от чего каждый защищает?"
a = """Кука сессии - это твой пропуск на сайт. Три флага защищают её с разных сторон.
HttpOnly - скрипты на странице не могут прочитать куку, поэтому XSS её не украдёт.
Secure - кука уходит только по HTTPS и не утечёт по незашифрованному соединению.
SameSite - браузер не отправляет куку, когда запрос идёт с чужого сайта, это защита от CSRF.
Коротко: HttpOnly от кражи скриптом, Secure от перехвата, SameSite от CSRF."""
