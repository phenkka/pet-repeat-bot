[[card]]
id = "ssrf-filter-bypass"
q = "SSRF с наивным фильтром: почему блок строки `127.0.0.1` не спасает и как фильтровать правильно?"
a = """Фильтр сверяет подстроку, а `127.000.000.001` (и другие записи) указывают на тот же localhost, но под запрет не попадают. Сервер сам ходит к внутренним эндпоинтам.
Защита: не denylist строк, а распарсить URL, нормализовать хост до IP, проверить на loopback, приватные и спец-диапазоны. Allowlist схем/хостов/портов, ограничить редиректы."""
