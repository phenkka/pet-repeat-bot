[[card]]
id = "sast-vs-sca-work"
q = "В твоих работах уязвимости делятся на найденные SAST и найденные SCA. В чём разница источника?"
a = """SAST читает твой код: SQLi, XSS, десериализация, слабый хеш, debug-флаг.
SCA смотрит зависимости: CVE Werkzeug 2.2.2 (отладчик, DoS через multipart). Это не ошибка твоего кода, а уязвимая версия чужой библиотеки.
Чинится обновлением зависимости, а не правкой логики."""
