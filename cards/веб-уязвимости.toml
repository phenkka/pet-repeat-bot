[[card]]
id = "path-traversal"
q = "Path traversal: в чём причина и как правильно собрать путь к файлу из пользовательского ввода?"
a = """Сайт отдаёт файл по имени из запроса, например `?file=report.pdf`. Если вместо имени передать путь с `../` («подняться на папку выше») или сразу `/etc/passwd`, сервер выйдет из своей папки и отдаст любой файл системы: конфиги, ключи, пароли.
Защита: держать файлы в одной заранее известной папке. Из запроса брать только имя файла, без слешей и `..`. После сборки пути проверить, что он по-прежнему внутри этой папки.
Коротко: имя файла из запроса выводит за пределы папки."""
