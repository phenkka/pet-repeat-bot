[[card]]
id = "jwt-none-bypass"
q = "Как обходят проверку JWT и что в коде это допускает?"
a = """В коде отключена проверка: `verify_signature=False` (Python) или принимается `alg: none`. Сервер доверяет содержимому без подписи.
Подделываешь `role=admin` или чужой `uid` - доступ от чужого имени.
Защита: `decode` с ключом и явным списком `algorithms`, проверять exp/aud/iss. Разрешать только RS256/ES256, не none."""
