q = "Race condition на лимите (промокод, купон): где окно и как его закрыть?"
a = """Промокод можно использовать один раз. Сервер сначала проверяет «уже использован?», потом отмечает «использован». Если отправить 20 запросов одновременно, все 20 успеют пройти проверку раньше, чем первый поставит отметку. Промокод сработает 20 раз.
Защита: проверка и отметка должны быть одним неделимым действием - блокировка или одна атомарная операция в базе. Не делать паузы между проверкой и записью.
