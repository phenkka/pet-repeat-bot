[[card]]
id = "sqli-mechanism"
q = "Что такое SQL-инъекция, почему она возникает и как её закрыть по-настоящему (не фильтром)?"
a = """Приложение собирает SQL-запрос как обычную строку и вклеивает в неё то, что ввёл пользователь. База не отличает, где команда, а где данные. Поэтому если ввести кусок SQL, он выполнится как часть запроса. Например, `' OR '1'='1' --` делает условие всегда истинным, и вход проходит без пароля.
Защита: параметризованные запросы. Запрос пишется с пустыми местами, а данные передаются отдельно, и база никогда не считает их командой. Фильтровать символы ненадёжно, их обходят.
Коротко: ввод склеивается с запросом, лечится параметризацией."""
src = "security/веб/практика/спецкурс-appsec-sast.md; security/веб/теория/sql-injection.md"
kind = "С"
keys = [
  "склеива | конкатен | интерполяц | подставля | в текст sql | не раздел | f-строк | запрос строка ввод | строк пользовательск ввод | изменя запрос ввод | влияет на запрос",
  "параметр | плейсхолдер | prepared | подготовлен | orm | разделя команд",
]

[[card]]
id = "xss-stored-fix"
q = "Stored XSS: как нагрузка попадает к жертве и чем это чинится на фронте и на бэке?"
a = """Злоумышленник сохраняет на сайте текст с HTML-кодом, например вместо имени в профиле. Сайт потом показывает это имя другим людям и вставляет его в страницу как HTML, а не как текст. Браузер жертвы видит код и выполняет его: может украсть сессию или действовать от её имени. «Stored» значит, что код лежит в базе и срабатывает у каждого, кто откроет страницу.
Защита: выводить данные пользователей как текст, а не как HTML (в React - обычное `{name}`, без `dangerouslySetInnerHTML`). Проверять ввод на сервере. Добавить заголовок CSP, который запрещает чужие скрипты.
Коротко: сохранённый ввод вставляется в страницу как HTML, лечится выводом как текста."""
