[[card]]
id = "weak-hash-md5"
q = "Почему MD5 (и SHA-1, SHA-256) плохи для паролей и чем заменить?"
a = """Пароли хранят не сами, а в виде хеша. MD5 и SHA считаются очень быстро - это хорошо для проверки файлов, но плохо для паролей: видеокарта перебирает миллиарды вариантов в секунду. Утекла база - простые пароли восстановят за минуты.
Защита: специальные алгоритмы для паролей - Argon2 или bcrypt. Они намеренно медленные и добавляют к каждому паролю случайную «соль».
Коротко: MD5 быстрый, его легко перебрать, для паролей нужны медленные Argon2 или bcrypt."""
