[[card]]
id = "xss-stored-fix"
q = "Stored XSS: как нагрузка попадает к жертве и чем это чинится на фронте и на бэке?"
a = """Недоверенная строка (например, имя с `<img onerror>`) сохраняется в БД и выводится в HTML без экранирования - выполняется у каждого, кто откроет страницу.
Фронт: не `dangerouslySetInnerHTML`/`innerHTML` для данных из API, выводить как текст или экранировать.
Бэк: валидация на входе. Сверху CSP с ограничением `script-src`."""
