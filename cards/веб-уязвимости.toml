[[card]]
id = "jwt-none-bypass"
q = "Как обходят проверку JWT и что в коде это допускает?"
a = """JWT - это токен с данными о пользователе (кто он, какая роль) и подписью. Подпись доказывает, что токен выдал сервер, а не придумал клиент. Если сервер подпись не проверяет (в коде `verify_signature=False` или принимается тип подписи `none`), то любой может сам написать токен «я админ» и войти как админ.
Защита: всегда проверять подпись секретным ключом и явно указывать, какие алгоритмы подписи разрешены. `none` не разрешать никогда. Проверять срок жизни токена.
Коротко: сервер не проверяет подпись токена, поэтому токен можно подделать."""
