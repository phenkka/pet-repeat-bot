[[card]]
id = "log-injection-log4shell"
q = "Log injection: чем опасна запись пользовательского ввода в лог, помимо подделки строк?"
a = """Программа пишет в журнал то, что прислал пользователь. Он может вставить перевод строки и дописать поддельную запись, будто что-то случилось. Хуже: библиотека логов Log4j раньше выполняла специальные команды из текста (`${jndi:...}`) и могла скачать и запустить код с чужого сервера. Это знаменитая уязвимость Log4Shell.
Защита: передавать данные в лог отдельно от текста сообщения. Убирать переводы строк. Не писать в лог пароли. Обновлять библиотеку логов.
