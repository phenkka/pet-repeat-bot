[[card]]
id = "xxe"
q = "XXE: как через XML читают файлы сервера и что отключить в парсере?"
a = """Парсер обрабатывает DTD и внешние сущности: `<!ENTITY x SYSTEM "file:///etc/passwd">`. Содержимое файла попадает в ответ. Отсюда же SSRF к внутренним сервисам.
