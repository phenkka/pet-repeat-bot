[[card]]
id = "csrf"
q = "CSRF: как чужой сайт действует от имени пользователя и чем это закрыть?"
a = """Форма без CSRF-токена. Сторонний сайт отправляет POST на твой эндпоинт, браузер прикладывает куки сессии жертвы - действие выполняется от её имени.
