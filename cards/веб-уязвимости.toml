[[card]]
id = "insecure-deser"
q = "Небезопасная десериализация: почему `pickle.loads` или Java `readObject` на данных от клиента ведёт к RCE?"
a = """Сериализация - это превращение объекта программы в байты, чтобы сохранить или отправить. Десериализация - обратно в объект. В Python (pickle) и Java при восстановлении объекта может выполниться код, заложенный в эти байты. Если байты прислал пользователь, он сам решает, какой код выполнится на сервере.
Защита: не восстанавливать объекты из данных пользователя. Передавать простые данные, например JSON, и проверять их структуру.
Коротко: восстановление объекта из чужих байтов выполняет чужой код."""
