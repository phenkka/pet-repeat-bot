[[card]]
id = "path-traversal"
q = "Path traversal: в чём причина и как правильно собрать путь к файлу из пользовательского ввода?"
a = """В приложение передают путь (`../`, `/etc/passwd`), он подставляется в чтение файла без ограничения каталогом. Утечка конфигов, ключей, структуры.
Защита: фиксированный корневой каталог, из ввода брать только базовое имя (без `/` и `..`), собрать путь внутри каталога и после нормализации проверить, что не вышли наружу. Allowlist имён/расширений."""
