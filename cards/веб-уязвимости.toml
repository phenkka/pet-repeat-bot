[[card]]
id = "weak-hash-md5"
q = "Почему MD5 (и SHA-1, SHA-256) плохи для паролей и чем заменить?"
a = """Они быстрые и не memory-hard: перебираются на GPU и по радужным таблицам. При утечке БД пароли восстанавливают быстро.
Нужны алгоритмы для паролей: Argon2, bcrypt, scrypt - медленные, с уникальной солью и параметрами сложности. Хранить только хеш. Старые мигрировать при следующем логине."""
src = "безопасность/веб/практика/спецкурс-appsec-sast.md"
kind = "С"
keys = [
  "быстр | gpu | радужн | перебор | брут | не memory-hard",
