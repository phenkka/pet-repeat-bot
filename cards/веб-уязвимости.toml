[[card]]
id = "ssrf-filter-bypass"
q = "SSRF с наивным фильтром: почему блок строки `127.0.0.1` не спасает и как фильтровать правильно?"
a = """SSRF - когда сервер по запросу пользователя сам идёт по ссылке. Опасно, потому что сервер видит внутренние адреса, недоступные снаружи. Фильтр «запретить строку 127.0.0.1» не помогает: тот же адрес можно записать по-другому, например `127.000.000.001`. Строка другая, адрес тот же.
Защита: сравнивать не текст ссылки, а реальный IP, в который она превращается. Запрещать внутренние и локальные адреса. Лучше - разрешать только конкретный список адресов.
Коротко: сервер ходит по ссылке пользователя, фильтр по строке обходится другой записью адреса."""
