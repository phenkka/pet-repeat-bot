[[card]]
id = "xss-why-not-script"
q = "Почему в XSS-пейлоаде чаще `<img src=x onerror=...>`, а не `<script>`?"
a = """Если вставить тег `<script>` в страницу через JavaScript уже после её загрузки, браузер его не запустит. А вот картинка с битым адресом и обработчиком `onerror` сработает сразу: картинка не загрузилась - браузер вызвал обработчик - код выполнился.
Ещё `<script>` первым делом вырезают фильтры, а про обработчики событий часто забывают.
