[[card]]
id = "log-injection-log4shell"
q = "Log injection: чем опасна запись пользовательского ввода в лог, помимо подделки строк?"
a = """Склейка ввода в сообщение логгера. Подделка строк через `\\r\\n` (log forging). В Log4j 2.x исторически - подстановка `${jndi:...}` с загрузкой кода (Log4Shell). Плюс в лог утекают пароли открытым текстом.
Защита: параметризованное логирование, не склейка. Нейтрализовать `\\r\\n`, ограничить длину. Пароли не логировать. Log4j в актуальной версии."""
