[[card]]
id = "postgres-no-cap-add"
q = "В типовом compose для postgres стоит `cap_drop: ALL` и тут же `cap_add: SETUID, SETGID, CHOWN...`. Зачем они там и как обойтись без них?"
a = """В типовом compose для postgres сбрасывают все права (`cap_drop: ALL`), но тут же возвращают несколько (SETUID, SETGID, CHOWN...). Зачем: официальный образ стартует от root, меняет владельца папки с данными и только потом переключается на пользователя postgres — вот для этого переключения права и нужны.
Если сразу запустить контейнер от пользователя postgres (`user: "70:70"`), переключаться не надо, и `cap_drop: ALL` работает без исключений. При `read_only` ещё понадобится tmpfs на /var/run/postgresql для сокета.
Коротко: права нужны образу, чтобы с root переключиться на postgres; запуск сразу от postgres их убирает."""
src = "linux/практика/1.13-контейнеризация.md:536-552"
kind = "М"
keys = [
  "root | рут | стартует от",
  "gosu | переключ | сменить пользоват | setuid",
  "user | 70 | сразу от postgres | сразу postgres",
]

[[card]]
id = "secret-file-not-env"
q = "Почему пароль базы в compose лучше отдавать секретом из файла, а не переменной окружения?"
a = """Пароль базы лучше отдавать файлом-секретом, а не переменной окружения. Переменные окружения видно в `docker inspect`, они есть в окружении процесса и легко утекают в логи и дампы.
Секрет монтируется файлом в /run/secrets/, и образ читает его оттуда (через POSTGRES_PASSWORD_FILE). Так пароль не светится в inspect и логах.
Коротко: переменные видно в inspect и логах, файл-секрет — нет."""
src = "linux/практика/1.13-контейнеризация.md:523-534"
kind = "М"
keys = [
  "inspect | видн | окружен | env | лог",
  "файл | run secrets | password file | монтир",
]
