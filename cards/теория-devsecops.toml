]

[[card]]
id = "image-vs-lockfile"
q = "Что видит сканер образа, чего не видит проверка зависимостей по lock-файлу? И наоборот, на твоём примере?"
a = """Это про два разных взгляда на зависимости.
Сканер образа видит то, что реально лежит в образе: базовый образ, системные пакеты ОС, секреты в слоях.
Проверка по lock-файлу видит всё дерево библиотек приложения — даже если в образ они попали уже собранными файлами без описаний. Так было с фронтом VulnShop: в образе лежали голые .min.js без метаданных, сканер образа их не видел, а по lock-файлу они нашлись.
Коротко: образ показывает ОС и системные пакеты, lock-файл — библиотеки приложения, даже собранные."""
