[[card]]
id = "sast-vs-dast"
q = "Чем SAST отличается от DAST? Почему в твоём пайплайне стоят оба?"
a = """SAST читает исходный код без запуска: SQL-инъекции, XSS, опасные функции. Видит место в коде.
DAST бьёт по работающему приложению снаружи и смотрит, что сломается.
У VulnShop semgrep дал 22 находки по коду, а SQLi на `/login`, command injection и XSS как реально эксплуатируемые подтвердил ZAP full scan."""
src = "безопасность/devsecops/теория/классы-проверок-и-инструменты.md:18-33; работа/zap-dast-в-pipeline.md:24-30"
kind = "М"
keys = [
  "код | исходник | без запуска | статич",
  "работающ | запущен | снаружи | динамич | стенд",
  "оба | вместе | разн | дополня | подтвер",
]

[[card]]
id = "sca-vs-sast"
q = "Что проверяет SCA, и почему SAST этого не найдёт?"
a = """SCA проверяет зависимости: читает `package.json`, `requirements.txt`, lock-файлы и сверяет версии библиотек с базами известных CVE.
SAST ищет ошибки в твоём коде, а уязвимость в чужой библиотеке - это не ошибка в твоём коде."""
src = "безопасность/devsecops/теория/классы-проверок-и-инструменты.md:22-25"
kind = "М"
keys = [
  "зависимост | библиотек | пакет",
  "cve | известн | баз | верси",
  "свой код | твой код | чужой | не смотрит | только код",
]

[[card]]
id = "precommit-plus-ci"
q = "Pre-commit хук с gitleaks стоит у всех разработчиков. Зачем ещё gitleaks в CI?"
a = """Хук живёт локально: его можно не поставить, а `git commit --no-verify` его пропускает.
CI - обязательная точка, мимо неё код в репозиторий не попадёт."""
