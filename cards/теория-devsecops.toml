[[card]]
id = "sast-vs-dast"
q = "Чем SAST отличается от DAST? Почему в твоём пайплайне стоят оба?"
a = """SAST читает исходный код, не запуская приложение, и ищет в нём опасные места: SQL-инъекции, XSS, небезопасные функции. Он показывает, в какой строке проблема.
DAST наоборот: бьёт по уже работающему приложению снаружи, как настоящий атакующий, и смотрит, что сломается.
В пайплайне нужны оба, потому что они видят разное. У VulnShop semgrep (SAST) дал 22 находки по коду, а то, что SQL-инъекция на /login, command injection и XSS реально эксплуатируются, подтвердил только ZAP (DAST).
Коротко: SAST читает код, DAST атакует работающее приложение; видят разное, нужны оба."""
src = "security/devsecops/теория/классы-проверок-и-инструменты.md:18-33; ci-cd/опыт/zap-dast-в-pipeline.md:24-30"
kind = "М"
keys = [
  "код | исходник | без запуска | статич",
  "работающ | запущен | снаружи | динамич | стенд",
  "оба | вместе | разн | дополня | подтвер",
]

[[card]]
id = "sca-vs-sast"
q = "Что проверяет SCA, и почему SAST этого не найдёт?"
a = """SCA проверяет не твой код, а чужие библиотеки, которые ты подключил. Он читает списки зависимостей (package.json, requirements.txt, lock-файлы) и сверяет версии с базами известных уязвимостей (CVE).
SAST этого не найдёт, потому что он ищет ошибки в твоём собственном коде, а уязвимость в чужой библиотеке — это не ошибка в твоём коде. Разные задачи.
Коротко: SCA смотрит чужие библиотеки по базам CVE, SAST — твой код; это разные вещи."""
src = "security/devsecops/теория/классы-проверок-и-инструменты.md:22-25"
kind = "М"
keys = [
  "зависимост | библиотек | пакет",
  "cve | известн | баз | верси",
  "свой код | твой код | чужой | не смотрит | только код",
]

[[card]]
id = "precommit-plus-ci"
q = "Pre-commit хук с gitleaks стоит у всех разработчиков. Зачем ещё gitleaks в CI?"
a = """pre-commit хук с gitleaks срабатывает на компьютере разработчика до коммита. Но на него нельзя полагаться: его можно не поставить, а `git commit --no-verify` вообще его пропускает.
Поэтому тот же gitleaks ставят ещё и в CI. CI — обязательная точка на сервере: мимо неё код в репозиторий не пройдёт, пропустить её нельзя.
Коротко: локальный хук можно обойти, CI — обязательная проверка на сервере."""
src = "security/devsecops/теория/классы-проверок-и-инструменты.md:273-276"
kind = "М"
keys = [
  "no verify | обойти | пропуст | не поставить | локальн | отключ",
  "ci | пайплайн | обязательн | сервер | мимо",
]

[[card]]
id = "secret-in-history"
q = "Секрет запушили, потом удалили файл новым коммитом. Проблема решена? Что делать?"
a = """Нет, не решена. Git хранит всю историю: секрет остался в прошлых коммитах, и gitleaks по истории его найдёт. Удаление файла новым коммитом это не чинит.
Правильно — считать секрет скомпрометированным и перевыпустить: старый отозвать, тогда в истории он уже ничего не открывает. Просто переписать историю мало: его могли уже склонировать, и хостинг хранит кэш.
Коротко: секрет остаётся в истории, его надо отозвать и перевыпустить, а не удалять файл."""
src = "security/devsecops/теория/классы-проверок-и-инструменты.md:277-279; security/devsecops/случаи/github-claude-в-contributors-после-amend.md"
kind = "М"
keys = [
  "истори | прошлых коммит | старом коммит | остается",
  "перевыпус | ротац | rotate | отозвать | сменить | новый ключ",
]

[[card]]
id = "trivy-three-modes"
q = "Trivy встречается и в SCA, и в сканировании образов, и в IaC. Это разные инструменты?"
a = """Это один инструмент с тремя режимами: `trivy fs` проверяет зависимости, `trivy image` — образ, `trivy config` — конфигурацию (Dockerfile, Terraform, Kubernetes). Поэтому один и тот же trivy и встречается в разных классах проверок.
Отдельный tfsec для Terraform больше не развивают — его проверки переехали в `trivy config`. У тебя в пайплайне trivy оставлен только в режиме config.
Коротко: один trivy, три режима — fs, image, config; tfsec влился в config."""
