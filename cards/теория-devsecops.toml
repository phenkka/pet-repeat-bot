[[card]]
id = "dast-after-deploy"
q = "Почему SAST в пайплайне запускается на push, а DAST только после деплоя на staging?"
a = """SAST запуск не нужен: ловит раньше и дешевле, сразу по коду.
DAST нужно работающее приложение, и он атакует по-настоящему: портит данные. Поэтому только на своём стенде, не на проде."""
