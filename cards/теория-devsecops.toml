[[card]]
id = "trivy-three-modes"
q = "Trivy встречается и в SCA, и в сканировании образов, и в IaC. Это разные инструменты?"
a = """Один инструмент, три режима: `trivy fs` - зависимости, `trivy image` - образ, `trivy config` - Dockerfile, Terraform, Kubernetes.
Tfsec отдельно больше не развивается, его проверки переехали в `trivy config`.
У тебя в пайплайне trivy оставлен только в режиме `config`."""
