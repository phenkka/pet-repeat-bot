[[card]]
id = "secret-in-history"
q = "Секрет запушили, потом удалили файл новым коммитом. Проблема решена? Что делать?"
a = """Нет. Секрет остаётся в прошлых коммитах, gitleaks по истории его найдёт.
Секрет перевыпускают: старый отозвать. Отозванный в истории уже ничего не открывает.
Переписать историю мало: клоны и кэши хостинга его уже хранят."""
src = "безопасность/devsecops/теория/классы-проверок-и-инструменты.md:277-279; безопасность/devsecops/случаи/github-claude-в-contributors-после-amend.md"
