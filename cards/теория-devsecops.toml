]

[[card]]
id = "runtime-falco"
q = "Образ по сканеру чистый, а в контейнере на проде кто-то открыл шелл. Какой класс проверок это ловит и чем?"
a = """Сканер образа видит только то, что было в образе на момент сборки. А шелл кто-то открыл уже в работающем контейнере — этого в образе не было. Ловит такое класс runtime security: наблюдение за тем, что происходит в контейнере прямо сейчас.
Инструмент — Falco. Он из коробки замечает подозрительное во время работы: запуск шелла в контейнере, чтение /etc/shadow, запись в /etc, странные сетевые соединения.
Коротко: сканер видит только образ; поведение в работающем контейнере ловит runtime-защита Falco."""
