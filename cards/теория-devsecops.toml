id = "secret-file-not-env"
q = "Почему пароль базы в compose лучше отдавать секретом из файла, а не переменной окружения?"
a = """Переменные окружения видно в `docker inspect` и в окружении процесса, они попадают в логи и дампы.
Секрет монтируется файлом в `/run/secrets/...`, образ берёт его через `POSTGRES_PASSWORD_FILE`."""
