[[card]]
id = "runtime-falco"
q = "Образ по сканеру чистый, а в контейнере на проде кто-то открыл шелл. Какой класс проверок это ловит и чем?"
a = """Runtime security: мониторинг того, что происходит в контейнере сейчас.
Falco из коробки ловит шелл в контейнере, чтение `/etc/shadow`, запись в `/etc`, странные соединения.
Сканер образа видит только то, что было в образе при сборке."""
