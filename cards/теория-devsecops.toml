[[card]]
id = "admission-enforce"
q = "Kyverno в кластере стоит, политика «не root» написана, а root-контейнер всё равно задеплоился. Что проверить первым?"
a = """Kyverno проверяет манифесты при деплое (admission). Но у политики есть режим. Если стоит режим аудита, Kyverno только записывает нарушения, но ничего не блокирует — поэтому root-контейнер и задеплоился.
Первым делом проверяешь режим политики: блокирует она только при `validationFailureAction: Enforce`. У Gatekeeper то же самое: в режиме `dryrun` он лишь пишет нарушения.
Коротко: политика в режиме аудита только логирует; блокирует только Enforce."""
src = "security/devsecops/теория/классы-проверок-и-инструменты.md:290-293"
kind = "М"
keys = [
  "enforce | блокир",
  "audit | аудит | dryrun | только пишет | только логи | отчет",
]

[[card]]
id = "dast-after-deploy"
q = "Почему SAST в пайплайне запускается на push, а DAST только после деплоя на staging?"
a = """SAST читает код, ему ничего запускать не надо — поэтому он работает рано, прямо на push: находит дёшево и сразу.
DAST нужно работающее приложение, и он атакует по-настоящему — портит данные. Поэтому его запускают только после деплоя на свой тестовый стенд (staging), а не на проде.
Коротко: SAST по коду рано на push; DAST атакует вживую, поэтому только на staging после деплоя."""
src = "security/devsecops/теория/классы-проверок-и-инструменты.md:199-210, 294-296"
kind = "М"
keys = [
