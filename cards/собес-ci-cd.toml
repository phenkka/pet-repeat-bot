[[card]]
id = "z-ci-delivery-deployment"
q = "Чем Continuous Integration, Continuous Delivery и Continuous Deployment отличаются друг от друга?"
a = """Continuous Integration — изменения часто вливаются в общую ветку, и каждое автоматически собирается и проверяется тестами.
Continuous Delivery — всё, что прошло пайплайн, готово к выкатке в прод в любой момент. Но в прод выкатывают по ручному подтверждению (кнопка, approve).
Continuous Deployment — то же, но без кнопки: прошло все проверки — само уехало в прод.
Разница между последними двумя — только в ручном шаге перед продом.
Коротко: CI — частое слияние с автосборкой и тестами; Delivery — готово к проду, выкатка по кнопке; Deployment — в прод автоматически."""
src = "ci-cd/теория/собес-zubat-ci-cd.md:23-47"
kind = "М"
keys = [
  "integration | слиян | сборк | тест",
  "delivery | кнопк | вручн | подтвержд | ручн",
  "deployment | автоматич | без кнопк | само",
]
need = 2

[[card]]
id = "z-artifacts-vs-cache"
q = "Чем артефакты отличаются от кэша в CI, и почему на кэш нельзя полагаться?"
a = """Артефакт — результат джобы, который нужен дальше: собранный бинарник, отчёт сканера, plan Terraform. Гарантированно передаётся в следующие джобы и хранится заданное время (expire_in), его можно скачать.
Кэш — только ускоритель: скачанные зависимости (node_modules, pip). Его может не оказаться или он может быть старым, поэтому пайплайн обязан работать и без него.
С точки зрения безопасности: кэш общий между запусками — отравленный кэш из одной ветки может попасть в другую. Поэтому для защищённых веток кэш держат отдельно.
Коротко: артефакт — результат джобы, гарантированно передаётся дальше; кэш — ускоритель, может не быть, пайплайн должен работать без него."""
src = "ci-cd/теория/собес-zubat-ci-cd.md:89-115"
kind = "М"
keys = [
  "артефакт | результат | передает | отчет",
  "кэш | кеш | ускор | зависимост | может не быть",
]

[[card]]
id = "z-stages-vs-needs"
q = "Чем в GitLab CI stages отличается от needs?"
a = """По стадиям (stages): джобы одной стадии идут параллельно, а следующая стадия стартует, только когда завершились все джобы предыдущей. Одна медленная джоба держит всех.
needs строит граф зависимостей: джоба стартует, как только готовы именно те джобы, которые ей нужны, не дожидаясь всей стадии. `needs: []` — старт сразу при создании пайплайна (удобно для линтеров и сканеров секретов). Заодно needs ограничивает, чьи артефакты скачивать.
Коротко: stages — следующая стадия ждёт всю предыдущую; needs — джоба ждёт только свои зависимости."""
src = "ci-cd/теория/собес-zubat-ci-cd.md:116-141"
kind = "М"
keys = [
  "стади | stage | всю предыдущ | все джобы",
  "needs | зависимост | граф | dag | только нужн",
]

[[card]]
id = "z-gitlab-rules"
q = "Как в GitLab CI сделать, чтобы деплой в прод шёл только по релизному тегу и только по кнопке?"
a = """Через rules — правила проверяются по порядку, срабатывает первое подходящее. Если ни одно не подошло, джобы в пайплайне просто нет.
Пример: `rules: - if: $CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/` с `when: manual` — джоба появится только для тегов вида v1.2.3 и запустится по кнопке.
Плюс по безопасности: релизные теги делают защищёнными (protected), тогда и protected-переменные с ключами от прода доступны только там. Старые only/except больше не развивают.
workflow:rules решает, создавать ли пайплайн вообще (например, чтобы не было дублей для ветки и MR).
Коротко: rules с if по CI_COMMIT_TAG и when: manual; тег защищённый — тогда ключи прода доступны только ему."""
src = "ci-cd/теория/собес-zubat-ci-cd.md:142-176"
kind = "М"
keys = [
  "rules | if",
  "manual | кнопк",
  "tag | тег",
]
need = 2

[[card]]
id = "z-ci-secrets"
q = "Как правильно работать с секретами в CI, и чем опасны пайплайны из форков?"
a = """Секретов нет в репозитории и в .gitlab-ci.yml — это ловит gitleaks.
В GitLab переменные делают masked (скрываются в логе) и protected (доступны только на защищённых ветках и тегах). Тогда любая ветка разработчика до ключей прода не дотянется.
Ещё лучше — внешний Vault и OIDC: короткоживущие ключи вместо постоянных.
Не печатать секреты в лог (set -x, env), не передавать аргументами команд, не класть в артефакты и слои образа.
Форки: если пайплайн по чужому MR запускается с твоими секретами, автор форка просто допишет в код `curl` с секретами наружу. В GitHub так опасен pull_request_target с checkout кода из PR.
Коротко: masked + protected переменные или Vault с OIDC; не печатать в лог; не давать секреты пайплайнам из чужих форков."""
src = "ci-cd/теория/собес-zubat-ci-cd.md:276-288"
kind = "М"
keys = [
  "masked | protected | защищен",
  "vault | oidc | внешн",
  "лог | форк | fork | pull_request_target",
]
need = 2

[[card]]
id = "z-deploy-strategies"
q = "Какие есть стратегии деплоя, чем blue-green отличается от canary, и что общего требуется от базы данных?"
a = """Recreate — выключить старое, включить новое; простой есть.
Rolling — менять экземпляры постепенно; простоя нет, но какое-то время работают обе версии.
Blue-green — рядом поднимается полная новая копия, трафик переключается разом. Откат мгновенный (переключить обратно), но нужны двойные ресурсы.
Canary — новая версия получает малую долю трафика (1%, 10%...), по метрикам ошибок решают, продолжать или откатить.
Feature flags — код уже в проде, а функцию включают флагом без нового деплоя.
Общее требование: если две версии работают одновременно, изменения схемы базы должны быть обратно совместимы.
Коротко: recreate, rolling, blue-green (переключить разом), canary (доля трафика), флаги; схема БД — обратно совместимая."""
src = "ci-cd/теория/собес-zubat-ci-cd.md:305-319"
kind = "М"
keys = [
  "blue | green | переключ",
  "canary | доля трафик | процент",
  "обратно совмест | схем | бд | база",
]
need = 2

[[card]]
id = "z-rollback-expand-contract"
q = "Как откатывают неудачный деплой, и почему откат может сломаться о миграцию базы?"
a = """Откатываются на прошлый готовый артефакт, а не пересобирают: образ с неизменяемым тегом или digest, `kubectl rollout undo`, `helm rollback`, `git revert` в GitOps-репозитории. Автоматически — по метрикам (Argo Rollouts, Flagger прерывают canary при росте ошибок). Иногда быстрее выкатить исправление (roll forward).
Ломается о базу так: новая версия удалила или переименовала колонку. Откатил код — старый код ищет колонку, а её нет.
Поэтому миграции делают по схеме expand/contract: сначала только расширить схему обратно совместимо, потом выкатить код, и лишь в следующем релизе удалить старое.
Коротко: откат на прошлый артефакт; схема БД меняется по expand/contract, иначе старый код не найдёт удалённую колонку."""
src = "ci-cd/теория/собес-zubat-ci-cd.md:331-341"
kind = "М"
keys = [
  "прошл | предыдущ | артефакт | undo | rollback | revert",
  "expand | contract | обратно совмест | колонк",
]
