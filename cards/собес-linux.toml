[[card]]
id = "z-zombie-orphan"
q = "Чем процесс-зомби отличается от сироты, и почему зомби не убить через kill -9?"
a = """Зомби — процесс уже завершился, но родитель ещё не забрал его код завершения (не вызвал wait). От процесса осталась только запись в таблице. Убивать нечего — он уже мёртв, поэтому kill -9 ничего не даёт. Лечится через родителя: тот должен забрать статус, а если родитель кривой — перезапустить или убить его. Тогда зомби усыновит init и уберёт.
Сирота — живой процесс, у которого умер родитель. Его подбирает PID 1 (init/systemd). Это нормально.
Коротко: зомби уже мёртв и ждёт, пока родитель заберёт код выхода — чинят родителя; сирота живой, его усыновляет PID 1."""
src = "linux/теория/собес-zubat-linux.md:440-466"
kind = "М"
keys = [
  "родител",
  "wait | код заверш | статус",
  "init | pid 1 | усынов",
]
