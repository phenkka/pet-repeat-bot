[[card]]
id = "z-dir-permissions"
q = "Что значат r, w и x на каталоге? Почему можно удалить чужой файл, не имея прав на сам файл?"
a = """На каталоге права значат другое, чем на файле:
r — увидеть список имён файлов;
w — создавать, удалять и переименовывать файлы в каталоге (работает только вместе с x);
x — войти в каталог и обращаться к файлам по имени.
Удаление файла — это изменение каталога (вычеркнуть имя из списка), а не самого файла. Поэтому если у тебя w и x на каталог, ты удалишь чужой файл даже без прав на него. Защищает от этого sticky bit (как у /tmp): удалять может только владелец файла.
umask убирает биты у новых файлов: при 022 файлы 644, каталоги 755.
Коротко: r — список, w — создавать/удалять, x — войти; удаление меняет каталог, поэтому нужны права на каталог, а не на файл."""
