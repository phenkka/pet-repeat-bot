[[card]]
id = "z-vsz-rss"
q = "У процесса VSZ 10 ГБ, а RSS 300 МБ. Сколько он реально ест и что такое overcommit?"
a = """Реально в памяти — RSS: сколько страниц процесса сейчас лежит в физической памяти (300 МБ).
VSZ — весь виртуальный объём, который процессу выделен на бумаге, включая то, чего он ещё ни разу не касался, и отображённые файлы. Обычно сильно больше реального.
Overcommit — ядро разрешает выделить больше памяти, чем есть, в расчёте, что не всё используют. Если все вдруг начнут пользоваться выделенным — придёт OOM killer. Режим задаёт vm.overcommit_memory (0 — эвристика по умолчанию, 2 — строгий учёт).
Коротко: реально ест RSS; VSZ — выделено на бумаге; overcommit — ядро обещает больше, чем есть."""
