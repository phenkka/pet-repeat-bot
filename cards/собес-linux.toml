[[card]]
id = "z-boot-order"
q = "Расскажи по шагам, как загружается Linux от кнопки питания до systemd."
a = """1. Прошивка (BIOS или UEFI) проверяет железо и выбирает, с чего грузиться.
2. Запускается загрузчик (GRUB2) — с раздела EFI или из MBR.
3. GRUB загружает в память ядро и initramfs и передаёт ядру параметры.
4. Ядро запускается и разворачивает initramfs — временный корень в памяти с драйверами, чтобы найти настоящий диск (LVM, RAID, шифрование).
5. Монтируется настоящий корень, запускается PID 1 — systemd.
6. systemd поднимает сервисы до нужного target (обычно multi-user).
Коротко: UEFI/BIOS → GRUB → ядро + initramfs → настоящий корень → systemd (PID 1) → сервисы."""
src = "linux/теория/собес-zubat-linux.md:506-524"
kind = "М"
keys = [
  "bios | uefi",
  "grub | загрузчик",
  "ядр | kernel",
  "initramfs | initrd",
  "systemd | init | pid 1",
]
need = 4

[[card]]
id = "z-systemd-enable-start-mask"
q = "systemctl: чем отличаются start, enable и mask?"
a = """start — запустить сервис сейчас. После перезагрузки он сам не поднимется.
enable — включить автозапуск при загрузке (создаёт ссылки). Сейчас не запускает; `enable --now` — и то, и другое.
mask — запретить совсем: юнит связывается с /dev/null, и его нельзя запустить ни руками, ни как зависимость другого сервиса. disable так не умеет — отключённый сервис всё ещё может подтянуть кто-то другой.
После правки файлов юнита — `systemctl daemon-reload`.
Коротко: start — сейчас, enable — при загрузке, mask — запрет вообще, даже как зависимость."""
src = "linux/теория/собес-zubat-linux.md:525-541"
kind = "М"
