[[card]]
id = "z-lvm-extend"
q = "Что такое LVM и как расширить логический том вместе с файловой системой?"
a = """LVM — прослойка между дисками и файловыми системами: диски (PV) складываются в общий пул (VG), из пула нарезаются тома (LV), на них уже файловая система. Тома можно менять на ходу, объединять диски, делать снапшоты.
Расширить: добавить диск в пул `vgextend vg0 /dev/sdb` (если места нет), затем `lvextend -r -L +20G /dev/vg0/data`. Флаг -r сразу расширит и файловую систему. Без него — отдельно: resize2fs для ext4, xfs_growfs для XFS.
Подвох: XFS нельзя уменьшить, только увеличить.
Коротко: PV → VG → LV; lvextend -r расширяет том и файловую систему разом; XFS не уменьшается."""
src = "linux/теория/собес-zubat-linux.md:988-1004"
kind = "М"
