[[card]]
id = "z-nice-ionice"
q = "Бэкап на сервере мешает основному сервису. Как понизить ему приоритет по процессору и по диску?"
a = """По процессору — nice: от -20 (самый важный) до 19 (самый неважный), по умолчанию 0. Запустить с низким приоритетом — `nice -n 19 tar czf backup.tgz /data`, поменять работающему — `renice -n 10 -p <PID>`. Повышать приоритет может только root.
По диску — ionice: класс 3 (idle) — процесс пишет на диск только когда он больше никому не нужен: `ionice -c3 -p <PID>`.
В systemd то же задают в юните: Nice=, IOSchedulingClass=, CPUWeight=, IOWeight=.
