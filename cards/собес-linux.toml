[[card]]
id = "z-stderr-only"
q = "Как из вывода команды оставить только ошибки (stderr) и пустить их в grep, а обычный вывод выкинуть?"
a = """`cmd 2>&1 >/dev/null | grep pattern`
Перенаправления читаются слева направо. `2>&1` — направить ошибки туда, куда сейчас идёт обычный вывод, то есть в трубу к grep. Потом `>/dev/null` — обычный вывод выкинуть. Ошибки уже привязаны к трубе и остаются там.
Если переставить местами (`>/dev/null 2>&1`), в /dev/null уйдёт всё. Порядок важен.
Коротко: 2>&1 >/dev/null — ошибки в трубу, обычный вывод в /dev/null; порядок слева направо и он важен."""
src = "linux/теория/собес-zubat-linux.md:251-258"
kind = "М"
keys = [
  "2>&1 | 2 1",
  "dev null | порядок",
]

[[card]]
id = "z-buff-cache-available"
q = "free показывает free 800 МБ, а available почти 3 ГБ. Памяти мало? Что такое buff/cache?"
a = """Не мало. Linux занимает свободную память под кэш файлов (buff/cache): недавно прочитанное с диска держит в памяти, чтобы второй раз читать быстро. Как только программам понадобится память, ядро кэш отдаёт.
free — совсем ничем не занятая память. available — сколько можно отдать новым программам без swap, с учётом кэша, который можно освободить. Смотреть надо на available.
Коротко: buff/cache — кэш файлов, его отдают по требованию; реальный запас памяти — available, а не free."""
src = "linux/теория/собес-zubat-linux.md:484-505"
