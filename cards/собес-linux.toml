[[card]]
id = "z-journalctl-prev-boot"
q = "Сервер перезагрузился сам. Как через journalctl посмотреть, что было перед падением, и почему логов может не оказаться?"
a = """`journalctl -b -1` — логи предыдущей загрузки (`--list-boots` — список загрузок). `journalctl -k` — сообщения ядра, `-p err` — только ошибки, `-u nginx` — логи одного сервиса.
Логов прошлой загрузки может не быть, если журнал хранится только в памяти (/run/log/journal) — тогда он пропадает при перезагрузке. Чтобы сохранялся, нужен Storage=persistent в journald.conf (или существующий каталог /var/log/journal). Размер ограничивают SystemMaxUse.
Коротко: journalctl -b -1; если журнал не persistent, он жил в памяти и пропал при перезагрузке."""
src = "linux/теория/собес-zubat-linux.md:590-607"
kind = "М"
keys = [
  "-b -1 | b 1 | предыдущ загрузк",
  "persistent | в памят | run log | var log journal",
]

[[card]]
id = "z-fork-exec-thread"
q = "Как в Linux запускается новая программа (fork и exec)? И чем процесс отличается от потока?"
a = """fork создаёт копию текущего процесса (память копируется лениво, только когда кто-то начнёт её менять). exec заменяет программу внутри процесса на новую, PID остаётся. Оболочка запускает команду именно так: fork, потом exec в потомке. Родитель потом забирает код завершения через wait — иначе потомок станет зомби.
Поток отличается от процесса тем, что потоки одного процесса делят общую память и открытые файлы. У процессов всё это своё. Поэтому поток легче, но ошибка в одном потоке может испортить память всем.
Коротко: fork копирует процесс, exec меняет программу в нём; потоки делят память процесса, процессы — нет."""
src = "linux/теория/собес-zubat-linux.md:635-651"
kind = "М"
keys = [
  "fork | копи",
  "exec | замен",
  "общ памят | делят | раздел | адресн",
]
