a = """Самая частая — атрибут immutable: `lsattr file` покажет i. Такой файл нельзя изменить, удалить или переименовать даже root, пока не снимешь `chattr -i file`. Атрибут a разрешает только дописывать в конец (так защищают логи). Взломщики тоже любят ставить i на свои файлы и на authorized_keys.
Другие причины: файловая система смонтирована только на чтение (ext4 после ошибок сама перемонтируется в ro — смотреть findmnt), запрет SELinux или AppArmor.
Коротко: атрибут immutable (lsattr, chattr -i), файловая система в ro или SELinux/AppArmor."""
