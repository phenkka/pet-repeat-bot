[[card]]
id = "z-oom-killer"
q = "Что такое OOM killer, как понять, что он сработал, и что значит код выхода 137 у контейнера?"
a = """Когда память кончилась совсем (и кэш со swap не спасают), ядро убивает процесс — обычно самый прожорливый. Это OOM killer. То же самое происходит внутри cgroup, если процесс превысил свой лимит памяти, — так контейнеры получают OOMKilled.
Код выхода 137 = 128 + 9: процесс убит сигналом SIGKILL. У контейнера это почти всегда значит «убит по памяти» — у нас так падал бот при mem_limit 128m.
Как увидеть: `dmesg -T | grep -i oom` или `journalctl -k | grep -i oom`. Защитить важный процесс: OOMScoreAdjust в юните systemd (меньше — реже убивают).
Коротко: ядро убивает прожорливый процесс при нехватке памяти; 137 = 128+9, SIGKILL, обычно OOM; видно в dmesg."""
src = "linux/теория/собес-zubat-linux.md:652-664"
kind = "М"
keys = [
  "памят | memory",
  "137 | sigkill",
  "dmesg | journalctl -k | oom",
]
need = 2

[[card]]
id = "z-swap-swappiness"
q = "Нужен ли swap на сервере, где много памяти? Что такое swappiness?"
a = """Swap — место на диске, куда ядро выносит редко используемые страницы памяти.
swappiness (0–200, по умолчанию 60) — насколько охотно ядро выносит память программ в swap, а не освобождает кэш файлов. Меньше значение — дольше держит программы в памяти.
Даже при большой памяти swap полезен: туда уходит то, что не используется, а освободившееся идёт под кэш. Но если swap активно работает туда-обратно (vmstat, колонки si/so) — памяти реально не хватает. Для баз данных и нод Kubernetes swappiness часто ставят низким или swap отключают.
Коротко: swap — память на диске; swappiness — насколько охотно туда выносить; активный свопинг = нехватка памяти."""
src = "linux/теория/собес-zubat-linux.md:665-677"
kind = "М"
keys = [
  "диск | вынос | вытесн",
  "swappiness | охотн | 60",
  "нехватк | si so | vmstat | бд | kubernetes",
]
