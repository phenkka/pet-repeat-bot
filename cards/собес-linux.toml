[[card]]
id = "z-state-d-unkillable"
q = "Процесс висит в состоянии D и не убивается даже kill -9. Почему и что делать?"
a = """D — непрерываемый сон: процесс застрял внутри ядра в ожидании ввода-вывода (диск, NFS, драйвер). Сигналы, даже SIGKILL, доставятся ему только когда он выйдет из этого ожидания. Поэтому kill -9 не работает.
Делать: искать, чего он ждёт. `dmesg` на ошибки ввода-вывода и hung task, где процесс ждёт в ядре (`ps -eo pid,stat,wchan`). Частые причины: недоступный NFS-сервер, умирающий диск, зависшее хранилище. Если устройство не вернётся — помогает только перезагрузка.
Коротко: D — ждёт ввод-вывод внутри ядра, сигналы не доходят; чинить причину (NFS, диск), иначе перезагрузка."""
src = "linux/теория/собес-zubat-linux.md:692-704"
kind = "М"
keys = [
  "ввод вывод | io | диск | nfs",
  "сигнал не | не доход | непрерыва | uninterrupt",
]

[[card]]
id = "z-signals-15-9"
q = "Чем SIGTERM (15) отличается от SIGKILL (9), и что шлёт kill без номера?"
a = """kill без номера шлёт SIGTERM (15) — вежливую просьбу завершиться. Процесс может её перехватить: закрыть файлы и соединения, дописать данные, удалить временное — и выйти чисто.
SIGKILL (9) — убийство ядром: процесс не может ни перехватить, ни проигнорировать его, ничего не успевает за собой убрать. Отсюда риск битых файлов и брошенных блокировок.
Поэтому сначала 15, и только если не реагирует — 9. Ещё полезный: SIGHUP (1) — многие демоны по нему перечитывают конфиг.
Коротко: kill шлёт 15 — просьбу, можно убраться за собой; 9 — убийство ядром без шанса прибраться."""
src = "linux/теория/собес-zubat-linux.md:335-357"
kind = "М"
