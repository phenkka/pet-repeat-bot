[[card]]
id = "z-proc-environ-secret"
q = "Что лежит в /proc и /sys, и чем /proc/<PID>/environ интересен с точки зрения безопасности?"
a = """Обе — виртуальные файловые системы: их содержимое ядро создаёт на лету, на диске их нет.
/proc — прежде всего про процессы: командная строка, окружение, открытые файлы, лимиты; плюс общее (meminfo, cpuinfo) и параметры ядра в /proc/sys (с ними работает sysctl).
/sys — устройства, драйверы, cgroups: одно значение — один файл.
/proc/<PID>/environ — переменные окружения процесса. Если секрет передан переменной окружения, его прочитает root или тот, кто работает под тем же пользователем. Поэтому секреты лучше отдавать файлом с ограниченными правами.
Коротко: /proc — процессы и параметры ядра, /sys — устройства и cgroups; в environ видны секреты из переменных окружения."""
