[[card]]
id = "z-sticky-sgid"
q = "Зачем на /tmp стоит sticky bit, а на общей папке команды - SGID?"
a = """Sticky bit на каталоге (как у /tmp, права 1777): писать могут все, но удалить или переименовать файл может только его владелец (и root). Без него любой пользователь удалил бы чужие файлы в /tmp.
SGID на каталоге: новые файлы получают группу каталога, а не основную группу автора. Для общей папки команды это значит, что все файлы сразу принадлежат группе команды и все могут с ними работать.
Ставят: `chmod +t dir`, `chmod g+s dir`.
Коротко: sticky — в общем каталоге удалить можно только своё; SGID на каталоге — новые файлы наследуют группу каталога."""
