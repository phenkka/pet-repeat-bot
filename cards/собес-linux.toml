[[card]]
id = "z-export-var"
q = "Чем `export VAR=value` отличается от `VAR=value` в bash?"
a = """`VAR=value` — переменная живёт только в текущей оболочке. Программа, которую ты из неё запустишь, её не увидит.
`export VAR=value` — переменная попадает в окружение, и её унаследуют все дочерние процессы, запущенные из этой оболочки. Другие уже работающие процессы её всё равно не увидят.
Ещё вариант: `VAR=value команда` — переменная только для одной этой команды.
Коротко: без export — только в текущей оболочке; с export — наследуют дочерние процессы."""
