[[card]]
id = "z-set-euo-pipefail"
q = "Что делает `set -euo pipefail` в начале bash-скрипта, по каждой букве?"
a = """По умолчанию bash продолжает выполнять скрипт после ошибки — и может натворить дел дальше. Эта строка делает скрипт строгим.
-e — остановиться, если команда завершилась с ошибкой.
-u — остановиться, если используется незаданная переменная (иначе `rm -rf $DIR/` с пустой DIR станет `rm -rf /`).
-o pipefail — код ошибки конвейера `a | b` берётся от любой упавшей команды, а не только от последней. Иначе ошибка в начале конвейера тонет.
Подвох с -e: если команда в норме может вернуть не 0 (grep ничего не нашёл), скрипт молча оборвётся. Такие места помечают `|| true`.
Коротко: -e стоп на ошибке, -u стоп на пустой переменной, pipefail — ошибка в любом звене конвейера."""
src = "linux/теория/собес-zubat-linux.md:216-226"
kind = "М"
keys = [
  "ошибк | ненулев | упала",
  "незадан | неопредел | пуст переменн | -u",
  "pipefail | конвейер | пайп | любой команд",
]
