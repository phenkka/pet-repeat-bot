[[card]]
id = "z-systemd-drop-in"
q = "Нужно поменять параметр сервиса nginx из пакета. Почему не править его unit-файл и как правильно?"
a = """Файл юнита от пакета лежит в /usr/lib/systemd/system и перезапишется при обновлении пакета — твоя правка пропадёт.
Правильно — drop-in: `systemctl edit nginx`. Он создаёт /etc/systemd/system/nginx.service.d/override.conf, который накладывается поверх оригинала и при обновлении не трогается.
Подвох: чтобы заменить ExecStart, его сначала надо обнулить пустой строкой `ExecStart=`, а потом написать новый — иначе будет две команды. Итоговый юнит смотрят через `systemctl cat nginx`.
Коротко: файл пакета перезапишется при обновлении; правят через systemctl edit (drop-in override.conf)."""
src = "linux/теория/собес-zubat-linux.md:542-568"
kind = "М"
keys = [
  "обновлен | перезапиш | пакет",
  "drop-in | override | systemctl edit | edit",
]

[[card]]
id = "z-systemd-timers"
q = "Чем таймеры systemd лучше cron?"
a = """Таймер (.timer) запускает одноимённый сервис по расписанию. Плюсы перед cron:
логи задачи в journald (`journalctl -u backup`), а не в почте или в никуда;
Persistent=true — если сервер был выключен в момент запуска, задача выполнится после включения;
одна и та же задача не запустится второй раз параллельно, пока не закончилась первая;
у задачи есть всё, что у сервиса: ограничения ресурсов, зависимости, пользователь.
Список — `systemctl list-timers`.
Коротко: логи в journald, догоняет пропущенный запуск (Persistent), нет двойного запуска, лимиты как у сервиса."""
src = "linux/теория/собес-zubat-linux.md:569-589"
