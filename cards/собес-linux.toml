theme = "Linux"

[[card]]
id = "z-load-average"
q = "Load average 100. Это всегда плохо? И почему при высоком LA сервер может отвечать нормально?"
a = """Load average — среднее число задач, которые работают или ждут своей очереди, за 1, 5 и 15 минут. Сравнивать его надо с числом ядер: LA 100 на 128 ядрах — нормально, на 4 ядрах — перегруз.
В Linux в LA считаются ещё и процессы, которые ждут диск или сеть (состояние D). Поэтому LA бывает высоким, когда процессор почти свободен: много задач висит на медленном диске или NFS. ssh при этом отвечает нормально. Отличить: в top смотреть wa (ожидание ввода-вывода) и состояния процессов.
Коротко: LA сравнивают с числом ядер; в нём считаются и ждущие диск (D), поэтому высокий LA бывает при свободном CPU."""
src = "linux/теория/собес-zubat-linux.md:42-49"
kind = "М"
keys = [
  "ядер | cpu",
  "состояни d | ждут диск | ожида диск | wa | nfs",
]
need = 2

[[card]]
id = "z-inode-filename"
q = "Где хранится имя файла, если не в inode? И что тогда хранится в inode?"
a = """Имя файла хранится в каталоге. Каталог — это просто таблица «имя → номер inode».
В inode лежит всё остальное про файл: размер, владелец и группа, права, время изменения, где на диске лежат его данные. Имени там нет.
Отсюда следствия: у одного файла может быть несколько имён (жёсткие ссылки на один inode); переименование не трогает данные; inode могут кончиться раньше места на диске.
Коротко: имя — в каталоге (имя → номер inode); в inode размер, владелец, права, время и где данные."""
src = "linux/теория/собес-zubat-linux.md:358-373"
kind = "М"
keys = [
  "каталог | директор",
  "размер | владел | прав | время | блок | метадан",
]

[[card]]
id = "z-hard-vs-soft-link"
q = "Чем жёсткая ссылка отличается от символьной? Что с каждой будет, если удалить исходный файл?"
a = """Жёсткая ссылка — это второе имя того же файла: тот же inode. Удалишь исходное имя — файл жив, пока есть хоть одно имя. Ограничения: только в пределах одного раздела и не на каталоги.
Символьная (soft, `ln -s`) — отдельный маленький файл, в котором записан путь к цели. Удалишь цель — ссылка станет битой. Зато может указывать на каталог и на другой раздел.
Пример применения символьной: `current -> release-42` для переключения версий.
Коротко: hard — тот же inode, живёт после удаления оригинала; soft — хранит путь и ломается, но умеет каталоги и другие разделы."""
src = "linux/теория/собес-zubat-linux.md:374-420"
kind = "М"
keys = [
  "inode | тот же | второе имя",
  "путь | битая | сломается | ломает",
