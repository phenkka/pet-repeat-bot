[[card]]
id = "z-cgroups-v2"
q = "Чем cgroups v2 отличается от v1 и как ограничить память и CPU одному процессу без Docker?"
a = """cgroups — механизм ядра, который считает и ограничивает ресурсы группы процессов: CPU, память, диск, число процессов.
v1: у каждого ресурса своё отдельное дерево, процесс может сидеть в разных местах разных деревьев — запутанно.
v2: одно общее дерево в /sys/fs/cgroup, одинаковые файлы (memory.max, cpu.max, pids.max), правильный учёт кэша, метрики давления (PSI). Сейчас по умолчанию везде.
Без Docker через systemd: `systemd-run --scope -p MemoryMax=512M -p CPUQuota=50% ./app` или `systemctl set-property nginx.service MemoryMax=1G`.
Коротко: v1 — отдельное дерево на ресурс, v2 — одно дерево с едиными файлами; ограничить — systemd-run -p MemoryMax."""
