]

[[card]]
id = "z-ssh-ca"
q = "Что дают SSH-сертификаты (SSH CA) вместо раскладки ключей в authorized_keys?"
a = """Обычно публичные ключи людей раскладывают по authorized_keys на каждом сервере, а при увольнении надо не забыть их отовсюду вычистить.
С SSH CA сервер доверяет одному центру сертификации. Человеку выдают короткоживущий сертификат на его ключ — например, на 8 часов и только на определённые учётки. Доступ истекает сам, чистить ключи уволенных не нужно.
Так же работают хост-сертификаты: клиент доверяет CA и не спрашивает «доверять ли этому отпечатку?» при первом входе.
Коротко: сервер доверяет CA, человеку — короткий сертификат; доступ истекает сам, не надо чистить authorized_keys."""
