[[card]]
id = "z-cert-manager"
q = "Зачем автоматизировать выпуск сертификатов и как это делает cert-manager в Kubernetes?"
a = """«Сертификат протух» — одна из самых частых аварий, а сроки жизни публичных сертификатов ещё и сокращают. Руками за этим не уследить.
cert-manager в Kubernetes: ты описываешь, кто выдаёт (Issuer или ClusterIssuer — например, Let's Encrypt) и какой нужен сертификат (Certificate). Он сам выпускает его, кладёт в Secret и сам продлевает заранее, до истечения. Для Ingress хватает аннотации с нужным issuer.
На обычных серверах то же делают ACME-клиенты (certbot) по таймеру. И в любом случае сроки мониторят алертом.
Коротко: протухший сертификат — частая авария; cert-manager сам выпускает, кладёт в Secret и заранее продлевает."""
