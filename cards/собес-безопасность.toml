[[card]]
id = "z-least-privilege"
q = "Принцип наименьших привилегий: что это и как он выглядит на сервере, в Kubernetes и в облаке?"
a = """Каждый пользователь, сервис и процесс получает ровно те права, что нужны для задачи, и только на нужное время. Взломают — атакующий получит минимум.
На сервере: сервис работает от своего пользователя, не от root; sudo только на конкретные команды, без ALL.
В Kubernetes: свой ServiceAccount на приложение, Role вместо ClusterRole, токен не монтируется, если API не нужен.
В облаке: права на конкретный ресурс, а не `*`; временный доступ вместо постоянного.
Коротко: ровно нужные права и на нужное время — чтобы взлом дал атакующему минимум."""
src = "security/devsecops/теория/собес-zubat-devsecops.md:29-43"
kind = "М"
keys = [
  "нужн прав | минимум прав | только нужн | ровно",
  "не root | sudo | serviceaccount | role | конкретн ресурс",
  "нужное время | временн доступ | jit",
]
