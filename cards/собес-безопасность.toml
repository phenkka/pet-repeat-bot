[[card]]
id = "z-netpol-default-deny-dns"
q = "Включил в namespace NetworkPolicy default deny на вход и выход - и всё сломалось, даже обращения по именам. Почему?"
a = """По умолчанию в Kubernetes все поды могут ходить ко всем. Default deny (пустой podSelector, типы Ingress и Egress) запрещает весь трафик — в том числе исходящий к DNS. Поды больше не могут спросить у kube-dns адрес сервиса по имени, поэтому ломается вообще всё.
После default deny первым делом явно разрешают egress на DNS (порт 53 UDP и TCP к kube-dns), потом остальные нужные связи.
И помнить: политики работают, только если CNI их поддерживает (Calico, Cilium; Flannel — нет).
Коротко: default deny закрыл и DNS; первым разрешить egress на kube-dns порт 53."""
