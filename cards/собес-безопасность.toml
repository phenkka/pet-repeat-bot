[[card]]
id = "z-selinux-apparmor"
q = "SELinux и AppArmor: что они добавляют к обычным правам и чем отличаются? Что делать, если SELinux мешает приложению?"
a = """Обычные права Linux решает владелец файла. SELinux и AppArmor добавляют сверху обязательные правила (MAC): они ограничивают процесс, даже если он работает от root.
SELinux (RHEL, Fedora) — метки на всех файлах, процессах и портах; правило говорит, какой тип процесса к какому типу файла можно. Мощно, но сложно.
AppArmor (Ubuntu, Debian) — профили для программ по путям к файлам. Проще.
Если SELinux мешает: не выключать, а чинить причину. `setenforce 0` переводит в режим permissive (только логирует) для проверки. Дальше смотрят отказы `ausearch -m avc`, возвращают метки `restorecon`, разрешают порт через `semanage` или флаг через `setsebool`.
Коротко: ограничивают даже root; SELinux по меткам, AppArmor по путям; не выключать, а смотреть avc и чинить метки."""
