[[card]]
id = "z-tls-fullchain"
q = "Сайт в браузере открывается без ошибок, а curl и Java-клиент ругаются на сертификат. Частая причина?"
a = """Сервер отдаёт только свой сертификат без промежуточных (не fullchain).
Цепочка доверия: сертификат сервера подписан промежуточным центром (CA), тот — корневым, а корневой есть в хранилище клиента. Браузер часто сам достраивает недостающее звено (у него есть кэш промежуточных), а curl, Java и мобильные клиенты — нет, и цепочка у них не строится.
Чинится: отдавать сертификат вместе с промежуточными (fullchain). Проверить: `openssl s_client -connect host:443 -servername host -showcerts`.
Коротко: сервер не отдаёт промежуточные сертификаты; браузер достроил сам, curl нет — нужен fullchain."""
