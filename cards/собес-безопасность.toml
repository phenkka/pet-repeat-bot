[[card]]
id = "z-buildkit-secret"
q = "Сборке образа нужен токен к приватному репозиторию пакетов. Как передать его, чтобы он не остался в образе?"
a = """Если передать токен через `COPY`, `ENV` или `ARG`, он осядет в слоях или метаданных образа, и его увидит любой, кто скачает образ (`docker history`, `docker inspect`). Удаление в следующем слое не помогает — предыдущий слой хранится.
Правильно — секрет BuildKit: он монтируется только на время одной команды RUN и в слой не пишется.
`RUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm ci` и при сборке `docker build --secret id=npmrc,src=$HOME/.npmrc .`
Коротко: не ARG/ENV/COPY (останется в слоях), а секрет BuildKit через --mount=type=secret — только на время RUN."""
src = "security/devsecops/теория/собес-zubat-devsecops.md:72-83"
kind = "М"
keys = [
  "buildkit | mount type secret | secret | --secret",
  "слой | history | inspect | arg | env",
]

[[card]]
id = "z-vault-dynamic"
q = "Что такое динамические секреты в Vault и чем они лучше обычного пароля в хранилище?"
a = """Обычный (статический) секрет — один пароль на всех, лежит долго. Утёк — работает, пока кто-то не заметит и не сменит.
Динамический секрет Vault создаёт сам по запросу: например, заводит в базе временного пользователя со сроком жизни (TTL, скажем час) и по истечении сам его удаляет.
Плюсы: утёкший пароль быстро перестаёт работать; у каждого клиента своя учётка, поэтому видно, кто что делал.
Коротко: Vault выдаёт временную учётку на запрос и сам её удаляет — утечка быстро протухает, и видно, кто что делал."""
