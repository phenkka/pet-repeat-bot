]

[[card]]
id = "z-ssh-forward-agent"
q = "Ходишь на серверы через bastion. Почему не стоит включать ForwardAgent и как правильно ходить через jump-хост?"
a = """При ForwardAgent твой ssh-агент (с ключами) становится доступен на bastion. root на bastion или тот, кто его взломал, может воспользоваться твоим агентом и зайти куда угодно от твоего имени.
Правильно — ProxyJump: `ssh -J bastion user@10.0.1.15`. Соединение до цели идёт через bastion как через трубу, а ключ остаётся у тебя на машине, на bastion его нет.
Коротко: ForwardAgent отдаёт твой агент root'у на bastion; правильно ssh -J (ProxyJump), ключ остаётся у тебя."""
