[[card]]
id = "z-dependency-confusion"
q = "Typosquatting и dependency confusion - как через них в сборку попадает чужой пакет?"
a = """Обе атаки подсовывают вредный пакет вместо нужного.
Typosquatting: пакет с похожим именем (reqeusts вместо requests). Разработчик опечатался — и поставил чужое.
Dependency confusion: у компании внутренний пакет с каким-то именем. Атакующий публикует в публичном реестре пакет с тем же именем и версией повыше. Менеджер пакетов выбирает более новую версию — и тянет публичную, вредную.
Защита: внутренний прокси-репозиторий (Nexus, Artifactory) и явный scope для своих пакетов, lock-файлы и установка строго по ним (`npm ci`), проверка хэшей.
