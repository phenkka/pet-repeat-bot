[[card]]
id = "z-vault-seal"
q = "Vault перезапустился и не отдаёт секреты, хотя сам работает. Что с ним и как это решают в проде?"
a = """После старта Vault находится в состоянии sealed («запечатан»): данные зашифрованы, а ключа расшифровки в памяти нет. Пока его не распечатают (unseal), секреты он не отдаёт.
Распечатывают либо вручную несколькими частями ключа (ключи Шамира: ключ разбит на части, нужно набрать несколько из них), либо автоматически через облачный KMS или HSM (auto-unseal) — это обычный выбор для прода, чтобы не ждать людей после каждого рестарта.
Коротко: Vault после рестарта запечатан (sealed); распечатывают частями ключа Шамира или auto-unseal через KMS."""
src = "security/devsecops/теория/собес-zubat-devsecops.md:84-104"
kind = "М"
keys = [
  "seal | запечат | sealed",
  "unseal | распечат | шамир | shamir | kms | hsm | auto",
]

[[card]]
id = "z-gitops-secrets"
q = "При GitOps всё лежит в git. Как тогда хранить секреты? Три подхода."
a = """В git секрет открытым текстом класть нельзя. Три подхода:
SOPS — шифрует значения прямо в YAML-файле (имена полей остаются читаемыми). Зашифрованный файл коммитят, расшифровывают в CI или в кластере.
Sealed Secrets — секрет шифруют публичным ключом контроллера в кластере. В git лежит зашифрованный SealedSecret, расшифровать может только контроллер.
External Secrets Operator — в git лежит только ссылка, а само значение оператор забирает из Vault или облачного менеджера. Удобно для ротации: правда хранится снаружи.
Коротко: SOPS шифрует файл, Sealed Secrets шифрует ключом кластера, ESO хранит в git только ссылку на Vault."""
src = "security/devsecops/теория/собес-zubat-devsecops.md:105-125"
kind = "М"
keys = [
  "sops",
  "sealed",
  "external secret | eso | ссылк | vault",
]
