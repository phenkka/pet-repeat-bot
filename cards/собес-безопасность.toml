a = """Берут готовый стандарт требований — CIS Benchmarks (или STIG) под конкретный дистрибутив. Проверяют сканерами соответствия: OpenSCAP или Lynis (`lynis audit system`). Применяют автоматически — Ansible-ролями, чтобы все серверы были одинаковые.
Что внутри обычно: минимум установленных пакетов и сервисов, автообновления безопасности, SSH только по ключам, sudo с минимумом прав, файрвол «запрещено всё, что не разрешено», sysctl, SELinux или AppArmor включены, auditd, логи отправляются на внешний сервер (чтобы атакующий их не стёр).
Коротко: по стандарту CIS, проверка Lynis/OpenSCAP, применение Ansible; минимум сервисов, ключи, файрвол, логи наружу."""
