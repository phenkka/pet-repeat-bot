[[card]]
id = "z-pin-by-sha"
q = "Почему базовые образы и GitHub Actions закрепляют по digest или SHA коммита, а не по тегу?"
a = """Тег — это подвижная метка: его можно перевесить на другое содержимое. Если автора взломают, тег `v4` начнёт указывать на вредный код, и твой пайплайн его скачает и запустит. Так было в 2025 году с tj-actions/changed-files.
Digest образа (`@sha256:...`) и полный SHA коммита — это отпечаток самого содержимого. Подменить содержимое под тем же отпечатком нельзя.
Обновлять закреплённые версии помогают Renovate или Dependabot — с ревью.
Коротко: тег можно перевесить на вредный код, digest/SHA — отпечаток содержимого, его не подменить."""
