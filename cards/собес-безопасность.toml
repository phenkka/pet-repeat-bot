[[card]]
id = "z-incident-compromised"
q = "Сервер взломан. Почему его нельзя сразу перезагрузить или переустановить, и какой порядок действий?"
a = """Перезагрузка и переустановка уничтожат улики: в памяти процессы атакующего, соединения, ключи. Не поймёшь, как зашли — зайдут снова.
Порядок:
1. Сообщить ответственным, вести хронологию.
2. Изолировать: отрезать от сети (оставив доступ для разбора), вывести из балансировки, сделать снимок диска.
3. Собрать данные: память, процессы, соединения, пользователи и ssh-ключи, cron и systemd, недавно изменённые файлы, логи. Утилитам на взломанной машине не доверять — лучше разбирать снимок на другой машине.
4. Все секреты с сервера считать украденными и сменить, проверить соседние хосты.
5. Не лечить, а пересоздать с чистого образа, закрыв путь входа. Потом разбор (postmortem).
Коротко: не перезагружать (пропадут улики); изолировать, снять данные, сменить секреты, пересоздать с нуля."""
