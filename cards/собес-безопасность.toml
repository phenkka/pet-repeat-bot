id = "z-docker-bypass-firewall"
q = "На сервере файрвол «запрещено всё», а порт контейнера из `-p 8080:80` всё равно доступен из интернета. Почему и как закрыть?"
a = """Docker сам добавляет свои правила iptables для опубликованных портов, и трафик к контейнеру идёт мимо обычной цепочки INPUT, где стоит твой запрет. ufw и похожие обёртки этого тоже не видят.
Как закрыть: публиковать порт только на localhost (`-p 127.0.0.1:8080:80`), если снаружи он не нужен; или фильтровать в специальной цепочке DOCKER-USER, которую Docker проверяет раньше своих правил.
Коротко: Docker пишет свои правила iptables в обход INPUT; публиковать на 127.0.0.1 или фильтровать в DOCKER-USER."""
