[[card]]
id = "z-fail2ban-auditd"
q = "fail2ban и auditd - что делает каждый и почему fail2ban не повод оставить вход по паролю?"
a = """fail2ban читает логи входа, видит много неудачных попыток с одного IP и временно банит этот IP через файрвол.
auditd — аудит на уровне ядра: записывает, кто что сделал по правилам. Например, кто менял /etc/passwd или /etc/sudoers, кто запускал команды от root. Ищут по нему через `ausearch`.
fail2ban только снижает шум от перебора: медленный перебор с разных адресов он не остановит. Настоящая защита — отключить пароли и пускать по ключам.
Коротко: fail2ban банит IP за перебор, auditd пишет, кто что менял; fail2ban — шумодав, а не замена входу по ключам."""
