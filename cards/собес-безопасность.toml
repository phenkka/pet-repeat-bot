[[card]]
id = "z-k8s-secret-rbac-pod"
q = "Прав на чтение Secret у пользователя нет, но он может создавать поды в namespace. Может ли он прочитать секреты?"
a = """Может. Кто умеет создать под, тот может примонтировать в него любой Secret этого namespace и просто прочитать его изнутри. Поэтому право создавать поды фактически равно праву читать все секреты namespace.
Значит, RBAC на секреты — это не только запрет `get/list secrets`, но и контроль, кто может создавать поды. Плюс аудит доступа к секретам и шифрование etcd.
Коротко: да — создаёт под, монтирует любой Secret и читает; право на поды = право на секреты namespace."""
