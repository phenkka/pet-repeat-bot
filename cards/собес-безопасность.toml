[[card]]
id = "z-zero-trust"
q = "Zero Trust: от какой идеи он отказывается и как это делают технически?"
a = """Zero Trust отказывается от идеи «внутри сети — значит свой». То, что ты в офисе или в VPN, само по себе доступа не даёт. Каждый запрос проверяется: кто ты, с какого устройства, можно ли тебе это.
Технически: сервисы общаются по mTLS (оба предъявляют сертификаты), люди ходят через прокси с SSO и MFA вместо общего VPN, сеть дробится на мелкие сегменты (запрещено всё, что не разрешено), учётные данные короткоживущие.
Коротко: доверия по сети нет, каждый запрос проверяют по личности; mTLS, SSO+MFA, сегментация."""
src = "security/devsecops/теория/собес-zubat-devsecops.md:44-58"
kind = "М"
keys = [
  "нет довер | не довер | внутри сети | периметр | каждый запрос",
  "mtls | mfa | sso | сегмент | идентичн | личност",
]

[[card]]
id = "z-owasp-devops-zone"
q = "Что из OWASP Top 10 - зона DevOps-инженера, а не разработчика?"
a = """OWASP Top 10 — рейтинг самых частых классов уязвимостей веб-приложений. Большая часть — ошибки в коде, но несколько пунктов прямо про инфраструктуру.
Зона DevOps: неправильные настройки (открытая админка или бакет, пароль по умолчанию, debug в проде), устаревшие компоненты (обновлять зависимости и базовые образы), целостность пайплайна и артефактов (подпись, защита CI), логирование и алерты по событиям безопасности, защита от SSRF (например, закрыть подам доступ к адресу метаданных облака 169.254.169.254).
Коротко: мисконфигурации, устаревшие компоненты, целостность CI и артефактов, логирование, SSRF к метаданным."""
