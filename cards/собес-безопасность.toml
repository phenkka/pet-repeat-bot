a = """Статический ключ живёт долго, его копируют, и он утекает. Вместо него — федерация через OIDC.
CI сам выдаёт подписанный токен о себе: «я репозиторий такой-то, ветка main». Облако проверяет подпись и выдаёт временные права нужной роли на минуты или часы. В настройках роли указывают условие: роль может получить только этот репозиторий и эта ветка.
Ключа нет — нечему утечь. В GitLab это `id_tokens`. Для подов в Kubernetes то же самое: ServiceAccount связывают с облачной ролью (IRSA, Workload Identity).
