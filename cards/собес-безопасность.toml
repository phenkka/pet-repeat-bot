[[card]]
id = "z-secret-leak-order"
q = "Ключ облака попал в git. В каком порядке действовать и почему чистка истории не первая?"
a = """Сначала обезвредить, потом чистить.
1. Сразу отозвать ключ и выпустить новый. Считать его украденным, даже если репозиторий приватный и коммит провисел минуту — боты сканируют репозитории за минуты.
2. Проверить по аудит-логам облака, не пользовался ли кто этим ключом.
3. Только потом, если нужно, чистить историю (`git filter-repo`), всем переклонировать.
4. Закрыть причину: gitleaks в pre-commit и в CI.
Чистка не первая, потому что её не хватает: копии уже могли уйти в клоны, форки и кэш хостинга.
Коротко: отозвать ключ → проверить логи использования → потом чистить историю; копии уже могли уйти."""
