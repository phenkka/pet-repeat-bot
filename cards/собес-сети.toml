[[card]]
id = "z-tcpdump"
q = "Как с tcpdump проверить, доходит ли до сервера запрос и что сервер отвечает? Как посмотреть трафик контейнера?"
a = """tcpdump ловит пакеты на интерфейсе. Например: `tcpdump -i any -nn host 10.0.0.5 and tcp port 443`. -nn — не превращать адреса и порты в имена. Только SYN и RST: `'tcp[tcpflags] & (tcp-syn|tcp-rst) != 0'`. Записать в файл для Wireshark: `-w dump.pcap`. Свою SSH-сессию исключают: `not port 22`.
Смысл: запускаешь на сервере и смотришь — пришёл ли SYN, что ушло в ответ (SYN-ACK или RST, или ничего). Так видно, где теряется соединение.
Трафик контейнера: зайти в его сетевой namespace — `nsenter -t <PID> -n tcpdump -i eth0 -nn`.
Содержимое HTTPS не видно, но видны рукопожатие, повторы и обрывы.
Коротко: tcpdump -i any -nn с фильтром host/port; видно, дошёл ли SYN и что ответили; в контейнер — через nsenter -n."""
src = "networks/теория/собес-zubat-сети.md:698-714"
