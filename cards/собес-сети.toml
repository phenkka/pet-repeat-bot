[[card]]
id = "z-mtu-black-hole"
q = "Через VPN ping и мелкие запросы работают, а git clone и HTTPS-сайты зависают. Что за проблема?"
a = """Похоже на проблему MTU. MTU — максимальный размер пакета (в Ethernet 1500 байт). Туннели (VPN, VXLAN, WireGuard) добавляют свои заголовки, и реальный пропускаемый размер уменьшается.
Обычно отправитель узнаёт об этом по ICMP-сообщению «слишком большой пакет». Если файрвол режет ICMP, отправитель ничего не узнаёт, и большие пакеты молча теряются — это «MTU black hole». Мелкое (ping, рукопожатие) проходит, большое (сертификат в TLS, скачивание) виснет.
Проверить: `ping -M do -s 1472 host` (запрет дробления). Лечить: не резать нужный ICMP, правильный MTU на туннеле, MSS clamping на шлюзе.
Коротко: MTU — туннель уменьшил размер пакета, ICMP режется, большие пакеты молча теряются; проверка ping -M do -s."""
src = "networks/теория/собес-zubat-сети.md:579-595"
kind = "М"
keys = [
  "mtu",
  "icmp | больш пакет | фрагмент | туннел",
]

[[card]]
id = "z-docker-bridge-network"
q = "Как контейнер Docker получает сеть: что такое docker0, veth и где тут NAT?"
a = """Каждому контейнеру Docker создаёт свой сетевой namespace (свой сетевой стек) и пару veth — «виртуальный провод» с двумя концами. Один конец внутри контейнера (eth0), второй на хосте, подключён к мосту docker0 — это программный коммутатор в ядре (сеть 172.17.0.0/16).
Выход контейнера в интернет — через MASQUERADE (SNAT на адрес хоста). Публикация порта `-p 8080:80` — через DNAT: пришло на хост:8080 — переслали в контейнер:80.
Поэтому хосту с Docker нужен ip_forward, и поэтому опубликованные порты обходят цепочку INPUT.
Коротко: namespace + пара veth в мост docker0; наружу через MASQUERADE, опубликованный порт через DNAT."""
