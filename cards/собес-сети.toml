[[card]]
id = "z-curl-timings"
q = "Сайт открывается медленно. Как через curl понять, на каком этапе тратится время, и как проверить конкретный бэкенд в обход DNS?"
a = """curl умеет показывать время каждого этапа: `curl -o /dev/null -s -w 'dns %{time_namelookup} connect %{time_connect} tls %{time_appconnect} ttfb %{time_starttransfer} total %{time_total}' https://site/`.
Читать: большой dns — проблема с резолвером; долго от dns до connect — сеть до сервера; долго до tls — медленное рукопожатие; долго до ttfb (первый байт ответа) — тормозит само приложение; долго до total — большой ответ или узкий канал.
Проверить конкретный бэкенд с правильными Host и SNI, не трогая DNS: `curl -v --resolve site:443:10.0.0.12 https://site/health`.
Коротко: curl -w с time_namelookup/connect/appconnect/starttransfer показывает этап; --resolve — запрос на нужный IP в обход DNS."""
