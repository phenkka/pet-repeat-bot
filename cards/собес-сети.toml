[[card]]
id = "z-linux-resolve-getent"
q = "dig по имени даёт правильный IP, а приложение ходит на другой. Почему так бывает?"
a = """dig и nslookup спрашивают DNS-сервер напрямую. А приложение резолвит через системную библиотеку (glibc), которая идёт по порядку из /etc/nsswitch.conf: обычно сначала /etc/hosts, потом DNS.
Значит, частая причина — старая запись в /etc/hosts. Ещё варианты: другой резолвер в /etc/resolv.conf, кэш в самом приложении (например, в JVM), домены из search.
Проверять так, как увидит приложение: `getent hosts имя`.
Подвох Kubernetes: там ndots:5, и короткие имена сначала перебираются с доменами из search — лишние запросы. Внешние имена лучше писать с точкой в конце.
Коротко: dig идёт в DNS напрямую, приложение — через nsswitch и /etc/hosts; проверять через getent hosts."""
