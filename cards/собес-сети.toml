[[card]]
id = "z-mtr-loss"
q = "В mtr на промежуточном узле 60% потерь, а на конечном 0%. Это проблема?"
a = """Нет. Маршрутизаторы ограничивают, как часто отвечают на служебные запросы (ICMP) — им некогда, они заняты пересылкой. Поэтому промежуточный узел может «терять» ответы mtr, но транзитный трафик через него идёт нормально.
Реальная проблема — когда потери начинаются на каком-то узле и сохраняются на всех следующих до конечного.
И помнить: обратный путь может быть другим, поэтому полезно снять mtr и с другой стороны.
Коротко: нет — промежуточный узел просто ограничивает ответы ICMP; проблема, если потери тянутся до конечного узла."""
