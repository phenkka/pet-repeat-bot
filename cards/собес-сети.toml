[[card]]
id = "z-l4-vs-l7-lb"
q = "Чем балансировка на L4 отличается от L7, и почему для gRPC обычно нужен L7?"
a = """L4 видит только IP, порты и протокол. Решает, куда отправить соединение целиком, TLS не расшифровывает. Быстро и для любого протокола.
L7 разбирает сам HTTP: имя хоста, путь, заголовки, cookie. Умеет вести разные пути на разные бэкенды, повторять запросы, ограничивать частоту, ставить WAF, добавлять X-Forwarded-For. Но ему нужен сертификат и больше CPU.
gRPC и HTTP/2 гоняют много запросов по одному долгому соединению. L4 привяжет всё соединение к одному бэкенду — нагрузка ляжет на него одного. L7 распределяет каждый запрос отдельно.
Коротко: L4 — по IP и портам, соединение целиком; L7 — понимает HTTP и балансирует запросы; gRPC — одно долгое соединение, поэтому L7."""
src = "networks/теория/собес-zubat-сети.md:632-641"
kind = "М"
