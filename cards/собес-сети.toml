[[card]]
id = "z-dns-email-records"
q = "Что такое SPF, DKIM и DMARC, и от чего они защищают?"
a = """Все три — TXT-записи в DNS домена, защита от писем с подделанным отправителем (фишинг от имени твоей компании).
SPF — список серверов, которым разрешено отправлять почту от имени домена.
DKIM — письмо подписывается ключом домена, а открытый ключ лежит в DNS. Получатель проверяет подпись: письмо правда с этого домена и не изменено.
DMARC — правило для получателя: что делать, если SPF и DKIM не прошли (пропустить, в спам, отклонить), и куда слать отчёты.
Ещё PTR — обратная запись (IP → имя); почтовые серверы без неё часто считают спамерами.
Коротко: SPF — кто может слать, DKIM — подпись письма, DMARC — что делать при провале; защита от подделки отправителя."""
