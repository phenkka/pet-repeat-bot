]

[[card]]
id = "z-time-wait-proxy"
q = "Прокси перед бэкендами: десятки тысяч TIME_WAIT и ошибка «Cannot assign requested address». Что происходит и что делать?"
a = """Прокси на каждый запрос открывает новое соединение к одному и тому же бэкенду. Каждое закрытое соединение держит локальный порт в TIME_WAIT около минуты. Портов около 28 тысяч по умолчанию — они кончаются, и новое соединение открыть нельзя.
Что делать: главное — переиспользовать соединения (keepalive к бэкенду: в nginx `keepalive` в upstream и `proxy_http_version 1.1`). Ещё: расширить диапазон портов (ip_local_port_range), включить tcp_tw_reuse. tcp_tw_recycle нельзя — он ломал клиентов за NAT и удалён из ядра.
Коротко: кончились локальные порты из-за TIME_WAIT; лечить keepalive к бэкенду, плюс шире диапазон портов и tw_reuse."""
src = "networks/теория/собес-zubat-сети.md:302-313"
kind = "М"
keys = [
  "порт | эфемерн | кончил",
  "keepalive | переиспольз | пул",
]

[[card]]
id = "z-syn-flood"
q = "Что такое SYN flood и как от него защищается Linux?"
a = """Атакующий шлёт кучу SYN (часто с поддельных адресов) и не завершает рукопожатие. Сервер на каждый SYN держит запись о полуоткрытом соединении. Очередь таких соединений переполняется — и настоящие клиенты подключиться не могут.
Защита в Linux — SYN cookies (`net.ipv4.tcp_syncookies=1`): при переполнении сервер ничего не хранит, а зашифровывает нужное прямо в номер пакета SYN-ACK. Если клиент настоящий и ответил — соединение восстанавливается из этого номера.
Ещё: увеличить очередь, ограничение частоты на файрволе, защита от DDoS у провайдера.
Коротко: куча SYN без завершения переполняет очередь полуоткрытых; спасают SYN cookies — состояние кодируется в сам ответ."""
src = "networks/теория/собес-zubat-сети.md:314-326"
kind = "М"
keys = [
  "очеред | полуоткрыт | не заверш | переполн",
  "syncookies | syn cookie | cookie",
]

[[card]]
id = "z-refused-timeout-noroute"
q = "Чем отличаются Connection refused, Connection timed out и No route to host? Что каждый говорит о причине?"
a = """Connection refused — до хоста дошли, но на порту никто не слушает: пришёл ответ RST. Сервис упал, слушает другой адрес (например только 127.0.0.1) или файрвол делает REJECT.
Connection timed out — на запрос вообще никто не ответил. Пакет молча выкинул файрвол (DROP, security group), хост выключен или нет обратного маршрута.
No route to host — нет маршрута до хоста, или хост не отвечает в своей сети, или файрвол ответил ICMP «запрещено».
Проверять: `nc -vz host 443` с клиента, `ss -tlnp` на сервере, tcpdump с обеих сторон — доходит ли SYN и что возвращается.
Коротко: refused — дошли, но порт не слушают; timeout — пакет молча выкинули (DROP); no route — нет маршрута."""
