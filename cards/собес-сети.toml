[[card]]
id = "z-tcp-vs-udp"
q = "Чем TCP отличается от UDP, и что где используют?"
a = """TCP устанавливает соединение, следит за порядком пакетов и пересылает потерянные. Данные дойдут целиком и по порядку, но медленнее. Для веба, почты, файлов, баз данных.
UDP просто отправляет пакеты без соединения: ничего не переспрашивает и порядок не гарантирует. Зато быстро и без задержек. Для голоса и видео, игр, DNS, а также QUIC (HTTP/3) — он сам делает надёжность поверх UDP.
Что лучше — вопрос неправильный: они для разных задач.
Коротко: TCP — соединение, порядок и перезапрос потерь; UDP — без соединения, быстро, потери не возвращает."""
src = "networks/теория/собес-zubat-сети.md:112-122"
kind = "М"
keys = [
  "соединени | надежн | перезапрос | порядок | гарант",
  "без соединен | быстр | потер | не переспраш",
]

[[card]]
id = "z-dns-udp-tcp"
q = "DNS работает по UDP или TCP? Почему на файрволе надо открывать 53 порт для обоих?"
a = """Обычные запросы идут по UDP — быстро, один пакет туда, один обратно.
TCP нужен в двух случаях: передача целой зоны между DNS-серверами (AXFR) и ответ, который не помещается в UDP-пакет. Тогда сервер ставит флаг «обрезано» (TC), и клиент повторяет запрос по TCP. Большие ответы бывают при DNSSEC и множестве записей.
Если закрыть TCP/53, часть запросов будет загадочно падать — только те, где ответ большой.
Коротко: обычно UDP; TCP для передачи зоны и больших ответов (флаг TC) — без TCP/53 большие ответы ломаются."""
