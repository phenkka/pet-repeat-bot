[[card]]
id = "z-by-ip-not-name"
q = "Сервис открывается по IP, но не по имени. Как ищешь проблему?"
a = """Раз по IP работает — сеть и сервис живы. Проблема либо в резолвинге имени, либо в том, что по имени запрос попадает не в тот виртуальный хост.
1. `getent hosts имя` — что получает система; нет ли старой записи в /etc/hosts.
2. `dig имя` и `dig @8.8.8.8 имя` — совпадают ли ответы, нет ли NXDOMAIN или SERVFAIL.
3. Какой резолвер стоит (resolv.conf) и доступен ли он, не закрыт ли 53 порт.
4. Если имя резолвится в правильный IP, а не работает — nginx или Ingress выбирают сайт по заголовку Host или SNI, и этого имени у них нет; или сертификат выписан на другое имя. Проверить: `curl -v --resolve имя:443:IP https://имя/`.
Коротко: сначала getent и dig (что резолвится), потом Host/SNI на сервере — имени может не быть в server_name или в сертификате."""
