[[card]]
id = "z-time-wait-close-wait"
q = "На сервере тысячи соединений в CLOSE_WAIT. Чья это проблема, и чем CLOSE_WAIT отличается от TIME_WAIT?"
a = """TIME_WAIT — у той стороны, которая закрыла соединение первой. Висит около 60 секунд, чтобы опоздавшие пакеты старого соединения не попали в новое. Это норма.
CLOSE_WAIT — у той стороны, которой собеседник уже сказал «закрываю» (FIN), а её приложение так и не закрыло сокет у себя. Тысячи CLOSE_WAIT — почти всегда баг в приложении: оно не закрывает соединения (утечка сокетов). Тюнинг ядра тут не поможет, чинить код или перезапускать приложение.
Посмотреть: `ss -tanp state close-wait`.
Коротко: CLOSE_WAIT — приложение не закрыло сокет после FIN, это баг приложения; TIME_WAIT — нормальное ожидание у закрывшего первым."""
src = "networks/теория/собес-zubat-сети.md:290-301"
kind = "М"
keys = [
  "приложен | баг | не закрыв | утечк",
