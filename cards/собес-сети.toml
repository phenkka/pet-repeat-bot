[[card]]
id = "z-osi-devices"
q = "На каких уровнях OSI работают коммутатор, маршрутизатор, L4- и L7-балансировщик?"
a = """Коммутатор — L2 (канальный): пересылает кадры по MAC-адресам.
Маршрутизатор — L3 (сетевой): пересылает пакеты по IP-адресу назначения по таблице маршрутов.
L4-балансировщик — транспортный: видит только IP и порты TCP/UDP, распределяет соединения целиком.
L7-балансировщик — прикладной: понимает HTTP (имя хоста, путь, заголовки) и может вести разные пути на разные бэкенды. Примеры — nginx, Envoy.
В стеке TCP/IP уровней 4: уровни 5–7 OSI там слиты в один прикладной.
Коротко: коммутатор — L2 (MAC), маршрутизатор — L3 (IP), L4 — IP и порты, L7 — понимает HTTP."""
