[[card]]
id = "z-arp-spoofing"
q = "Как работает ARP и почему на нём построена атака «человек посередине» в локальной сети?"
a = """ARP находит MAC-адрес по IP внутри одной локальной сети. Хост кричит всем: «у кого IP 10.0.0.1?», владелец отвечает своим MAC, ответ запоминается в таблице (`ip neigh`). Для адресов из другой сети ищется MAC шлюза.
Проверки в ARP нет: любой может ответить «это я» или сам, без вопроса, объявить себя (gratuitous ARP). Атакующий объявляет свой MAC для IP шлюза — и весь трафик жертвы идёт через него. Это ARP-spoofing.
Защита — на коммутаторах: Dynamic ARP Inspection вместе с DHCP snooping. Полезный честный пример gratuitous ARP — переезд виртуального IP при failover (keepalived).
Коротко: ARP ищет MAC по IP без проверки; атакующий выдаёт себя за шлюз и перехватывает трафик; защита — DAI на коммутаторе."""
src = "networks/теория/собес-zubat-сети.md:244-257"
kind = "М"
keys = [
  "mac",
  "без провер | нет провер | любой может | подделк | spoof | выдает себя",
  "шлюз | gateway | перехват | посередин",
]
