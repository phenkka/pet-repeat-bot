[[card]]
id = "z-ss-listen-addr"
q = "В `ss -tlnp` база слушает `0.0.0.0:5432`. Чем это отличается от `127.0.0.1:5432` с точки зрения безопасности?"
a = """`ss -tlnp` показывает слушающие TCP-порты и процессы. Важно смотреть на адрес.
127.0.0.1:5432 — база доступна только с самого сервера, снаружи к ней не подключиться.
0.0.0.0:5432 (или [::]:5432) — база слушает на всех интерфейсах. Если файрвол не закрывает порт, к ней может подключиться кто угодно из сети, а то и из интернета.
Поэтому сервисы, которым не нужен внешний доступ, привязывают к localhost, а в Docker публикуют как `127.0.0.1:5432:5432`.
Коротко: 127.0.0.1 — только с самого сервера; 0.0.0.0 — на всех интерфейсах, доступна из сети, если не закрыть файрволом."""
