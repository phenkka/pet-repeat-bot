[[card]]
id = "z-iptables-chains"
q = "Через какие цепочки iptables проходит пакет, пришедший на сам хост, и транзитный пакет?"
a = """Пакет на сам хост: PREROUTING → решение о маршруте → INPUT → процесс.
Транзитный (хост работает как роутер, например для контейнеров): PREROUTING → маршрут → FORWARD → POSTROUTING.
Исходящий от процесса: OUTPUT → POSTROUTING.
Таблицы: filter (разрешить/запретить, по умолчанию), nat (подмена адресов), mangle (менять поля), raw (исключить из conntrack).
Правила проверяются сверху вниз до первого совпадения, если ничего не подошло — работает политика цепочки.
Отсюда, кстати, почему Docker обходит твои правила: трафик к контейнеру транзитный, он идёт через FORWARD, а не через INPUT.
Коротко: на хост — PREROUTING → INPUT; транзит — PREROUTING → FORWARD → POSTROUTING; исходящий — OUTPUT → POSTROUTING."""
src = "networks/теория/собес-zubat-сети.md:522-539"
kind = "М"
keys = [
  "input",
  "forward",
  "prerouting | postrouting | output",
]
