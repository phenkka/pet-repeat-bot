[[card]]
id = "z-quic-udp443"
q = "Включили на сайте HTTP/3. Что надо открыть на файрволе и что будет, если не открыть?"
a = """HTTP/3 работает поверх QUIC, а QUIC — поверх UDP. Значит, нужен открытый UDP/443 на файрволе и балансировщиках, а не только TCP/443.
Если UDP закрыт, ничего не сломается: браузер откатится на HTTP/2 по TCP. Просто преимуществ HTTP/3 не будет.
Плюсы QUIC: шифрование встроено, соединение за один круг вместо нескольких, потеря одного пакета не тормозит остальные потоки, соединение переживает смену сети (Wi-Fi → мобильный).
Коротко: HTTP/3 = QUIC поверх UDP, нужен UDP/443; закрыт — браузер откатится на HTTP/2."""
