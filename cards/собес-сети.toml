[[card]]
id = "z-dhcp-dora-rogue"
q = "Как клиент получает адрес по DHCP, и чем опасен чужой DHCP-сервер в сети?"
a = """Обмен из четырёх сообщений (DORA): Discover — клиент кричит всем «есть DHCP?»; Offer — сервер предлагает адрес; Request — клиент выбирает предложение; Ack — сервер подтверждает аренду. UDP, порты 67 (сервер) и 68 (клиент). Вместе с адресом выдаются маска, шлюз и DNS.
Чужой (rogue) DHCP-сервер ответит быстрее настоящего и раздаст свой шлюз и свой DNS — весь трафик клиентов пойдёт через атакующего. Ещё атака: забрать все адреса из пула (DHCP starvation).
Защита — DHCP snooping на коммутаторе: ответы DHCP принимаются только с доверенных портов.
Коротко: Discover-Offer-Request-Ack по UDP 67/68; чужой сервер раздаёт свой шлюз и DNS; защита — DHCP snooping."""
src = "networks/теория/собес-zubat-сети.md:258-270"
kind = "М"
