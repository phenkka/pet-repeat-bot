[[card]]
id = "z-dns-ttl-migration"
q = "Нужно перенести сайт на новый IP с минимальным простоем. Как действовать с TTL DNS-записи?"
a = """TTL — сколько секунд резолверы могут держать запись в кэше. Пока не истёк, часть клиентов ходит по старому адресу.
План:
1. Заранее снизить TTL (например, с суток до 60–300 секунд). Заранее — минимум на старый TTL до переезда, чтобы везде успел обновиться.
2. Дождаться истечения старого TTL и переключить запись на новый IP.
3. Какое-то время держать сервис на обоих адресах: некоторые клиенты кэшируют дольше положенного.
4. Потом вернуть TTL обратно.
Коротко: заранее снизить TTL, дождаться старого TTL, переключить, держать оба адреса, вернуть TTL."""
