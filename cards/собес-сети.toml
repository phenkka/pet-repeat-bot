[[card]]
id = "z-tls13-vs-12"
q = "Чем TLS 1.3 безопаснее TLS 1.2? И что такое forward secrecy?"
a = """В TLS 1.3 убрали всё устаревшее и опасное: старые шифры (RC4, 3DES, CBC), SHA-1, MD5, сжатие. Убрали обмен ключом через RSA — остался только (EC)DHE.
Из-за этого всегда есть forward secrecy: для каждого сеанса ключ создаётся заново и потом выбрасывается. Если когда-нибудь украдут приватный ключ сервера, записанный раньше трафик расшифровать всё равно не получится.
Ещё: рукопожатие быстрее (один круг вместо двух), сертификат сервера передаётся уже зашифрованным. TLS 1.0 и 1.1 признаны устаревшими и должны быть выключены.
Коротко: в 1.3 выкинули старые шифры и RSA-обмен, всегда forward secrecy — кража ключа не раскроет старый трафик."""
src = "networks/теория/собес-zubat-сети.md:361-372"
kind = "М"
keys = [
  "устаревш | rc4 | sha-1 | md5 | cbc | убрал",
  "forward secrecy | dhe | старый трафик | каждого сеанс",
]

[[card]]
id = "z-sni-ech"
q = "Что такое SNI, и почему провайдер видит, на какой сайт ты идёшь, даже по HTTPS?"
a = """SNI — в самом первом сообщении TLS (ClientHello) клиент пишет имя сайта. Так на одном IP могут жить много сайтов с разными сертификатами: сервер по имени выбирает нужный.
Но это имя идёт открытым текстом — шифрование ещё не началось. Поэтому провайдер и системы фильтрации видят, на какой сайт ты идёшь, хотя содержимое не видят.
ECH (Encrypted Client Hello) шифрует это имя ключом, взятым из DNS. Снаружи виден только общий домен, например CDN.
Коротко: SNI — имя сайта в первом сообщении TLS, открытым текстом; провайдер его видит; ECH его шифрует."""
