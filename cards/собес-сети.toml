[[card]]
id = "z-browser-request-flow"
q = "Ввёл в браузере адрес сайта и нажал Enter. Что происходит по шагам до показа страницы?"
a = """1. DNS: браузер узнаёт IP сайта — сначала в кэшах (браузер, /etc/hosts, ОС), иначе резолвер спрашивает по цепочке: корень → зона .ru → серверы домена.
2. TCP: трёхстороннее рукопожатие с сервером на порт 443.
3. TLS: сервер показывает сертификат, браузер проверяет его по цепочке доверия и имени, договариваются о ключе шифрования.
4. HTTP: браузер шлёт запрос (GET /путь, заголовок Host с именем сайта), сервер отвечает страницей.
5. Браузер разбирает страницу и так же догружает картинки, скрипты, стили.
Плюс HSTS: если сайт в этом списке, браузер сразу идёт по HTTPS.
Коротко: DNS → TCP-рукопожатие → TLS (проверка сертификата) → HTTP-запрос с Host → ответ и догрузка ресурсов."""
src = "networks/теория/собес-zubat-сети.md:70-111"
kind = "М"
keys = [
  "dns | ip адрес | резолв",
  "tcp | рукопожат | syn",
  "tls | сертификат | https",
  "http | get | host | запрос",
]
