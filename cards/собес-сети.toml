[[card]]
id = "z-snat-dnat"
q = "Чем отличаются SNAT, DNAT и MASQUERADE?"
a = """Это всё подмена адресов в пакетах (NAT).
SNAT — меняется адрес отправителя. Так локальная сеть выходит в интернет через один публичный IP. Цепочка POSTROUTING.
MASQUERADE — тот же SNAT, но адрес берётся с интерфейса автоматически. Нужен, когда внешний IP динамический.
DNAT — меняется адрес назначения. Это проброс порта: пришло на внешний 8080 — отправили на внутренний 10.0.0.5:80. Цепочка PREROUTING. Docker так публикует порты контейнеров (-p).
Ответы обратно транслируются сами — благодаря conntrack.
Коротко: SNAT меняет отправителя (выход в интернет), MASQUERADE — SNAT с авто-адресом, DNAT меняет получателя (проброс порта)."""
src = "networks/теория/собес-zubat-сети.md:501-521"
kind = "М"
keys = [
  "snat | отправител | источник",
  "dnat | назначени | получател | проброс",
  "masquerade | динамич | автомат",
]
