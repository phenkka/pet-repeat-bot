id = "z-mtls"
q = "Что такое mTLS, где его используют, и в чём главная сложность?"
a = """В обычном TLS сертификат показывает только сервер. В mTLS сертификат показывают обе стороны: сервер проверяет и клиента по доверенному центру сертификации. Подключится только тот, у кого есть правильный сертификат.
Где: связь сервисов между собой (service mesh Istio, Linkerd включает mTLS между подами сам), компоненты Kubernetes (etcd, API-сервер), доступ к внутренним API, zero trust.
Сложность — выпускать и вовремя менять много короткоживущих сертификатов. Это автоматизируют cert-manager, Vault, SPIFFE.
Коротко: обе стороны предъявляют сертификаты; для связи сервисов, etcd, mesh; сложность — выпуск и ротация сертификатов."""
