[[card]]
id = "z-conntrack-full"
q = "В dmesg «nf_conntrack: table full, dropping packet». Что это и как выглядит снаружи?"
a = """conntrack — таблица, где ядро помнит все текущие соединения. На ней держатся правила «пропускать уже установленные» и NAT (чтобы вернуть ответ правильному клиенту). Docker и kube-proxy пользуются им очень активно.
Когда таблица заполнена, новые соединения просто выкидываются. Снаружи это выглядит как случайные таймауты, без понятной причины.
Что делать: увеличить nf_conntrack_max (с оглядкой на память), уменьшить таймауты (установленное соединение по умолчанию помнится 5 суток), не отслеживать трафик, которому это не нужно (notrack в таблице raw).
Коротко: таблица соединений ядра переполнена, новые соединения дропаются — снаружи случайные таймауты; поднять max и уменьшить таймауты."""
src = "networks/теория/собес-zubat-сети.md:561-578"
