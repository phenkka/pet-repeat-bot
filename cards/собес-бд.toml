[[card]]
id = "z-pg-mvcc-autovacuum"
q = "Как PostgreSQL хранит изменения строк (MVCC), и почему autovacuum нельзя отключать?"
a = """UPDATE в PostgreSQL не переписывает строку, а создаёт её новую версию, старая помечается устаревшей. DELETE тоже только помечает. За счёт этого каждая транзакция видит свой снимок данных, и читатели не блокируют писателей.
Обратная сторона — копятся мёртвые версии строк. Autovacuum в фоне их убирает, обновляет статистику для планировщика и «замораживает» старые строки, чтобы не переполнился счётчик транзакций. Если заморозка не успевает, PostgreSQL в итоге перестаёт принимать запись.
Главный враг vacuum — долгие транзакции и сессии «idle in transaction»: они держат старый снимок, и мёртвые строки удалить нельзя.
Коротко: UPDATE создаёт новую версию строки, мёртвые копятся; autovacuum убирает их и спасает от переполнения счётчика транзакций."""
src = "databases/теория/собес-zubat-бд.md:127-142"
kind = "М"
keys = [
  "верси | новую верси | не перезаписыва",
  "мертв | dead | убира | чист",
  "счетчик | wraparound | заморозк | freeze | долгие транзакц | idle",
]
need = 2

[[card]]
id = "z-pg-wal"
q = "Что такое WAL в PostgreSQL и почему pg_wal может съесть весь диск?"
a = """WAL — журнал, куда любое изменение пишется до того, как попадёт в сами файлы таблиц. При COMMIT достаточно записать журнал (последовательная запись — быстро), страницы таблиц пишутся потом.
Зачем: после сбоя база проигрывает журнал и восстанавливается; реплики получают поток WAL; архив WAL вместе с базовым бэкапом даёт восстановление на любой момент (PITR).
pg_wal переполняет диск в двух частых случаях: сломался archive_command (сегменты не архивируются и не удаляются) или висит неактивный слот репликации, который держит все сегменты для отключившейся реплики. Ограничивают через max_slot_wal_keep_size.
Коротко: WAL — журнал изменений до записи в таблицы (сбои, репликация, PITR); диск съедают сломанный archive_command или брошенный слот."""
src = "databases/теория/собес-zubat-бд.md:217-229"
kind = "М"
keys = [
  "журнал | до записи | wal",
  "восстановл | сбо | репликац | pitr",
  "archive_command | архив | слот | slot",
]
need = 2

[[card]]
id = "z-pg-sync-async-repl"
q = "Синхронная и асинхронная репликация PostgreSQL: что теряешь в каждой?"
a = """Асинхронная (по умолчанию): мастер подтверждает COMMIT, не дожидаясь реплики. Быстро, но если мастер упадёт, последние транзакции, не долетевшие до реплики, пропадут.
Синхронная: COMMIT подтверждается только после ответа реплики. Данные не теряются, но запись медленнее. И если единственная синхронная реплика недоступна — запись на мастере останавливается совсем. Поэтому пишут `ANY 1 (replica1, replica2)`.
Отставание реплики надо мониторить (pg_stat_replication на мастере): приложение, читающее с реплики, видит устаревшие данные.
Коротко: асинхронная — быстро, но при падении мастера теряются последние транзакции; синхронная — без потерь, но медленнее и может встать запись."""
src = "databases/теория/собес-zubat-бд.md:253-267"
kind = "М"
keys = [
  "асинхрон | не дожида | теря | последн транзакц",
  "синхрон | дожида | медлен | встанет | останов",
]

[[card]]
id = "z-pgbouncer"
q = "Зачем PostgreSQL нужен пулер вроде PgBouncer, и какой подвох у режима transaction?"
a = """В PostgreSQL каждое подключение — отдельный процесс со своей памятью. Тысячи подключений — это много памяти, переключений и конкуренции, и база тормозит задолго до max_connections. Особенно когда разом перезапускаются сотни подов и все одновременно подключаются.
PgBouncer держит небольшой пул реальных подключений к базе и раздаёт их множеству клиентов.
Режим transaction (самый популярный) выдаёт соединение только на время одной транзакции. Подвох: нельзя полагаться на состояние сессии — SET, временные таблицы, LISTEN/NOTIFY, advisory locks. Следующая транзакция может попасть в другое реальное соединение.
Коротко: каждое подключение — процесс, тысячи душат базу; PgBouncer держит маленький пул; в transaction-режиме нет состояния сессии."""
src = "databases/теория/собес-zubat-бд.md:289-301"
kind = "М"
keys = [
  "процесс | памят | дорог",
  "пул | pool | pgbouncer",
  "сесси | set | временн таблиц | listen",
]
need = 2

[[card]]
id = "z-pg-backup-pitr"
q = "Какие бывают бэкапы PostgreSQL, что такое PITR, и когда бэкап на самом деле не бэкап?"
a = """pg_dump — логический бэкап одной базы в SQL. Можно восстановить отдельную таблицу, перенести между версиями. Но медленно на больших базах и только на момент дампа.
pg_basebackup — физическая копия всего кластера, основа для реплики и PITR.
pgBackRest, WAL-G, Barman — для прода: полные и инкрементальные бэкапы, сжатие, шифрование, хранение в S3, архив WAL.
PITR — восстановление на любой момент: базовый бэкап плюс проигрывание архива WAL до нужной секунды. Например, на момент за минуту до ошибочного DELETE.
Бэкап, который ни разу не восстанавливали, бэкапом не считается — восстановление надо регулярно проверять.
Коротко: pg_dump логический, basebackup физический, для прода pgBackRest/WAL-G; PITR = базовый бэкап + WAL до нужного момента; непроверенный бэкап не бэкап."""
src = "databases/теория/собес-zubat-бд.md:302-319"
kind = "М"
keys = [
  "pg_dump | логическ",
  "basebackup | физическ | pgbackrest | wal-g | barman",
  "pitr | любой момент | wal",
  "провер | восстанавл | не восстанавлив",
]
need = 3

[[card]]
id = "z-pg-zero-downtime-migration"
q = "Какие миграции PostgreSQL блокируют таблицу на проде, и как делать их без простоя?"
a = """Опасные операции берут жёсткую блокировку таблицы, и все запросы к ней встают в очередь.
Как безопасно:
индексы — только `CREATE INDEX CONCURRENTLY` (обычный CREATE INDEX блокирует запись);
NOT NULL и внешние ключи — сначала `ADD CONSTRAINT ... NOT VALID`, потом отдельно `VALIDATE CONSTRAINT`;
смена типа колонки переписывает всю таблицу — избегать или делать через новую колонку;
переименование — через новую колонку, а не RENAME за один шаг;
большие UPDATE — пачками, чтобы не раздувать WAL и отставание реплик;
всегда `SET lock_timeout`: миграция не может взять блокировку — пусть упадёт и повторится, а не держит очередь из всех запросов.
И общая схема — expand/contract: схема какое-то время совместима со старым и новым кодом.
Коротко: CREATE INDEX CONCURRENTLY, NOT VALID + VALIDATE, батчи и lock_timeout; схема меняется по expand/contract."""
src = "databases/теория/собес-zubat-бд.md:337-354"
kind = "М"
keys = [
  "concurrently",
  "lock_timeout | lock timeout | блокировк",
  "not valid | validate | батч | пачк | expand",
]
need = 2
