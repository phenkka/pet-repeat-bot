# Харденинг Linux. Лекция спецкурса УЦСБ «Безопасность GNU/Linux».
# kind М: по методичке. keys: варианты через |.

[[card]]
id = "sysctl-ip-forward"
q = "По чек-листу харденинга выключили `net.ipv4.ip_forward`. На каких хостах это сломает работу?"
a = """На маршрутизаторах и на хостах с Docker или Kubernetes: сеть контейнеров ходит через хост, пакеты пересылаются.
Выключают, только если хост не маршрутизирует и контейнеров на нём нет. Лекция это оговаривает, слепой CIS-скрипт - нет."""
src = "linux/теория/харденинг-linux.md:58-91"
kind = "М"
keys = [
  "docker | kubernetes | контейнер | маршрутизатор",
  "пересыл | forward | через хост | сеть контейнер",
]
need = 1

[[card]]
id = "sysctl-source-route-smurf"
q = "Зачем на сервере запрещают source routing и ping на широковещательный адрес?"
a = """accept_source_route=0: иначе отправитель сам задаёт маршрут пакета и может провести его в обход фильтров.
icmp_echo_ignore_broadcasts=1: защита от Smurf - атакующий шлёт ping на broadcast с адресом жертвы, и вся сеть отвечает жертве."""
src = "linux/теория/харденинг-linux.md:58-91"
kind = "М"
keys = [
  "маршрут | source rout | обход",
  "smurf | broadcast | широковещ | все отвечают",
]

[[card]]
id = "pam-faillock-pwquality"
q = "Чем на уровне PAM закрывают перебор пароля и слабые пароли?"
a = """pam_faillock (/etc/security/faillock.conf): блокировка после N неудачных входов на время.
pam_pwquality (/etc/security/pwquality.conf): длина, классы символов, словарные пароли.
SSH тоже идёт через PAM при UsePAM yes."""
src = "linux/теория/харденинг-linux.md:92-119"
kind = "М"
keys = [
  "faillock | блокир | неудачн | попыт",
  "pwquality | длин | классы | сложност | словарн",
]

[[card]]
id = "sshd-hardening-options"
q = "Какие опции sshd_config сужают доступ по SSH сверх `PermitRootLogin no`?"
a = """AllowUsers/AllowGroups - белый список, кто вообще входит. Ciphers без слабых CBC. ClientAliveInterval/CountMax - отрубать мёртвые сессии.
DisableForwarding yes - без туннелей и X11. GSSAPIAuthentication no, если не Kerberos. Перед перезапуском `sshd -t`."""
src = "linux/теория/харденинг-linux.md:120-147"
kind = "М"
keys = [
  "allowusers | allowgroups | белый список | кто может войти",
  "cipher | cbc | шифр",
  "forwarding | туннел | проброс | clientalive | таймаут",
]
need = 2

[[card]]
id = "ssh-disable-forwarding"
q = "Чем опасен разрешённый проброс портов в SSH на сервере?"
a = """Любой с ssh-доступом делает из сервера точку входа во внутреннюю сеть: туннель к внутренним сервисам, которые снаружи закрыты.
DisableForwarding yes выключает TCP-туннели и X11. Там, где туннели нужны (деплой), оставляют осознанно."""
src = "linux/теория/харденинг-linux.md:120-147"
kind = "М"
keys = [
  "внутренн сеть | точка вход | туннел | обход | внутренн сервис",
  "disableforwarding | выключ | запрет",
]
need = 1

[[card]]
id = "sudo-dangerous-binaries"
q = "Почему через sudo нельзя давать `vim`, `find`, `awk` или `cat`, хотя это «просто утилиты»?"
a = """Они умеют запустить оболочку или прочитать и записать любой файл. Отдал через sudo vim или find - отдал root целиком, cat читает /etc/shadow.
Каталог таких программ - GTFOBins. В sudoers только конкретная команда с полным путём и аргументами."""
src = "linux/теория/харденинг-linux.md:148-163"
kind = "М"
keys = [
  "оболочк | шелл | shell | запуст команд | любой файл | shadow",
  "конкретн команд | полный путь | аргумент | gtfobins | root целиком",
]

[[card]]
id = "suid-risk"
q = "Что делает SUID-бит и почему SUID-бинари ищут при аудите?"
a = """SUID - программа запускается с правами владельца файла, а не того, кто запустил. passwd так правит /etc/shadow от root.
Уязвимость в SUID-бинаре или возможность запустить из него шелл - прямой путь к root. Ищут: `find / -perm -4000 -type f`."""
src = "linux/теория/харденинг-linux.md:164-183"
kind = "М"
keys = [
  "права владельц | от root | владелец файла | от имени",
  "уязвим | шелл | повышен | root | find perm 4000",
]

[[card]]
id = "capabilities-bind-80"
q = "Сервер от обычного пользователя падает с `bind: permission denied` на порт 80. Как дать ему порт, не давая root?"
a = """Порты ниже 1024 требуют CAP_NET_BIND_SERVICE. Даём только эту capability, а не весь root.
На бинарь: `setcap cap_net_bind_service=+ep ./server`. Или capsh с ambient-набором при запуске. В контейнерах: cap_drop ALL и точечно cap_add."""
src = "linux/теория/харденинг-linux.md:184-205"
kind = "М"
keys = [
  "net bind service | cap net bind | capabilit",
  "setcap | capsh | ambient | не root | вместо root",
]

[[card]]
id = "seccomp-actions"
q = "Seccomp-фильтр поймал запрещённый системный вызов. Что он может с ним сделать, и какое действие полезно при составлении профиля?"
a = """Убить процесс или поток (KILL_PROCESS/KILL_THREAD), послать SIGSYS (TRAP), вернуть ошибку errno (ERRNO), передать трассировщику (TRACE), разрешить с записью в журнал (LOG), разрешить (ALLOW).
LOG при составлении профиля: всё работает, а в журнале видно, какие вызовы реально нужны."""
src = "linux/теория/харденинг-linux.md:206-224"
kind = "М"
keys = [
  "kill | убить | errno | ошибк | trap | sigsys",
  "log | журнал | записать | профил",
]

[[card]]
id = "ext4-journal-trap"
q = "Лектор сказал, что ext4 не журналируемая. Это так? Чем журнал полезен?"
a = """Нет: ext3 и ext4 журналируемые, журнала нет у ext2. Это ошибка на слайде.
Журнал записывает операции до применения: после сбоя ФС восстанавливается в целостное состояние без долгой проверки. JFS журналирует только метаданные."""
src = "linux/теория/харденинг-linux.md:238-252"
kind = "М"
keys = [
  "журналируем | есть журнал | ext2 без",
  "сбой | целостн | восстанов",
]
