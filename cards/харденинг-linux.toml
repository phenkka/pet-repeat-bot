# Харденинг Linux. Лекция спецкурса УЦСБ «Безопасность GNU/Linux».
# kind М: по методичке. keys: варианты через |.

# кнопка в меню бота. несколько файлов могут вести на одну
theme = "Linux"

[[card]]
id = "sysctl-ip-forward"
q = "По чек-листу харденинга выключили `net.ipv4.ip_forward`. На каких хостах это сломает работу?"
a = """`ip_forward` разрешает хосту пересылать чужие сетевые пакеты (работать как маршрутизатор). В чек-листах харденинга его выключают. Но на хосте с Docker или Kubernetes этого делать нельзя: сеть контейнеров ходит через хост, то есть ему как раз нужно пересылать пакеты. Выключишь — сломаешь сеть контейнеров.
Выключают, только если хост не маршрутизатор и контейнеров на нём нет.
Коротко: ip_forward нужен хосту с контейнерами; выключать можно только без них."""
src = "linux/теория/харденинг-linux.md:58-91"
kind = "М"
keys = [
  "docker | kubernetes | контейнер | маршрутизатор",
  "пересыл | forward | через хост | сеть контейнер",
]
need = 1

[[card]]
id = "sysctl-source-route-smurf"
q = "Зачем на сервере запрещают source routing и ping на широковещательный адрес?"
a = """Две защитные настройки сети.
Запрет source routing (`accept_source_route=0`): иначе отправитель пакета может сам задать маршрут, по которому пакет пойдёт, и провести его в обход фильтров.
Игнор ping на широковещательный адрес (`icmp_echo_ignore_broadcasts=1`): защита от атаки Smurf. В ней атакующий шлёт ping на broadcast-адрес сети, подставив адрес жертвы, и все хосты сети отвечают жертве — заваливают её трафиком.
Коротко: source routing даёт обход фильтров, broadcast-ping — атаку Smurf на жертву."""
src = "linux/теория/харденинг-linux.md:58-91"
kind = "М"
keys = [
  "маршрут | source rout | обход",
  "smurf | broadcast | широковещ | все отвечают",
]

[[card]]
id = "pam-faillock-pwquality"
q = "Чем на уровне PAM закрывают перебор пароля и слабые пароли?"
a = """PAM — это система модулей, через которую Linux проверяет вход. Два модуля для защиты паролей:
faillock — блокирует вход после нескольких неудачных попыток на время. Защита от перебора пароля.
pwquality — требования к паролю: длина, разные символы, не словарное слово. Защита от слабых паролей.
SSH тоже проходит через PAM, если включён `UsePAM yes`.
Коротко: faillock блокирует перебор, pwquality требует сложные пароли, оба через PAM."""
src = "linux/теория/харденинг-linux.md:92-119"
kind = "М"
keys = [
  "faillock | блокир | неудачн | попыт",
  "pwquality | длин | классы | сложност | словарн",
]

[[card]]
id = "sshd-hardening-options"
q = "Какие опции sshd_config сужают доступ по SSH сверх `PermitRootLogin no`?"
a = """Сверх запрета входа root по SSH доступ сужают так:
- `AllowUsers` / `AllowGroups` — белый список, кто вообще может войти;
- `Ciphers` без старых слабых шифров (режим CBC);
- `ClientAliveInterval` и `ClientAliveCountMax` — отрубать зависшие сессии;
- `DisableForwarding yes` — запретить туннели через сервер;
- `GSSAPIAuthentication no`, если не используешь Kerberos.
Перед перезапуском — `sshd -t`, проверка конфига, чтобы не потерять доступ.
Коротко: белый список входа, убрать слабые шифры, таймауты, запрет туннелей; перед рестартом sshd -t."""
src = "linux/теория/харденинг-linux.md:120-147"
kind = "М"
keys = [
  "allowusers | allowgroups | белый список | кто может войти",
  "cipher | cbc | шифр",
  "forwarding | туннел | проброс | clientalive | таймаут",
]
need = 2

[[card]]
id = "ssh-disable-forwarding"
q = "Чем опасен разрешённый проброс портов в SSH на сервере?"
a = """Проброс портов в SSH позволяет построить туннель через сервер. Если его не запрещать, любой, у кого есть доступ по SSH, превращает сервер в точку входа во внутреннюю сеть: может через туннель достучаться до внутренних сервисов, которые снаружи закрыты.
`DisableForwarding yes` это выключает. Там, где туннели реально нужны (например, деплой), их оставляют осознанно, а не по умолчанию.
Коротко: через проброс сервер становится дверью во внутреннюю сеть, его выключают."""
src = "linux/теория/харденинг-linux.md:120-147"
kind = "М"
keys = [
  "внутренн сеть | точка вход | туннел | обход | внутренн сервис",
  "disableforwarding | выключ | запрет",
]
need = 1

[[card]]
id = "sudo-dangerous-binaries"
q = "Почему через sudo нельзя давать `vim`, `find`, `awk` или `cat`, хотя это «просто утилиты»?"
a = """Через sudo нельзя давать `vim`, `find`, `awk`, `cat` и подобное, потому что из каждой этой программы можно либо запустить командную оболочку, либо прочитать и записать любой файл. Отдал через sudo `vim` или `find` — считай, отдал root целиком. `cat` под sudo прочитает /etc/shadow с хешами паролей.
Есть целый каталог таких приёмов — GTFOBins. Поэтому в sudoers дают только конкретную команду с полным путём и аргументами, а не программу вообще.
Коротко: из этих программ можно получить шелл или любой файл = root; давать только конкретную команду."""
src = "linux/теория/харденинг-linux.md:148-163"
kind = "М"
keys = [
  "оболочк | шелл | shell | запуст команд | любой файл | shadow",
  "конкретн команд | полный путь | аргумент | gtfobins | root целиком",
]

[[card]]
id = "suid-risk"
q = "Что делает SUID-бит и почему SUID-бинари ищут при аудите?"
a = """SUID-бит означает, что программа запускается с правами владельца файла, а не того, кто её запустил. Например, `passwd` принадлежит root и с SUID, поэтому обычный пользователь может сменить пароль (а это правка системного файла).
Опасность: если в SUID-программе есть уязвимость или из неё можно запустить оболочку — это прямой путь к root. Поэтому при аудите их ищут: `find / -perm -4000 -type f`.
Коротко: SUID запускает программу с правами владельца (root); уязвимость в ней = путь к root."""
src = "linux/теория/харденинг-linux.md:164-183"
kind = "М"
keys = [
  "права владельц | от root | владелец файла | от имени",
  "уязвим | шелл | повышен | root | find perm 4000",
]

[[card]]
id = "capabilities-bind-80"
q = "Сервер от обычного пользователя падает с `bind: permission denied` на порт 80. Как дать ему порт, не давая root?"
a = """Порты ниже 1024 по умолчанию может открыть только root. Поэтому сервер от обычного пользователя падает с `permission denied` на порт 80.
Но давать весь root не нужно — права root разбиты на кусочки (capabilities), и за низкие порты отвечает ровно один: `CAP_NET_BIND_SERVICE`. Даём только его: `setcap cap_net_bind_service=+ep ./server`. В контейнерах то же — сбросить все права (`cap_drop ALL`) и добавить точечно нужный.
Коротко: низкие порты требуют одну capability NET_BIND_SERVICE, её и даём вместо root."""
src = "linux/теория/харденинг-linux.md:184-205"
kind = "М"
keys = [
  "net bind service | cap net bind | capabilit",
  "setcap | capsh | ambient | не root | вместо root",
]

[[card]]
id = "seccomp-actions"
q = "Seccomp-фильтр поймал запрещённый системный вызов. Что он может с ним сделать, и какое действие полезно при составлении профиля?"
a = """Seccomp — это фильтр системных вызовов: процессу разрешают только нужные ему вызовы к ядру. Когда процесс делает запрещённый вызов, фильтр может: убить процесс или поток, послать сигнал SIGSYS, вернуть ошибку, передать отладчику или просто разрешить.
Отдельно полезно действие LOG — «разрешить, но записать в журнал». С ним составляют профиль: сначала всё разрешено и логируется, смотришь, какие вызовы реально нужны, потом по этому списку запрещаешь остальные.
Коротко: фильтр syscalls может убить/вернуть ошибку/разрешить; режим LOG помогает собрать профиль."""
src = "linux/теория/харденинг-linux.md:206-224"
kind = "М"
keys = [
  "kill | убить | errno | ошибк | trap | sigsys",
  "log | журнал | записать | профил",
]

[[card]]
id = "ext4-journal-trap"
q = "Лектор сказал, что ext4 не журналируемая. Это так? Чем журнал полезен?"
a = """На слайде лекции ошибка: ext4 как раз журналируемая. Журнала нет только у старой ext2, а ext3 и ext4 его имеют.
Журнал — это запись операций до того, как они применены к диску. После сбоя (отключили питание) система по журналу быстро приводит файловую систему в целостное состояние, без долгой полной проверки. У JFS журналируются только метаданные, а не сами данные.
Коротко: ext4 журналируемая (без журнала только ext2); журнал спасает целостность после сбоя."""
src = "linux/теория/харденинг-linux.md:238-252"
kind = "М"
keys = [
  "журналируем | есть журнал | ext2 без",
  "сбой | целостн | восстанов",
]
