Поэтому подавляю одну конкретную находку: в файл `.gitleaksignore` кладу её отпечаток (коммит, файл, правило, строка) и комментарий с причиной. Правило работает дальше, подавлена ровно эта находка в этом месте. Файл лежит в репозитории, изменение видно в истории и проходит ревью.
Коротко: подавить одну находку отпечатком в .gitleaksignore, не отключая правило."""
