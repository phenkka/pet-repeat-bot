[[card]]
id = "zap-oom"
q = "ZAP падает посреди full-скана: `Connection refused` к localhost, отчётов нет. Где причина и как лечить?"
a = """Ядро убило java по памяти: `dmesg | grep -i oom`, в cgroup `memory.events`.
Java берёт до четверти памяти машины, рядом GitLab и сканеры.
Лечение: `-z "-Xmx1g"`. Жёсткий лимит на dind впритык даёт тот же OOM."""
