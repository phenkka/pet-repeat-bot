  "пассив | passive | только смотрит | не атакует | мелоч | не нашел",
  "портит данн | ломает данн | reset | удаля | меняет данн | данные",
  "full | полн | актив | active",
]

[[card]]
id = "zap-gate-vs-crash"
q = "Джоба ZAP красная. Как отличить «нашёл уязвимости» от «упал сам ZAP»?"
a = """Джоба ZAP может покраснеть по двум причинам, и их надо различать.
Если это гейт — ZAP нашёл уязвимости выше порога: код выхода 1 и строка `ZAP found alerts`.
Если это сбой — упал сам ZAP: код выхода 3 и `Connection refused`.
Коротко: код 1 и «found alerts» — нашёл дыры; код 3 и «refused» — упал сам."""
src = "ci-cd/опыт/zap-dast-в-pipeline.md:154-155"
kind = "С"
keys = [
