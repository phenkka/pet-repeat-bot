[[card]]
id = "deploy-reverse-tunnel"
q = "Registry слушает только `127.0.0.1` на ноутбуке, а образ нужен на ВМ. Как ВМ его скачивает? Почему одного туннеля на 5050 мало?"
a = """Джоба идёт на ВМ по SSH с обратным туннелем `-R 127.0.0.1:5050:gitlab.test:5050`: порт открывается на ВМ, трафик по SSH идёт в джобу и дальше в registry. На ВМ `gitlab.test` = `127.0.0.1`.
Второй туннель на 443: перед pull registry отправляет Docker за токеном на `https://gitlab.test/jwt/auth`.
Деплой кончился - туннеля нет, registry наружу не открыт."""
