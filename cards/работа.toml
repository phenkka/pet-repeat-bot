[[card]]
id = "gitlab-hardening"
q = "Какие настройки GitLab скрипт ставит, чтобы посторонний не попал внутрь, а сам GitLab не стал входом во внутреннюю сеть?"
a = """Скрипт стенда сразу закрывает GitLab, чтобы посторонний не попал внутрь, а сам GitLab не стал дверью во внутреннюю сеть. Что ставится: регистрация выключена (чужой не заведёт аккаунт), новые проекты и группы приватные по умолчанию, обязательная двухфакторка (2FA) сразу, пароль от 12 символов. И запрет вебхукам ходить в локальную сеть — это защита от SSRF, чтобы через вебхук нельзя было достучаться до внутренних сервисов.
Коротко: закрыл регистрацию, сделал проекты приватными, включил 2FA, запретил вебхукам локальную сеть."""
