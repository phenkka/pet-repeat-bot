[[card]]
id = "zap-oom"
q = "ZAP падает посреди full-скана: `Connection refused` к localhost, отчётов нет. Где причина и как лечить?"
a = """ZAP падает посреди полного скана: `Connection refused` к localhost, отчётов нет. Причина — закончилась память, и ядро убило процесс java (на котором работает ZAP). Проверяется в журнале ядра: `dmesg | grep -i oom`.
Java по умолчанию забирает до четверти памяти машины, а рядом ещё GitLab и другие сканеры — не хватило. Лечение: ограничить аппетит java флагом `-z "-Xmx1g"` (один гигабайт хватает). Слишком жёсткий общий лимит памяти на контейнер даёт тот же OOM, так что ограничивать надо именно java.
Коротко: ядро убило java по памяти (OOM), лечит -Xmx1g для ZAP."""
src = "ci-cd/опыт/zap-dast-в-pipeline.md:163-184, 200-213"
kind = "С"
keys = [
  "oom | памят | memory | killed | убил",
  "dmesg | memory events | ядро | kernel | cgroup",
  "xmx | лимит | heap",
]

