a = """Пайплайн ходит в Dependency-Track с ключом отдельной команды (team), у которой всего четыре права — ровно то, что нужно, чтобы загрузить SBOM и прочитать находки. Это принцип минимальных привилегий: если ключ из CI утечёт, он не даст доступ к админке DT, только к этим двум операциям.
