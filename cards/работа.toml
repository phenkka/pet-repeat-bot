]

[[card]]
id = "failed-flag"
q = "В одной джобе четыре скана подряд. Первый нашёл проблему, и отчётов остальных трёх нет. Почему и как получить все отчёты при красной джобе?"
a = """Первая же находка роняет скрипт, остальные сканы не запускаются.
`FAILED=0` в начале, после каждого скана `|| FAILED=1`, в конце `if [ $FAILED -eq 1 ]; then exit 1`.
Плюс `artifacts: when: always`, иначе с красной джобы отчёты не выгрузятся."""
src = "работа/gitlab-pipeline-гейты-безопасности.md:218-221"
kind = "С"
keys = [
  "FAILED | флаг | переменн | в конце | после всех | сначала все | все отчеты | все сканы",
  "artifacts | артефакт | when always",
  "обрыв | оборв | прерыв | останавл | падает сразу | первая ошибка",
]

