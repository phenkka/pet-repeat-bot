[[card]]
id = "trivy-offline"
q = "«Первый раз скачали, дальше работает офлайн». Почему для trivy это не так?"
a = """Говорят «скачал один раз и дальше офлайн». Для trivy это не так: он скачивает базу уязвимостей при каждом запуске. Без сети и без базы он падает с `failed to download vulnerability DB`. Работает без сети, только если база уже лежит в кэше от прошлого раза.
На самом первом запуске `--skip-db-update` нельзя: базы ещё нет. Сама база весит около 1,4 ГБ в распакованном виде.
Коротко: trivy тянет базу уязвимостей каждый запуск, офлайн только если она в кэше."""
