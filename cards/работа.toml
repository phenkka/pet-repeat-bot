id = "dt-version-branch"
q = "В Dependency-Track версия проекта = имя ветки. Что это даёт?"
a = """В Dependency-Track у проекта есть «версия», и я использую как версию имя ветки git. Что это даёт: каждый прогон заменяет список зависимостей (SBOM) этой версии, и в DT всегда актуальное состояние ветки без дублей. А между прогонами видно, что добавилось и что исправили.
