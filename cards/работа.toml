[[card]]
id = "semgrep-registry-rules"
q = "Semgrep берёт наборы правил `p/...` из реестра. Чем это плохо для гейта и для работы без интернета?"
a = """Semgrep берёт наборы правил из реестра (это как скачивание из интернета при каждом запуске). Два минуса. Первый: версия наборов не зафиксирована, правила со временем меняются, и один и тот же код завтра может дать другой результат — прогон не повторить. Второй: без интернета реестр недоступен, а значит и сканер не отработает.
Если положить правила в репозиторий, semgrep работает без сети и даёт одинаковый результат.
Коротко: правила из реестра не зафиксированы по версии и требуют интернета."""
