[[card]]
id = "runner-tag-only"
q = "Раннер берёт только джобы с тегом `docker` (`run_untagged: false`). Зачем так, и какая цена?"
a = """Я настроил раннер так, что он берёт только джобы с тегом `docker`. Зачем: чтобы точно знать, на каком раннере что выполняется, и не ловить чужие джобы.
Цена такого выбора: джоба без тега не запустится вообще — будет вечно висеть в ожидании (`pending`), без ошибки. Поэтому про тег надо помнить.
Коротко: тег = контроль, где исполняется джоба; без тега джоба зависает в pending."""
