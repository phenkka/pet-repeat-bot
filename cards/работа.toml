[[card]]
id = "gitlab-secrets-json"
q = "Бэкап базы GitLab есть, а `gitlab-secrets.json` потерян. Что теряешь?"
a = """Файл `gitlab-secrets.json` — это ключ, которым GitLab шифрует в своей базе чувствительные данные: CI-переменные, секреты двухфакторки, токены раннеров. Если есть бэкап базы, но нет этого файла, базу не расшифровать и не восстановить — она станет бесполезной.
Поэтому копию файла держу рядом со скриптом, права 600 (только владелец).
Коротко: им зашифрованы секреты в базе, без него бэкап базы не восстановить."""
