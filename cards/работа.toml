  "код 3 | exit 3 | connection refused | refused | не подключ",
]

[[card]]
id = "tee-exit-code"
q = "К гейту предлагают дописать `python gate.py | tee summary.txt`. Что сломается?"
a = """Код выхода у цепочки команд через конвейер (пайп) берётся от последней команды. `tee` (запись в файл) всегда завершается успешно. Поэтому если дописать `python gate.py | tee summary.txt`, то гейт найдёт уязвимость и упадёт с кодом 1, но джоба увидит успешный `tee` и останется зелёной.
Лечится включением `set -o pipefail` (код всей цепочки = код первой упавшей команды) или записью файла прямо из Python, без tee.
Коротко: код берётся у tee, а он всегда успешен, нужен pipefail."""
src = "ci-cd/опыт/zap-dast-в-pipeline.md:189-191"
kind = "С"
keys = [
  "последн | last",
  "tee всегда | tee успеш | всегда 0 | всегда успеш | код 0 | нулев",
  "pipefail | пайпфейл | из python | из питона | питоном",
]

[[card]]
id = "deploy-reverse-tunnel"
q = "Registry слушает только `127.0.0.1` на ноутбуке, а образ нужен на ВМ. Как ВМ его скачивает? Почему одного туннеля на 5050 мало?"
a = """Registry с образами слушает только на ноутбуке (127.0.0.1), снаружи его нет. А образ надо скачать на ВМ. Делается это обратным SSH-туннелем: джоба подключается к ВМ по SSH и открывает на ВМ порт, весь трафик с которого идёт обратно в джобу, а оттуда в registry. На ВМ имя registry прописано на localhost, поэтому Docker думает, что registry рядом.
Одного туннеля мало, потому что перед скачиванием образа registry сначала отправляет Docker за токеном авторизации на порт 443. Значит, нужен второй туннель на 443. Деплой закончился — туннели закрылись, registry наружу так и не был виден.
Коротко: обратный туннель с ВМ в джобу, второй на 443 под токен авторизации."""
src = "ci-cd/опыт/деплой-на-vm-через-ssh-туннель.md:62-65, 189-210"
kind = "С"
keys = [
  "обратн | reverse | ремоут | remote",
  "443 | токен | token | jwt | auth | авторизац",
  "закрыт | не открыт | только на время | localhost | 127",
]

[[card]]
id = "grep-pipefail"
q = "Скрипт считает CRITICAL через `grep -o ... | wc -l`. Когда CRITICAL ноль, джоба молча обрывается на этой строке. Почему?"
a = """`grep`, если ничего не нашёл, завершается с кодом 1 (это не ошибка, это «совпадений нет»). А скрипт гоняется с `set -e` и `pipefail` — любая команда с ненулевым кодом останавливает скрипт. Поэтому когда критичных уязвимостей ноль, `grep` возвращает 1, и скрипт молча обрывается на подсчёте.
Лечится дописыванием `|| true` после grep: «если grep вернул не ноль, всё равно продолжай».
Коротко: grep без совпадений возвращает 1, с set -e скрипт падает, спасает || true."""
src = "ci-cd/опыт/sbom-syft-и-dependency-track.md:263-265"
kind = "С"
keys = [
  "grep 1 | grep код 1 | возвращает 1 | ничего не нашел | без совпаден | не нашел",
  "pipefail | set e | пайпфейл",
  "true",
]

[[card]]
id = "ci-job-token"
q = "Джобе телеметрии нужен список джоб пайплайна из GitLab API. Каким токеном она ходит и почему не личным?"
a = """Джобе нужно сходить в API GitLab за списком джоб. Для этого есть встроенный токен `CI_JOB_TOKEN` — GitLab выдаёт его каждой джобе и он живёт ровно пока идёт джоба. Для списка джоб его прав хватает.
Личный токен брать не стоит: он долгоживущий. Если он утечёт из логов или переменных, им можно пользоваться месяцами. А встроенный токен умирает вместе с джобой.
Коротко: встроенный CI_JOB_TOKEN живёт только во время джобы, личный — долгоживущий риск."""
