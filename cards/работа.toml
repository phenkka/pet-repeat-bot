a = """У каждой находки есть отпечаток (fingerprint), по которому система понимает, та же это находка или новая. В отпечаток нельзя класть digest образа и IP виртуалки, потому что они меняются при каждом прогоне. Если их включить, одна и та же находка каждый раз выглядела бы новой, и нельзя было бы отличить реально новое от старого.
Коротко: digest и IP меняются каждый прогон, из-за них старая находка казалась бы новой."""
