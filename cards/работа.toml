[[card]]
id = "grep-pipefail"
q = "Скрипт считает CRITICAL через `grep -o ... | wc -l`. Когда CRITICAL ноль, джоба молча обрывается на этой строке. Почему?"
a = """`grep` без совпадений возвращает 1.
GitLab гоняет скрипт с `pipefail` и `set -e`: конвейер упал, скрипт вышел без сообщения.
