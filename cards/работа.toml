[[card]]
id = "cert-san"
q = "Сертификат выпущен с CN=gitlab.test, а раннер и trivy всё равно ругаются на TLS. Почему?"
a = """Сертификат выпущен с правильным именем (CN=gitlab.test), но раннер и trivy всё равно ругаются на TLS. Причина: современные программы смотрят не на старое поле CN, а на поле SAN (список имён, для которых годится сертификат). Раннер и trivy написаны на Go, а Go поле CN вообще игнорирует.
Лечится добавлением SAN в сертификат: `DNS:gitlab.test` и `IP:127.0.0.1`.
Коротко: клиенты смотрят в SAN, а не в CN; нужно вписать имя и IP в SAN."""
src = "ci-cd/опыт/gitlab-локальный-стенд-скрипт.md:142-153"
kind = "С"
keys = [
  "san | subject alternative | alt name | альтернатив",
  "cn | go | игнор",
]

[[card]]
id = "deploy-password-stdin"
q = "Почему на ВМ `docker login` идёт через `--password-stdin`, а не `-p пароль`? И что после pull?"
a = """На ВМ надо залогиниться в registry. Если передать пароль прямо в команде (`-p пароль`), его увидит любой пользователь ВМ в списке процессов (`ps`): аргументы команд там видны всем. Поэтому пароль подаётся со входа (`--password-stdin`) — так он в списке процессов не светится.
Сам пароль тут — одноразовый токен джобы. После скачивания образа делаю `docker logout`, чтобы стереть его с ВМ.
Коротко: пароль в аргументах виден в ps, подаю через stdin, после — logout."""
