[[card]]
id = "kaniko-own-ca"
q = "Kaniko пушит образ в registry GitLab со своим CA и падает на TLS. Почему и как починено?"
a = """У моего registry самоподписанный сертификат (свой удостоверяющий центр, CA). Kaniko по умолчанию такому CA не доверяет и считает registry «ненадёжным» — сборка падает на TLS.
Чинится так: свой CA дописываю в список доверенных сертификатов kaniko. Файл с этим CA GitLab сам кладёт в джобу в переменную `$CI_SERVER_TLS_CA_FILE`.
Коротко: kaniko не доверяет своему CA, дописываю CA из CI_SERVER_TLS_CA_FILE."""
