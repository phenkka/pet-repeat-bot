[[card]]
id = "semgrep-green"
q = "Semgrep нашёл проблемы, а джоба зелёная. Две разные причины, по которым гейт мог это пропустить?"
a = """1. Semgrep сам выходит с кодом 0 даже с находками, если нет `--error`. Нужен свой гейт: читает JSON, считает по severity, падает по порогу.
2. Ошибки скана в первой версии только печатались: файл не разобран, значит не проверен, а гейт зелёный.
Ещё дыра: severity, которой нет в списке порогов, гейт пропускает молча."""
