[[card]]
id = "dt-false-positive"
q = "Как в твоей схеме помечается false positive по зависимостям, чтобы он не ронял гейт?"
a = """Если по зависимости пришло ложное срабатывание, я помечаю его в Dependency-Track как подавленное (suppressed) с обоснованием. Подавленные находки не попадают в ответ API, а значит, и гейт в пайплайне их не видит и не краснеет из-за них.
Коротко: помечаю suppressed с обоснованием, такие находки не уходят в гейт."""
