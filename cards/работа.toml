a = """Сборка в два этапа: в итоговый nginx-образ уходят только `.min.js`, `package.json` остаётся в builder.
Сканер ищет пакеты по метаданным, а их в образе нет.
Второй SBOM по `package-lock.json`: образ даёт ОС и nginx, lock-файл даёт JS.
