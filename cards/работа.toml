# Карточки по работа/. Вопрос про механизм, ответ строго по файлу базы.
# kind: С - своё, делал руками. М - по методичке.
# keys: что обязано быть в ответе. варианты через |, слова в любом порядке.
# засчитано, если покрыто 2/3 пунктов (или need). опечатки и сокращения прощаются.

# кнопка в меню бота. несколько файлов могут вести на одну
theme = "Мой пайплайн"

[[card]]
id = "gitleaks-history"
q = "Секрет закоммитили месяц назад и следующим коммитом удалили. Gitleaks в CI с настройками GitLab по умолчанию ничего не нашёл. Почему и что поменять в джобе?"
a = """GitLab по умолчанию скачивает не весь репозиторий, а только последние коммиты (поверхностный клон). Секрет закоммитили месяц назад, значит, в джобе этих старых коммитов просто нет, и gitleaks их не видит.
Чинится двумя настройками: `GIT_DEPTH: 0` — скачать всю историю, и `--log-opts="--all"` — проверять все ветки. Удалённый файл остаётся в старом коммите, по полной истории он находится.
Коротко: клон был неполный, нужен GIT_DEPTH 0 и проверка всей истории."""
src = "ci-cd/опыт/gitlab-pipeline-гейты-безопасности.md:101-104"
kind = "С"
keys = [
  "полный клон | GIT_DEPTH | глубин | shallow | поверхност | неполн | не вся история",
  "все ветки | all | log-opts | всех веток | другие ветки",
  "старый коммит | история | истории | в коммите | history",
]

[[card]]
id = "dind-vs-sock"
q = "Почему раннер на Docker-in-Docker, а не с `docker.sock` хоста? Какой минус у dind и чем он закрыт?"
a = """Можно дать джобе доступ к Docker хоста (через сокет docker.sock), и тогда она сможет собирать образы. Но это фактически права root на всей машине: джоба управляла бы всеми контейнерами, включая сам GitLab.
Поэтому я использую Docker-in-Docker (dind) — отдельный Docker внутри контейнера, песочница. Минус: сам dind приходится запускать привилегированным. Но у самих джоб привилегий нет (раннер с `privileged = false`), а образы собирает kaniko, которому привилегии не нужны.
Коротко: сокет хоста = root на машине, поэтому dind-песочница, а не docker.sock."""
src = "ci-cd/опыт/gitlab-локальный-стенд-скрипт.md:53-58"
kind = "С"
keys = [
  "root | рут | весь хост | всеми контейнерами | права хоста | чрут | на хост",
  "privileged | привилег",
  "kaniko | каник | buildah",
]

[[card]]
id = "digest-vs-tag"
q = "Образ собрали и просканировали, а пока шли стадии, тот же тег перепушили другим образом. Что выкатится по тегу и что меняет digest?"
a = """Тег образа (например `latest`) — это просто ярлык, его можно перевесить на другой образ. Digest — это отпечаток содержимого, уникальный хеш: другой образ = другой digest.
Если деплоить по тегу, между проверкой и выкаткой кто-то может подменить образ под тем же тегом, и в прод уедет не то, что проверяли. Поэтому и сканирование, и деплой у меня идут по digest: на ВМ запускается ровно тот образ, который проверил trivy.
Коротко: тег перевешивается, digest — отпечаток, деплой по digest."""
src = "ci-cd/опыт/деплой-на-vm-через-ssh-туннель.md:182-185"
kind = "С"
keys = [
  "перевес | перезапис | подмен | ярлык | перепуш | другой образ",
  "отпечат | хеш | hash | sha | содержим | уникальн",
  "просканир | проверен | скан | тот же образ | тот самый",
]

[[card]]
id = "semgrep-green"
q = "Semgrep нашёл проблемы, а джоба зелёная. Две разные причины, по которым гейт мог это пропустить?"
a = """Semgrep — сканер кода (SAST). Он может найти проблемы, но сам по себе завершается успешно (код 0), если явно не сказать иначе. Поэтому джоба зелёная, хотя находки есть.
Две причины пропуска: во-первых, нужен свой гейт — скрипт, который читает отчёт semgrep, считает находки по важности и роняет джобу по моему порогу. Во-вторых, в первой версии гейта ошибки разбора файлов только печатались: файл не проверен, а гейт всё равно зелёный.
Коротко: semgrep выходит с кодом 0 даже с находками, нужен свой гейт по порогу."""
src = "ci-cd/опыт/gitlab-pipeline-гейты-безопасности.md:155-157, 181-188"
kind = "С"
