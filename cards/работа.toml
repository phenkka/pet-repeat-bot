id = "dind-vs-sock"
q = "Почему раннер на Docker-in-Docker, а не с `docker.sock` хоста? Какой минус у dind и чем он закрыт?"
a = """`docker.sock` - это root на машине: джоба управляла бы всеми контейнерами, включая сам GitLab.
С dind джобы в своей песочнице.
Минус: сам dind запускается `privileged`.
