  "код 0 | exit 0 | нулев | error | код выхода | exit code",
  "ошибки скана | errors | не разобрал | не проверил | не проверен",
  "порог | severity | уровн | critical | критикал",
]

[[card]]
id = "failed-flag"
q = "В одной джобе четыре скана подряд. Первый нашёл проблему, и отчётов остальных трёх нет. Почему и как получить все отчёты при красной джобе?"
a = """Если в джобе четыре скана подряд и первый же упадёт на находке, остальные три просто не запустятся, и их отчётов не будет.
Решение: в начале ставлю переменную `FAILED=0`, после каждого скана дописываю `|| FAILED=1` (скан отработал, но ошибку запомнили), а в самом конце `if [ $FAILED -eq 1 ]; then exit 1`. Так все четыре скана выполняются, и только потом джоба краснеет. Плюс `artifacts: when: always`, иначе с красной джобы отчёты не выгрузятся.
Коротко: собрать все ошибки в флаг, упасть в конце, артефакты всегда выгружать."""
src = "ci-cd/опыт/gitlab-pipeline-гейты-безопасности.md:218-221"
kind = "С"
keys = [
  "FAILED | флаг | переменн | в конце | после всех | сначала все | все отчеты | все сканы",
  "artifacts | артефакт | when always",
  "обрыв | оборв | прерыв | останавл | падает сразу | первая ошибка",
]

[[card]]
id = "sbom-two-sources"
q = "Скан frontend-образа не видит jquery, lodash, axios, хотя сайт ими пользуется. Почему и как решено?"
a = """Сайт (фронтенд) собирается в два этапа. В итоговый образ с nginx попадают только готовые `.min.js` файлы, а `package.json` со списком библиотек остаётся на этапе сборки. Сканер образа ищет библиотеки по их описаниям (метаданным), а в образе их нет — вот он jquery и lodash и не видит.
Поэтому делаю два списка зависимостей (SBOM): один по образу (даёт ОС и nginx), второй по `package-lock.json` (даёт JS-библиотеки).
Коротко: в образе только min.js без метаданных, второй SBOM снимаю по lock-файлу."""
src = "ci-cd/опыт/sbom-syft-и-dependency-track.md:83-87"
kind = "С"
keys = [
  "package-lock | package json | lock | исходник | source",
  "метадан | metadata | min js | собранн | только файлы | без package",
  "два этапа | multi stage | multistage | builder | сборщик | многоэтап",
]

[[card]]
id = "trivy-dockerfile-only"
q = "Trivy умеет сканировать образы, а у тебя проверяет только Dockerfile. Что было бы, если оставить ему образы?"
a = """Trivy умеет сканировать и образы, и зависимости. Но зависимости у меня уже проверяет Dependency-Track. Если и trivy оставить на образы, одна и та же уязвимость посчитается дважды, в двух отчётах.
Поэтому все уязвимости зависимостей собираю в одном месте — в Dependency-Track: там убираются дубли между прогонами и помечаются ложные срабатывания. А trivy оставил только на то, чего DT не умеет: проверку самого Dockerfile.
Коротко: иначе CVE считались бы дважды, trivy оставил только на Dockerfile."""
src = "ci-cd/опыт/sbom-syft-и-dependency-track.md:28, 191-193"
kind = "С"
keys = [
  "дважды | дубл | два раза | duplicate | повтор",
  "dependency track | dt | диптрек | дт | в одном месте",
  "config | конфиг | dockerfile | докерфайл",
]

[[card]]
id = "zap-baseline-full"
q = "ZAP baseline прошёл зелёным. Значит, серьёзных дыр нет? И почему полный скан только на staging?"
a = """У ZAP два режима. Baseline — пассивный, он только смотрит на ответы сервера и находит мелочи: нет заголовков безопасности, старая библиотека, видна версия nginx. Серьёзные дыры (SQL-инъекцию, выполнение команд, XSS) находит только полный скан, потому что он реально шлёт атаки.
Полный скан портит данные (дёргает сброс и подобное), поэтому его гоняют только на тестовом стенде (staging), а не на проде. Для этого staging и нужен.
Коротко: зелёный baseline ничего не гарантирует, активный скан только на staging."""
src = "ci-cd/опыт/zap-dast-в-pipeline.md:24-30"
kind = "С"
