[[card]]
id = "setup-pat-rotation"
q = "Скрипт стенда при каждом запуске выпускает новый токен для API. Почему через rails, и что с прошлыми токенами?"
a = """Скрипту нужен токен, чтобы настраивать GitLab через API. Но на свежей установке API без токена отвечает «не авторизован» — токен через API не создать (замкнутый круг). Поэтому первый токен скрипт создаёт в обход API, через внутреннюю консоль `gitlab-rails`.
При каждом запуске скрипт выпускает новый токен, а перед этим отзывает все старые с таким же именем. Иначе они копились бы, а каждый живой токен — это ключ к API, лишние ключи не нужны.
Коротко: токен через rails (API ещё закрыт), старые отзываются, чтобы не копились."""
src = "ci-cd/опыт/gitlab-локальный-стенд-скрипт.md:179-198, 427-430"
kind = "С"
keys = [
  "отзыва | revoke | удаля старые | старые",
  "копил | накаплива | много токенов | живой | ключ",
  "rails | курица | 401 | api нельзя",
]

[[card]]
id = "setup-idempotent"
q = "Что значит «скрипт стенда идемпотентный»? Что будет при повторном запуске, при падении посередине и с `--reset`?"
a = """Идемпотентный значит «можно запускать сколько угодно раз, хуже не станет». Повторный запуск пропускает то, что уже готово: сертификаты, живой раннер, импорт. Пароль root не трогается.
Если скрипт упал посередине — исправил причину, запустил снова, и готовые шаги пропустятся, доделаются только оставшиеся. А флаг `--reset` наоборот: сносит всё, включая данные GitLab, и поднимает с нуля.
Коротко: повторный запуск пропускает готовое и доделывает упавшее; --reset сносит всё."""
src = "ci-cd/опыт/gitlab-локальный-стенд-скрипт.md:308-321"
kind = "С"
keys = [
  "пропуск | готовое | уже есть | не ломает | не трога",
  "упал | посереди | ещё раз | заново запуст",
  "reset | снос | с нуля | удаля",
]

[[card]]
id = "root-password-once"
q = "Повторный запуск скрипта не перезаписывает пароль root, который ты сменил руками. Как он это понимает?"
a = """Если я сменил пароль root руками, повторный запуск скрипта не должен его затереть. Скрипт это понимает по счётчику входов: пароль ставится, только если root ещё ни разу не входил (счётчик входов равен нулю). Раз вход был — значит, пароль уже кто-то настроил, не трогаем.
Коротко: пароль ставится только если root ни разу не входил (счётчик входов = 0)."""
src = "ci-cd/опыт/gitlab-локальный-стенд-скрипт.md:181-184"
