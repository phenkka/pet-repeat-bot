Kaniko собирает образ без демона и без привилегий, прямо внутри контейнера джобы. Поэтому он и выбран. Минус: Google забросил проект. Если понадобится замена — buildah или форк kaniko.
Коротко: собирает образ без демона и без привилегий, раннер остаётся без прав."""
