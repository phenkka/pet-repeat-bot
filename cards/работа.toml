[[card]]
id = "kaniko-own-ca"
q = "Kaniko пушит образ в registry GitLab со своим CA и падает на TLS. Почему и как починено?"
a = """Kaniko не доверяет самодельному CA, registry для него недоверенный.
Свой CA дописывается в `/kaniko/ssl/certs/ca-certificates.crt` из `$CI_SERVER_TLS_CA_FILE`.
Эта переменная появляется у джоб из `--tls-ca-file` раннера."""
