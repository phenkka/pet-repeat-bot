[[card]]
id = "ssh-exit-on-forward-failure"
q = "Зачем ssh с туннелем запускать с `-o ExitOnForwardFailure=yes`?"
a = """Когда SSH идёт на ВМ с туннелем, туннель может не открыться (порт занят). Без опции `ExitOnForwardFailure=yes` ssh в таком случае молча выполнит команды уже без туннеля, и ошибка всплывёт где-то позже и непонятно где.
С этой опцией ssh сразу честно падает с `remote port forwarding failed`, и видно, в чём дело.
Коротко: без неё ssh работает без туннеля и прячет ошибку; с ней падает сразу."""
