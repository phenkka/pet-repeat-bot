# Собес: Git. Вопросы ZUBAT, ответы пересказаны просто.
# kind М: чужой материал, руками не проверялось. keys: варианты через |.

[[card]]
id = "z-merge-vs-rebase"
q = "Чем merge отличается от rebase, и почему нельзя делать rebase общей ветки?"
a = """merge сливает ветки, сохраняя историю как была: появляется коммит слияния, хэши старых коммитов не меняются.
rebase переносит твои коммиты поверх другой ветки и создаёт их заново — с новыми хэшами. История получается прямой и чистой.
Нельзя rebase общей ветки, потому что у коллег остались старые коммиты с прежними хэшами. После rebase и force push их история разойдётся с сервером, и работа может потеряться. Rebase — только для своих, ещё не опубликованных или личных веток.
Коротко: merge сохраняет историю и добавляет коммит слияния; rebase пересоздаёт коммиты с новыми хэшами — для общих веток нельзя."""
src = "git/теория/собес-zubat-git.md:43-76"
kind = "М"
keys = [
  "merge | коммит слиян | сохраня",
  "rebase | нов хэш | переписыва | пересозда",
  "общ | коллег | force | опубликован",
]
need = 2

[[card]]
id = "z-reset-vs-revert"
q = "Чем отличаются git reset --soft, --mixed и --hard? И когда нужен revert, а не reset?"
a = """Все три переносят ветку на указанный коммит, разница — что с изменениями:
--soft — изменения отменённых коммитов остаются подготовленными к коммиту (в индексе);
--mixed (по умолчанию) — остаются в файлах, но не подготовлены;
--hard — файлы приводятся к коммиту, незакоммиченное теряется.
reset переписывает историю — это для локальных, ещё не запушенных коммитов. Если коммит уже в общей ветке, нужен `git revert`: он создаёт новый коммит с обратными изменениями и не ломает историю коллегам.
Коротко: soft — в индексе, mixed — в файлах, hard — всё стёрто; запушенное откатывают revert, а не reset."""
src = "git/теория/собес-zubat-git.md:167-177"
kind = "М"
keys = [
  "soft | индекс",
  "hard | теря | стер",
  "revert | обратн коммит | запушен | общ",
]
need = 2

[[card]]
id = "z-reflog"
q = "Сделал `git reset --hard` и потерял коммиты. Как вернуть? А что вернуть нельзя?"
a = """`git reflog` — локальный журнал, куда указывала ветка и HEAD. Коммиты не удаляются сразу: пока на них есть запись в reflog, их можно вернуть (записи живут 90 дней, недостижимые коммиты — 30).
Нашёл нужное состояние, например HEAD@{3}, — `git reset --hard HEAD@{3}` или сохранить в новую ветку `git branch recovered <sha>`.
Вернуть нельзя то, что ни разу не было закоммичено — правки в файлах, стёртые reset --hard.
Оборотная сторона для безопасности: «удалённый» коммит на самом деле ещё живёт. На GitHub старый коммит после force push остаётся доступным по хэшу — поэтому у тебя «claude» и висел в Contributors.
Коротко: git reflog и reset или branch на нужный хэш; незакоммиченное не вернуть; «удалённые» коммиты живут ещё долго."""
src = "git/теория/собес-zubat-git.md:178-191"
kind = "М"
keys = [
  "reflog",
  "незакоммич | не было коммит | правки в файл",
]

[[card]]
id = "z-force-with-lease"
q = "Чем `git push --force-with-lease` лучше `--force`?"
a = """После rebase или amend опубликованной ветки нужен принудительный push.
--force перезаписывает ветку на сервере безусловно — и молча стирает коммиты коллеги, если он запушил их после твоего последнего fetch.
--force-with-lease перезапишет, только если ветка на сервере всё ещё там, где ты её видел в последний раз. Кто-то успел запушить — push отклонят, и ты сначала заберёшь его изменения.
Общие ветки (main, release) защищают на сервере: protected branch запрещает force push вообще.
Коротко: --force стирает чужие коммиты молча; --force-with-lease откажет, если ветку кто-то успел изменить."""
src = "git/теория/собес-zubat-git.md:247-259"
kind = "М"
keys = [
  "стира | перезаписыва | чужие | коллег",
  "lease | только если | откаж | отклон",
]

[[card]]
id = "z-gitignore-tracked"
q = "Добавил файл в .gitignore, а git продолжает его отслеживать. Почему и что делать?"
a = """.gitignore действует только на файлы, которые git ещё не отслеживает. Если файл уже был закоммичен, правило на него не влияет.
Убрать из отслеживания, оставив файл на диске: `git rm --cached config/local.env` (каталог — `git rm -r --cached .idea/`), и закоммитить. Какое правило игнорирует путь — `git check-ignore -v путь`.
Важно: файл остаётся во всей прошлой истории. Если это секрет — rm --cached ничего не спасает, его надо отозвать.
Коротко: .gitignore не действует на уже отслеживаемые файлы; git rm --cached; в истории файл остаётся — секрет отзывать."""
src = "git/теория/собес-zubat-git.md:260-272"
kind = "М"
keys = [
  "уже отслежива | уже закоммич | уже в репо | только на неотслеж | не влия",
  "rm --cached | rm cached | cached",
]

[[card]]
id = "z-signed-commits"
q = "Зачем подписывать коммиты, если в коммите и так указан автор?"
a = """Автор коммита (user.name и user.email) пишется любой — подделать его может каждый. Можно сделать коммит «от имени» коллеги или руководителя, и хостинг покажет его аватарку.
Подпись ключом доказывает, что коммит сделал владелец ключа. GitHub и GitLab показывают «Verified», а правила защищённой ветки могут требовать только подписанные коммиты.
Проще всего подписывать SSH-ключом: `git config --global gpg.format ssh`, `user.signingkey ~/.ssh/id_ed25519.pub`, `commit.gpgsign true`, и добавить ключ в профиль как signing key.
Коротко: автора подделать легко, подпись доказывает владельца ключа; проще всего SSH-ключом и commit.gpgsign true."""
src = "git/теория/собес-zubat-git.md:305-320"
kind = "М"
keys = [
  "подделать | любой | произвольн | от имени",
  "verified | ключ | доказыва | подпис",
]
