# Контейнеры изнутри и образы OCI. Лекции спецкурса УЦСБ.
# kind М: по методичке, руками не гонял. keys: варианты через |.

[[card]]
id = "chroot-not-boundary"
q = "Почему chroot нельзя считать изоляцией, а тем более границей безопасности?"
a = """chroot меняет только корень файловой системы. Процессы, сеть, IPC общие: смонтировал /proc - видишь процессы хоста.
Root внутри сбегает: chroot во вложенный каталог, подняться по `..` выше старого корня, chroot в `.`. Вызовы chroot не складываются, текущий каталог не меняется.
В контейнерах вместо него pivot_root, плюс namespaces."""
src = "linux/теория/контейнеры-изнутри.md:58-93"
kind = "М"
keys = [
  "только корень | только файловую | процессы общие | сеть общ | proc | видно хост",
  "root сбега | побег | сбежать | вложенн | выше корн | не складыва",
  "pivot_root | namespace",
]
need = 2

[[card]]
id = "ns-syscalls"
q = "Какими системными вызовами процесс создаёт namespace, выходит из общего и входит в чужой? Что из этого использует `docker exec`?"
a = """clone - создать потомка сразу в новых namespaces (флаги CLONE_NEW*).
unshare - отсоединить текущий процесс от общих namespaces.
setns - присоединиться к существующему namespace по fd. Так работают docker exec, kubectl exec, nsenter."""
src = "linux/теория/контейнеры-изнутри.md:94-107"
kind = "М"
keys = [
  "clone",
  "unshare",
  "setns",
]
need = 2

[[card]]
id = "pid-ns-pid1"
q = "Что особенного у первого процесса в PID namespace и как это объясняет, почему контейнер останавливается?"
a = """Первый процесс получает PID 1 и роль init. Когда он завершается, ядро убивает все процессы этого namespace.
Поэтому контейнер живёт ровно пока жив его главный процесс. У процесса два PID: внутри namespace и на хосте."""
src = "linux/теория/контейнеры-изнутри.md:137-150"
kind = "М"
keys = [
  "pid 1 | init | первый процесс",
  "убив все | завершаются все | весь namespace | контейнер останавлива | живёт пока",
]

[[card]]
id = "unshare-mount-proc"
q = "Сделал `unshare -fp`, а `ps aux` всё равно показывает процессы хоста. Почему и что добавить?"
a = """ps читает /proc, а /proc остался смонтированным от хоста. Новый PID namespace есть, но /proc старый.
Нужен `--mount-proc` (или вручную `mount -t proc proc /proc` в новом mount namespace)."""
src = "linux/теория/контейнеры-изнутри.md:137-150, 327-340"
kind = "М"
keys = [
  "proc | прок",
  "mount-proc | перемонтир | смонтир заново | mount -t proc",
]

[[card]]
id = "net-ns-veth"
q = "Создал network namespace - внутри даже ping 127.0.0.1 не идёт. Почему? И как связать namespace с хостом?"
a = """В новом net namespace только loopback, и тот выключен: `ip link set dev lo up`.
Связь с хостом - veth-пара: один конец перенести в namespace, на оба конца адреса и up. Что ушло в один конец, выходит из другого. Для интернета ещё мост и маршрут по умолчанию. Так устроены pod-сети."""
src = "linux/теория/контейнеры-изнутри.md:151-173"
kind = "М"
keys = [
  "lo | loopback | выключен | down",
  "veth | пара | мост | bridge",
]

[[card]]
id = "user-ns-rootless"
q = "Как user namespace позволяет запускать rootless-контейнеры?"
a = """UID/GID внутри namespace могут отличаться от внешних: процесс внутри root, а на хосте обычный пользователь.
Сбежал из такого контейнера - на хосте ты непривилегированный. Создавать user namespace можно без прав root."""
src = "linux/теория/контейнеры-изнутри.md:174-184"
kind = "М"
keys = [
  "uid | маппинг | отображ | внутри root | снаружи обычн",
  "на хосте непривилег | без прав | побег не даёт root | rootless",
]

[[card]]
id = "runc-config-security"
q = "В OCI `config.json` для runc какие поля решают безопасность контейнера?"
a = """process.user (по умолчанию uid 0), capabilities (пять наборов, по умолчанию узкий), noNewPrivileges, rlimits.
mounts с nosuid/noexec/nodev и /sys только на чтение. linux.namespaces - какие создать. maskedPaths и readonlyPaths закрывают куски /proc и /sys.
compose и Kubernetes пишут эти поля за тебя: cap_drop, read_only, no-new-privileges."""
src = "linux/теория/контейнеры-изнутри.md:202-240"
kind = "М"
keys = [
  "user | uid | capabilit | cap",
  "nonewprivileges | no new privileges | nosuid | noexec | readonly | masked",
  "namespace",
]
need = 2

[[card]]
id = "low-vs-high-runtime"
q = "Чем low-level runtime (runc) отличается от high-level (CRI-O, containerd)?"
a = """runc только запускает один контейнер из bundle (rootfs + config.json) по OCI runtime-spec.
High-level тянет образы, распаковывает в хранилище, генерирует config.json, вызывает runc, следит за контейнером (conmon), логи, сеть через CNI, даёт API (gRPC через сокет) для kubelet."""
src = "linux/теория/контейнеры-изнутри.md:202-281"
kind = "М"
keys = [
  "один контейнер | bundle | запуск | rootfs",
  "образ | хранилищ | api | grpc | сокет | kubelet | cri",
]

[[card]]
id = "kata-gvisor"
q = "Почему для недоверенного кода смотрят на Kata Containers или gVisor вместо runc?"
a = """У runc все контейнеры на общем ядре хоста: побег или уязвимость ядра бьёт по всем.
Kata запускает лёгкую ВМ со своим ядром под OCI-интерфейсом. gVisor перехватывает syscalls и обрабатывает их своим ядром в userspace.
Цена: больше ресурсов (Kata), накладные расходы на syscalls и не всё поддерживается (gVisor)."""
src = "linux/теория/контейнеры-изнутри.md:282-304"
kind = "М"
keys = [
  "общее ядро | одно ядро | ядро хоста",
  "своё ядро | вм | виртуальн | перехват | userspace | syscall",
]

[[card]]
id = "podman-daemonless"
q = "Что даёт podman за счёт отсутствия демона, с точки зрения безопасности?"
a = """У docker постоянно работает демон от root, и доступ к его сокету равен root на хосте.
Podman daemonless: нет привилегированного демона и сокета-точки атаки. Плюс rootless через user namespace. Ограничение rootless - порты ниже 1024."""
src = "linux/теория/контейнеры-изнутри.md:305-315"
kind = "М"
keys = [
  "демон | daemon | сокет",
  "root | rootless | без привилег",
]

[[card]]
id = "oci-image-chain"
q = "Как устроен образ по OCI: от index.json до файлов?"
a = """index.json - список манифестов по платформам. manifest - конфиг и слои для одной архитектуры. config - Env, Cmd, Entrypoint, User, история и diff_ids. layers - tar-архивы изменений ФС.
Всё лежит в blobs/sha256 и ссылается друг на друга по хешу (content-addressable)."""
src = "linux/теория/образы-oci-и-сборка.md:16-51"
kind = "М"
keys = [
  "index | манифест | manifest",
  "config | конфиг",
  "слои | layer | tar",
]
need = 2

[[card]]
id = "image-id-immutable"
q = "Почему образ контейнера неизменяем и при чём тут деплой по digest?"
a = """Image ID - хеш JSON-конфига, а конфиг содержит хеши всех слоёв. Поменял хоть байт - другой ID, это новый образ.
Тег - ярлык, его перевешивают. Digest - отпечаток содержимого: по digest запустится ровно тот образ, что проверили."""
src = "linux/теория/образы-oci-и-сборка.md:74-89"
kind = "М"
keys = [
  "хеш конфиг | хеш слоёв | хеши | sha256 | меняется id",
  "тег | ярлык | digest | перевес | тот же образ",
]

[[card]]
id = "layer-delete-secret"
q = "В Dockerfile секрет скопировали в одном RUN, а удалили в следующем. В итоговом образе его нет?"
a = """Есть. Слой - это дельта, а не итог: файл лежит в слое, где его добавили. Следующий слой только помечает удаление.
Достаётся распаковкой слоя или `docker history`/`docker save`. Секреты при сборке - только `RUN --mount=type=secret`."""
src = "linux/теория/образы-oci-и-сборка.md:168-182"
kind = "М"
keys = [
  "остаётся | лежит | есть | в слое",
  "дельт | помечает удален | предыдущ слой | распаков",
  "mount type secret | secret | buildkit",
]
need = 2

[[card]]
id = "builder-is-security"
q = "Почему выбор инструмента сборки образов в CI - это вопрос безопасности?"
a = """`docker build` нужен демон: в CI это privileged или проброс docker.sock, и скомпрометированная джоба получает хост.
Kaniko и buildah собирают без демона и без привилегий, раннер может быть privileged=false. Поэтому в твоём пайплайне kaniko."""
src = "linux/теория/образы-oci-и-сборка.md:157-167"
kind = "М"
keys = [
  "демон | docker sock | privileged | привилег",
  "kaniko | buildah | без демон | хост",
]
