# Контейнеры изнутри и образы OCI. Лекции спецкурса УЦСБ.
# kind М: по методичке, руками не гонял. keys: варианты через |.

[[card]]
id = "chroot-not-boundary"
q = "Почему chroot нельзя считать изоляцией, а тем более границей безопасности?"
a = """chroot говорит процессу: твой корень `/` теперь вот эта папка. И всё — меняется только то, какие файлы процесс видит. Процессы, сеть, пользователи остаются общими с хостом: смонтировал внутри /proc — видишь все процессы хоста, а root внутри — это настоящий root.
И это не граница безопасности. `cd ..` упирается только в текущий корень. А chroot меняет корень, но сам процесс не двигает. Поэтому root делает chroot во вложенную папку, оказывается снаружи нового корня, поднимается через `cd ..` до настоящего `/` и снова chroot — он на хосте.
В контейнерах вместо chroot используют pivot_root: старый корень отмонтируют, подниматься уже некуда. Плюс namespaces для процессов, сети и пользователей.
Коротко: chroot меняет только вид на файлы, root из него сбегает; в контейнерах pivot_root и namespaces."""
src = "linux/теория/контейнеры-изнутри.md:58-106"
kind = "М"
keys = [
  "только корень | только файловую | процессы общие | сеть общ | proc | видно хост",
  "root сбега | побег | сбежать | вложенн | выше корн | не складыва",
  "pivot_root | namespace",
]
need = 2

[[card]]
id = "ns-syscalls"
q = "Какими системными вызовами процесс создаёт namespace, выходит из общего и входит в чужой? Что из этого использует `docker exec`?"
a = """Namespace — это изоляция того, что процесс видит (свои процессы, своя сеть и т.д.). Управляют ими три системных вызова:
clone — создать дочерний процесс сразу в новых namespace.
unshare — отсоединить текущий процесс от общих namespace.
setns — присоединиться к уже существующему namespace. Именно так работают `docker exec`, `kubectl exec` и `nsenter`: они входят в namespace уже запущенного контейнера.
Коротко: clone создаёт, unshare отделяет, setns входит; docker exec использует setns."""
src = "linux/теория/контейнеры-изнутри.md:107-120"
kind = "М"
keys = [
  "clone",
  "unshare",
  "setns",
]
need = 2

[[card]]
id = "pid-ns-pid1"
q = "Что особенного у первого процесса в PID namespace и как это объясняет, почему контейнер останавливается?"
a = """Первый процесс в PID namespace получает номер 1 и роль init (как главный процесс системы). Особенность: когда этот процесс завершается, ядро убивает все остальные процессы в этом namespace.
Отсюда и правило: контейнер живёт ровно пока жив его главный процесс. Закончился он — контейнер встал. У процесса при этом два номера: один внутри namespace, другой на хосте.
Коротко: главный процесс = PID 1; он завершился — namespace убит, контейнер встал."""
src = "linux/теория/контейнеры-изнутри.md:150-163"
kind = "М"
keys = [
  "pid 1 | init | первый процесс",
  "убив все | завершаются все | весь namespace | контейнер останавлива | живёт пока",
]

[[card]]
id = "unshare-mount-proc"
q = "Сделал `unshare -fp`, а `ps aux` всё равно показывает процессы хоста. Почему и что добавить?"
a = """Команда `ps` берёт список процессов из папки /proc. После `unshare -fp` новый PID namespace создан, но /proc всё ещё смонтирован от хоста — поэтому ps и показывает процессы хоста.
Нужно перемонтировать /proc уже в новом namespace: флаг `--mount-proc` (или вручную `mount -t proc proc /proc`). Тогда ps увидит только свои процессы.
Коротко: /proc остался от хоста, нужно перемонтировать его флагом --mount-proc."""
src = "linux/теория/контейнеры-изнутри.md:150-163, 340-353"
kind = "М"
keys = [
  "proc | прок",
  "mount-proc | перемонтир | смонтир заново | mount -t proc",
]

[[card]]
id = "net-ns-veth"
q = "Создал network namespace - внутри даже ping 127.0.0.1 не идёт. Почему? И как связать namespace с хостом?"
a = """В новом сетевом namespace вообще нет сети, есть только интерфейс loopback, и тот выключен. Поэтому даже ping 127.0.0.1 не идёт — сначала `ip link set dev lo up`.
Связать namespace с хостом можно veth-парой. Это как виртуальный провод из двух концов: что заходит в один конец, выходит из другого. Один конец оставляют на хосте, другой переносят в namespace, обоим дают адреса и поднимают. Для выхода в интернет ещё нужны мост и маршрут по умолчанию. Так же устроены сети подов в Kubernetes.
Коротко: в новом namespace только выключенный loopback; с хостом связывают veth-парой."""
src = "linux/теория/контейнеры-изнутри.md:164-186"
kind = "М"
keys = [
  "lo | loopback | выключен | down",
  "veth | пара | мост | bridge",
]

[[card]]
id = "user-ns-rootless"
q = "Как user namespace позволяет запускать rootless-контейнеры?"
a = """User namespace позволяет, чтобы номер пользователя внутри и снаружи были разными. Процесс может быть root внутри контейнера, а на хосте — обычным непривилегированным пользователем.
Это и есть основа rootless-контейнеров: даже если из такого контейнера сбежать, на хосте ты никто. И создавать user namespace можно без прав root.
Коротко: root внутри = обычный пользователь на хосте, поэтому побег ничего не даёт."""
src = "linux/теория/контейнеры-изнутри.md:187-197"
kind = "М"
keys = [
  "uid | маппинг | отображ | внутри root | снаружи обычн",
  "на хосте непривилег | без прав | побег не даёт root | rootless",
]

[[card]]
id = "runc-config-security"
q = "В OCI `config.json` для runc какие поля решают безопасность контейнера?"
a = """runc запускает контейнер по файлу config.json. За безопасность в нём отвечают:
- `user` — от кого запускать (по умолчанию root, лучше обычного пользователя);
- `capabilities` — какие кусочки прав root дать (по умолчанию узкий набор);
- `noNewPrivileges` — запрет повышать права внутри;
- точки монтирования с запретом исполнения и setuid, /sys только на чтение;
- `maskedPaths` и `readonlyPaths` — закрывают опасные куски /proc и /sys.
Когда ты пишешь в compose `cap_drop`, `read_only`, `no-new-privileges` — это просто попадает в этот config.json.
Коротко: config.json задаёт пользователя, capabilities, no-new-privileges и закрытые пути; compose пишет их за тебя."""
src = "linux/теория/контейнеры-изнутри.md:215-253"
kind = "М"
keys = [
  "user | uid | capabilit | cap",
  "nonewprivileges | no new privileges | nosuid | noexec | readonly | masked",
  "namespace",
]
need = 2

[[card]]
id = "low-vs-high-runtime"
q = "Чем low-level runtime (runc) отличается от high-level (CRI-O, containerd)?"
a = """runc — это low-level runtime: он умеет только запустить один контейнер из готовой папки (rootfs плюс config.json). Больше ничего.
High-level runtime (CRI-O, containerd) делает всё остальное: скачивает образ, распаковывает его, сам готовит config.json, вызывает runc, следит за контейнером, собирает логи, настраивает сеть и даёт API, с которым общается Kubernetes (kubelet).
Коротко: runc запускает один контейнер; CRI-O/containerd тянут образы, дают API и зовут runc."""
src = "linux/теория/контейнеры-изнутри.md:215-294"
kind = "М"
keys = [
  "один контейнер | bundle | запуск | rootfs",
  "образ | хранилищ | api | grpc | сокет | kubelet | cri",
]

[[card]]
id = "kata-gvisor"
q = "Почему для недоверенного кода смотрят на Kata Containers или gVisor вместо runc?"
a = """У обычного runc все контейнеры делят одно ядро хоста. Если из контейнера сбежать или найти дыру в ядре — под удар попадает вся машина и все соседи. Для недоверенного кода это опасно.
Kata запускает контейнер в лёгкой виртуалке со своим ядром, но снаружи он выглядит как обычный контейнер (OCI). gVisor идёт другим путём: перехватывает системные вызовы и обрабатывает их своим мини-ядром в пространстве пользователя. Цена: Kata ест больше ресурсов, gVisor медленнее на системных вызовах и поддерживает не всё.
Коротко: runc делит ядро хоста; Kata даёт своё ядро в ВМ, gVisor перехватывает вызовы своим ядром."""
src = "linux/теория/контейнеры-изнутри.md:295-317"
kind = "М"
keys = [
  "общее ядро | одно ядро | ядро хоста",
  "своё ядро | вм | виртуальн | перехват | userspace | syscall",
]

[[card]]
id = "podman-daemonless"
q = "Что даёт podman за счёт отсутствия демона, с точки зрения безопасности?"
a = """У Docker всё время работает демон от root. Доступ к его сокету = права root на хосте, это точка атаки.
Podman работает без демона (daemonless): нет постоянного привилегированного процесса и сокета, которые можно атаковать. Плюс умеет rootless через user namespace. Ограничение rootless — нельзя слушать порты ниже 1024.
Коротко: у Docker демон от root — точка атаки; у podman демона нет, плюс rootless."""
src = "linux/теория/контейнеры-изнутри.md:318-328"
kind = "М"
keys = [
  "демон | daemon | сокет",
  "root | rootless | без привилег",
]

[[card]]
id = "oci-image-chain"
q = "Как устроен образ по OCI: от index.json до файлов?"
a = """Образ контейнера — это не один файл, а набор объектов, которые ссылаются друг на друга по хешу. Цепочка такая: index.json (список вариантов под разные процессоры) → манифест (конфиг и список слоёв для одного варианта) → конфиг (команда запуска, переменные, пользователь, история) → слои (tar-архивы с изменениями файлов).
Всё лежит плоско в папке blobs/sha256, адресуется по хешу содержимого.
Коротко: index → манифест → конфиг → слои, всё адресуется по хешу содержимого."""
src = "linux/теория/образы-oci-и-сборка.md:16-51"
kind = "М"
keys = [
  "index | манифест | manifest",
  "config | конфиг",
  "слои | layer | tar",
]
need = 2

[[card]]
id = "image-id-immutable"
q = "Почему образ контейнера неизменяем и при чём тут деплой по digest?"
a = """У образа есть ID — это хеш его конфига. А конфиг содержит хеши всех слоёв. Поменяешь в образе хоть байт — изменится хеш слоя, значит и конфиг, значит и ID. Получается уже другой образ, старый не трогается. Поэтому образ неизменяем.
Из этого и правило деплоить по digest (это и есть такой хеш-отпечаток), а не по тегу: тег перевешивается, а по digest запустится ровно тот образ, что проверяли.
Коротко: ID = хеш конфига с хешами слоёв, любое изменение даёт новый образ; деплой по digest."""
src = "linux/теория/образы-oci-и-сборка.md:74-89"
kind = "М"
keys = [
  "хеш конфиг | хеш слоёв | хеши | sha256 | меняется id",
  "тег | ярлык | digest | перевес | тот же образ",
]

[[card]]
id = "layer-delete-secret"
q = "В Dockerfile секрет скопировали в одном RUN, а удалили в следующем. В итоговом образе его нет?"
a = """Каждый слой образа — это список изменений относительно предыдущего (дельта), а не итоговая картинка. Если в одном RUN добавить секрет, а в следующем удалить файл — он всё равно останется в том слое, где его добавили. Следующий слой лишь помечает, что файла больше нет.
Достать его можно распаковкой слоя или через `docker history` / `docker save`. Поэтому секреты при сборке передают только через `RUN --mount=type=secret` — так они в слои не попадают.
Коротко: слой — дельта, удалённый файл остаётся в старом слое; секреты — через mount type secret."""
src = "linux/теория/образы-oci-и-сборка.md:168-182"
kind = "М"
keys = [
  "остаётся | лежит | есть | в слое",
  "дельт | помечает удален | предыдущ слой | распаков",
  "mount type secret | secret | buildkit",
]
need = 2

[[card]]
id = "builder-is-security"
q = "Почему выбор инструмента сборки образов в CI - это вопрос безопасности?"
a = """Чтобы собрать образ командой `docker build`, нужен Docker-демон. В пайплайне дать его джобе — значит либо привилегированный режим, либо проброс сокета, и тогда взломанная джоба получает весь хост.
Kaniko и buildah собирают образ без демона и без привилегий. Поэтому раннер можно держать без привилегий. Отсюда и выбор kaniko в твоём пайплайне.
Коротко: docker build тянет демон и привилегии = риск хоста; kaniko/buildah собирают без них."""
src = "linux/теория/образы-oci-и-сборка.md:157-167"
kind = "М"
keys = [
  "демон | docker sock | privileged | привилег",
  "kaniko | buildah | без демон | хост",
]
