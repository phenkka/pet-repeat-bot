[[card]]
id = "z-pod-pending"
q = "Под висит в Pending. Что проверяешь?"
a = """Pending — scheduler не может найти поду ноду (или ещё ждёт). Первое — `kubectl describe pod`: в событии FailedScheduling scheduler пишет причину по каждой группе нод, например «3 Insufficient cpu, 2 had untolerated taint».
Причины:
не хватает ресурсов по requests (не по реальной нагрузке!) — смотреть Allocated resources в `kubectl describe node`;
taint без toleration, неподходящие nodeSelector, affinity, spread;
PVC не привязан — нет StorageClass или диск в другой зоне;
ноды cordoned или NotReady.
Если превышена ResourceQuota — пода вообще нет, ошибка в событиях ReplicaSet.
Коротко: describe pod → FailedScheduling; обычно не хватает ресурсов по requests, taint, affinity или не привязан PVC."""
