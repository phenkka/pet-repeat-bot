[[card]]
id = "z-sa-token-projected"
q = "Как в современном Kubernetes выдаётся токен ServiceAccount поду, и что изменилось с 1.24?"
a = """Раньше на каждый ServiceAccount автоматически создавался Secret с вечным токеном. Утёк — работает навсегда.
С 1.24 такие токены сами не создаются. Под получает короткоживущий токен через projected volume: он привязан к конкретному поду и назначению, kubelet сам его обновляет. Под удалён — токен недействителен. Разовый токен для человека — `kubectl create token ci --duration=1h`.
Если поду API не нужен, монтирование токена вообще отключают: `automountServiceAccountToken: false`.
Коротко: с 1.24 вместо вечного токена в Secret — короткоживущий projected-токен, привязанный к поду; не нужен API — отключить автомонтирование."""
