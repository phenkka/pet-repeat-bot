[[card]]
id = "z-external-traffic-local"
q = "Приложение за Service LoadBalancer видит IP ноды вместо IP клиента. Почему и что даёт `externalTrafficPolicy: Local`?"
a = """По умолчанию (Cluster) запрос, пришедший на любую ноду, может уйти в под на другой ноде. Для этого адрес отправителя подменяется на адрес ноды (SNAT) — и под видит IP ноды, а не клиента. Плюс лишний сетевой переход.
Local — трафик обслуживают только поды на той ноде, куда он пришёл. Подмены нет, под видит настоящий IP клиента (важно для логов, rate limit, белых списков). Ноды без подов не проходят проверку балансировщика и трафик не получают.
Минус: если поды разложены неравномерно, нагрузка тоже будет неравномерной.
Коротко: Cluster делает SNAT, и под видит IP ноды; Local обслуживает на той же ноде и сохраняет IP клиента."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:718-731"
kind = "М"
keys = [
  "snat | подмен | ip ноды",
  "local | ip клиент | на той же нод",
]

[[card]]
id = "z-gateway-api"
q = "Чем Gateway API лучше Ingress, и почему вопрос стал актуальным в 2026?"
a = """Ingress умеет только простую маршрутизацию HTTP по имени и пути. Всё сложнее (веса для canary, заголовки, таймауты) задаётся аннотациями, у каждого контроллера своими — при смене контроллера всё переписывать.
Gateway API разделяет роли: GatewayClass — тип реализации, Gateway — точка входа с портами и TLS (её ведёт платформенная команда), HTTPRoute и другие маршруты — их пишут команды приложений. Веса, заголовки, зеркалирование — в стандарте, а не в аннотациях. Есть TCP, UDP, gRPC.
Актуально потому, что ingress-nginx с марта 2026 больше не поддерживается — в том числе не выходят исправления безопасности.
Коротко: Ingress — простые правила + несовместимые аннотации; Gateway API — роли и стандартные возможности; ingress-nginx с 2026 без поддержки."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:732-748"
kind = "М"
keys = [
  "аннотац | у каждого свои | непереносим",
  "роли | gateway | httproute | route",
  "ingress-nginx | без поддержк | не поддержива | 2026",
]
