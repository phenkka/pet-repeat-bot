[[card]]
id = "z-probe-mistakes"
q = "Почему liveness-проба не должна проверять базу данных? Какие ещё ошибки в пробах частые?"
a = """Если liveness проверяет базу, то при падении базы kubelet начнёт перезапускать все поды приложения разом. База поднимется — а приложение лежит в перезапусках. Это каскадный отказ. Liveness должна проверять только сам процесс: жив ли он. Зависимости — дело readiness.
Ещё ошибки: liveness и readiness одинаковые; маленький таймаут (по умолчанию 1 секунда) — под нагрузкой ложные перезапуски; медленный старт без startupProbe — liveness убивает приложение, пока оно грузится; нет readiness — трафик идёт в неготовый под при обновлении.
Коротко: liveness на базу = каскадные перезапуски всех подов; liveness — только сам процесс, зависимости — readiness."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:543-564"
kind = "М"
keys = [
  "каскад | все поды | перезапуск всех | разом",
  "только процесс | сам процесс | readiness",
  "startup | таймаут | timeout",
]
need = 2

[[card]]
id = "z-oomkilled-vs-throttling"
q = "Чем OOMKilled отличается от CPU throttling, и почему одно убивает, а другое только тормозит?"
a = """Память — ресурс, который нельзя «сжать»: если процесс превысил лимит памяти, отнять у него уже занятое нельзя, поэтому ядро его убивает. Это OOMKilled, код 137. Видно в `kubectl describe pod` (Last State: OOMKilled).
CPU можно «сжать»: при достижении лимита процесс не убивают, а просто не дают ему процессор до следующего короткого периода. Это троттлинг — приложение живо, но растут задержки.
Поэтому для чувствительных к задержкам сервисов CPU limit часто не ставят совсем, оставляя только requests. А для JVM и Go учитывают лимит памяти контейнера в настройках.
Коротко: память несжимаема — превысил лимит, убит (137); CPU сжимаем — превысил, троттлинг и задержки."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:581-595"
kind = "М"
keys = [
  "памят | memory | 137 | убива",
  "cpu | троттл | throttl | задержк | тормоз",
]

[[card]]
id = "z-native-sidecar"
q = "Что такое нативный sidecar в Kubernetes и какую проблему Job он решил?"
a = """Нативный sidecar — это init-контейнер с `restartPolicy: Always`. Он запускается до основных контейнеров и останавливается после них.
Зачем: прокси service mesh или агент секретов готов раньше, чем стартует приложение; логи досылаются до конца.
Проблема Job: раньше sidecar был обычным вторым контейнером. Основная задача Job завершилась, а sidecar (например, сборщик логов) продолжал работать — и под никогда не становился Succeeded, Job висел. Нативный sidecar останавливается сам после основных контейнеров.
Коротко: init-контейнер с restartPolicy Always — стартует до и останавливается после основных; Job больше не виснет из-за sidecar."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:596-620"
kind = "М"
keys = [
  "init | restartpolicy always | always",
  "до | раньше | после",
  "job | succeeded | висн | не заверш",
]
need = 2

[[card]]
id = "z-graceful-shutdown"
q = "При каждом выкатывании часть запросов падает с ошибкой. Как устроено завершение пода и как сделать обновление без потерь?"
a = """При удалении пода одновременно происходят две вещи: его убирают из списка адресов сервиса (балансировщики узнают об этом не мгновенно) и kubelet шлёт приложению SIGTERM. Из-за этой гонки приложение может закрыться, пока на него ещё идут запросы.
Что делают:
preStop со sleep на 5–10 секунд — дать балансировщикам убрать под из трафика до SIGTERM;
приложение на SIGTERM дорабатывает текущие запросы, а не обрывается;
PID 1 передаёт сигналы (exec form или tini);
terminationGracePeriodSeconds с запасом, readinessProbe и PDB.
Коротко: удаление из сервиса и SIGTERM идут одновременно; preStop sleep, обработка SIGTERM и readiness убирают потери."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:621-641"
kind = "М"
keys = [
  "prestop | sleep",
  "sigterm | сигнал",
  "endpoint | балансир | из сервис | гонк | трафик",
]
need = 2

[[card]]
id = "z-rollout-undo"
q = "Новая версия Deployment сломалась. Как откатить, и что задают maxSurge и maxUnavailable?"
a = """Откат: `kubectl rollout undo deploy/web` (или `--to-revision=3`), история — `kubectl rollout history deploy/web`. Deployment хранит старые ReplicaSet (по умолчанию 10), поэтому откат быстрый: просто снова масштабируется старый набор.
При RollingUpdate: maxSurge — сколько подов можно создать сверх нужного числа реплик; maxUnavailable — сколько могут быть недоступны одновременно. По умолчанию оба 25%. maxUnavailable: 0 — обновление без снижения мощности.
Canary и blue-green встроенный Deployment не умеет — для них Argo Rollouts, Flagger или веса в Gateway API.
Коротко: kubectl rollout undo; maxSurge — сколько сверх, maxUnavailable — сколько недоступно при обновлении."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:642-660"
kind = "М"
keys = [
  "rollout undo | undo",
  "maxsurge | сверх",
  "maxunavailable | недоступн",
]
need = 2

[[card]]
id = "z-cronjob-concurrency"
q = "CronJob бэкапа запускается каждый час, а бэкап иногда идёт дольше часа. Что настроить, чтобы два бэкапа не шли одновременно?"
a = """concurrencyPolicy у CronJob: Allow (по умолчанию) — запустит второй параллельно с первым; Forbid — пропустит новый запуск, пока идёт старый; Replace — убьёт старый и запустит новый. Для бэкапа — Forbid.
Ещё полезное: startingDeadlineSeconds — насколько можно опоздать с запуском; у Job — backoffLimit (сколько повторов при ошибке), activeDeadlineSeconds (общий таймаут), ttlSecondsAfterFinished (удалить завершённые). Ручной запуск: `kubectl create job manual-1 --from=cronjob/backup`.
Коротко: concurrencyPolicy: Forbid — не запускать новый, пока идёт старый (по умолчанию Allow — параллельно)."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:661-681"
kind = "М"
keys = [
  "concurrencypolicy | concurrency",
  "forbid",
]

[[card]]
id = "z-static-pods"
q = "Удаляешь под kube-apiserver через kubectl delete, а он сразу появляется снова. Почему и как он запущен?"
a = """Это static pod. Им управляет kubelet ноды напрямую, без API-сервера: kubelet читает манифесты из каталога (в kubeadm — /etc/kubernetes/manifests) и запускает поды сам. Так работают сами компоненты control plane — apiserver, scheduler, controller-manager, etcd: им же нужно запуститься, когда API-сервера ещё нет.
В API видна только его «зеркальная» копия. Удалишь её — kubelet пересоздаст. Остановить — убрать файл манифеста из каталога, изменить — отредактировать файл.
С точки зрения безопасности: кто может писать в этот каталог на ноде, тот запускает что угодно мимо RBAC и admission.
Коротко: static pod — kubelet запускает его из /etc/kubernetes/manifests сам; в API только зеркало; управлять — файлом манифеста."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:682-693"
kind = "М"
keys = [
  "static | статическ",
  "kubelet",
  "manifests | манифест | файл",
]
