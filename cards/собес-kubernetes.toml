[[card]]
id = "z-kubectl-debug-node"
q = "Что умеет `kubectl debug` и почему `kubectl debug node/...` - это фактически root на ноде?"
a = """kubectl debug добавляет в работающий под временный (эфемерный) контейнер с твоими утилитами: `kubectl debug -it pod/web --image=busybox --target=app` — видны процессы контейнера app. Ещё можно сделать копию пода с другой командой (--copy-to).
`kubectl debug node/node1 -it --image=ubuntu` создаёт под в namespace самой ноды, а корень ноды монтирует в /host. Это root на ноде: `chroot /host` — и ты на ноде.
Поэтому право создавать такие поды (и pods/ephemeralcontainers) — опасное, его дают только админам кластера.
Коротко: эфемерный контейнер с утилитами в работающий под; debug node монтирует корень ноды в /host — это root на ноде."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:1215-1231"
kind = "М"
keys = [
  "эфемерн | временн контейнер | ephemeral",
  "host | корень нод | root на нод | chroot",
]
