[[card]]
id = "z-node-notready"
q = "Нода перешла в NotReady. Что смотришь и что будет с подами на ней?"
a = """NotReady — kubelet перестал сообщать, что нода жива, или сам сообщил о проблеме.
Смотреть: `kubectl describe node` — Conditions (MemoryPressure, DiskPressure, NetworkUnavailable). На самой ноде: `systemctl status kubelet containerd`, `journalctl -u kubelet`, `df -h`, `free -m`.
Частые причины: kubelet упал (ошибка конфига, истёк его сертификат), упал containerd, не работает CNI, кончился диск или память, нет сети до API-сервера, сбилось время (ломается TLS).
Поды: примерно через 5 минут их выселят и пересоздадут на других нодах. Кроме StatefulSet — их не пересоздают, пока не подтверждено, что нода выключена (чтобы не было двух копий с одним диском).
Коротко: describe node и журнал kubelet на ноде; причины — kubelet, runtime, CNI, диск, сертификат; через ~5 минут поды переедут, StatefulSet — нет."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:1196-1214"
