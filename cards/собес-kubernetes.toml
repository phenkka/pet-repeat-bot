[[card]]
id = "z-apiserver-stages"
q = "Через какие этапы проходит запрос в kube-apiserver, прежде чем объект попадёт в etcd? Где тут работает Kyverno?"
a = """1. Аутентификация — кто ты: сертификат, токен ServiceAccount, OIDC.
2. Авторизация — можно ли тебе это действие: RBAC.
3. Mutating admission — объект можно дополнить: подставить значения по умолчанию, добавить sidecar.
4. Проверка схемы объекта.
5. Validating admission — последняя проверка, можно отклонить: квоты, Pod Security, вебхуки, ValidatingAdmissionPolicy.
6. Запись в etcd.
Kyverno и Gatekeeper работают как admission-вебхуки (шаги 3 и 5): именно поэтому они могут не пустить под с root.
Коротко: аутентификация → авторизация (RBAC) → mutating admission → валидация → validating admission → etcd; Kyverno — admission."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:515-527"
kind = "М"
keys = [
  "аутентифик | authn | кто ты",
  "авторизац | rbac | authz",
