theme = "Kubernetes"

[[card]]
id = "z-k8s-spread-zones"
q = "В облаке 3 зоны доступности. Как сделать, чтобы поды приложения легли по зонам равномерно?"
a = """Сам по себе scheduler может положить все реплики в одну зону — упадёт зона, упадёт и приложение.
Современный способ — topologySpreadConstraints: указываешь ключ метки зоны (topology.kubernetes.io/zone) и допустимый перекос maxSkew: 1 — разница в числе подов между зонами не больше одного.
Старый способ — podAntiAffinity: «не клади под рядом с таким же» по метке зоны. Он грубее: при числе реплик больше числа зон с жёстким правилом лишние поды не сядут.
Коротко: topologySpreadConstraints по метке зоны с maxSkew; старый вариант — podAntiAffinity."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:63-70"
kind = "М"
keys = [
  "topologyspread | topology spread | maxskew",
  "antiaffinity | anti affinity | зон",
]
need = 1

[[card]]
id = "z-kube-proxy"
q = "За что отвечает kube-proxy и как он это делает?"
a = """Service — это виртуальный адрес (ClusterIP), за которым стоят поды. Сам по себе этот адрес никуда не ведёт. kube-proxy на каждой ноде следит за сервисами и их подами через API и пишет правила (iptables, IPVS или nftables): пакет на ClusterIP:порт — подменить адрес на IP одного из живых подов.
То есть kube-proxy делает так, чтобы обращение к Service доходило до пода на любой ноде. Сам трафик через процесс kube-proxy не идёт — его перенаправляет ядро по этим правилам. С Cilium kube-proxy можно вообще убрать: то же делает eBPF.
Коротко: kube-proxy превращает ClusterIP сервиса в правила iptables/IPVS на каждой ноде, ведущие на поды."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:101-106"
kind = "М"
keys = [
  "service | clusterip | сервис",
  "iptables | ipvs | nftables | правил",
]

[[card]]
id = "z-kubectl-apply-flow"
q = "Выполнил `kubectl apply -f deployment.yaml`. Что происходит по шагам до запущенных контейнеров?"
a = """1. kubectl отправляет объект в kube-apiserver.
2. API-сервер: кто ты (аутентификация) → можно ли тебе (RBAC) → admission (может дополнить или отклонить) → запись в etcd.
3. Контроллер Deployment видит новый Deployment и создаёт ReplicaSet, контроллер ReplicaSet создаёт поды (пока без ноды).
4. Scheduler видит поды без ноды и выбирает каждому ноду.
5. kubelet на выбранной ноде видит назначенный ему под и через container runtime (containerd) скачивает образ и запускает контейнеры, CNI даёт поду сеть.
Все компоненты общаются только с API-сервером через watch, в etcd ходит только он.
Коротко: apiserver (authn, RBAC, admission, etcd) → контроллеры создают ReplicaSet и поды → scheduler выбирает ноду → kubelet запускает."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:183-192"
kind = "М"
keys = [
  "apiserver | api сервер | api-server",
  "etcd",
  "replicaset | контроллер | controller",
  "scheduler | планировщик",
  "kubelet",
]
need = 4

[[card]]
id = "z-hpa"
q = "Как работает HPA и что нужно в кластере, чтобы он заработал?"
a = """HPA (Horizontal Pod Autoscaler) сам меняет число реплик по метрике: например, держать средний CPU подов на 70% — нагрузка выросла, добавил подов, упала — убрал.
Чтобы работал, нужен metrics-server (он собирает потребление CPU и памяти). И у подов должны быть заданы requests — процент считается от них. Без requests HPA не знает, от чего считать.
Для своих метрик — адаптер Prometheus, для событий (длина очереди) — KEDA, она умеет и масштабировать до нуля.
Коротко: HPA меняет число реплик по метрике; нужны metrics-server и requests у подов."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:433-442"
kind = "М"
