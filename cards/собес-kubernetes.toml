[[card]]
id = "z-crashloopbackoff"
q = "Под в CrashLoopBackOff. Как ищешь причину?"
a = """CrashLoopBackOff: контейнер запускается и падает, kubelet перезапускает его со всё большей паузой.
1. `kubectl describe pod` — Last State, код выхода, Reason, события.
2. `kubectl logs <pod> --previous` — логи предыдущего, упавшего запуска (текущий может ещё ничего не написать).
Код выхода: 1 и подобные — ошибка приложения (нет переменной или секрета, неверный конфиг, недоступна база); 137 — убит (OOMKilled или по liveness-пробе — смотреть события); 139 — segfault; 0 — процесс просто завершился (не та команда, ушёл в фон).
Нет логов — проверить command/args, права на файлы, readOnlyRootFilesystem. Отладить копией с другой командой: `kubectl debug <pod> -it --copy-to=dbg --container=app -- sh`.
Коротко: describe (код выхода, события) и logs --previous; 1 — приложение, 137 — OOM или liveness, 0 — процесс завершился."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:1123-1142"
kind = "М"
keys = [
  "describe",
  "previous | --previous | прошл",
  "код выход | exit code | 137 | oom",
]
need = 2

[[card]]
id = "z-imagepullbackoff"
q = "Под в ImagePullBackOff. Какие причины и где смотреть?"
a = """Смотреть в `kubectl describe pod` — в событиях kubelet обычно прямо пишет причину.
Причины:
опечатка в имени или теге, тег удалён — not found / manifest unknown;
приватный registry без imagePullSecrets или с неверным секретом — unauthorized, 401/403;
секрет лежит в другом namespace (должен быть в namespace пода);
лимит Docker Hub — 429 Too Many Requests;
нода не достаёт до registry: сеть, прокси, DNS, самоподписанный сертификат registry;
образ не под архитектуру ноды.
Проверить с ноды: `crictl pull образ`.
Коротко: describe pod покажет причину; обычно опечатка в теге, нет imagePullSecrets, лимит Docker Hub или нода не достаёт до registry."""
