[[card]]
id = "z-etcd-backup"
q = "Как сделать бэкап etcd, и что в нём есть и чего нет?"
a = """Снапшот: `etcdctl snapshot save /backup/etcd.db` с сертификатами etcd (в kubeadm они в /etc/kubernetes/pki/etcd/). Восстановление — `etcdutl snapshot restore` в новый каталог, затем перенастроить etcd на этот каталог (через его манифест static pod).
В бэкапе всё состояние кластера, включая все Secret. Значит, бэкап надо шифровать и хранить вне кластера — кто получил бэкап, получил все секреты.
Чего нет: данных в томах (PV). Их бэкапят отдельно — Velero или снапшотами CSI.
Коротко: etcdctl snapshot save; там все Secret — шифровать и хранить снаружи; данных PV там нет — Velero."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:1102-1122"
