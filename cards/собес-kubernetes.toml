[[card]]
id = "z-ndots-5"
q = "Поды долго резолвят внешние имена, а CoreDNS перегружен. Причём тут ndots:5?"
a = """kubelet прописывает подам в resolv.conf `ndots:5` и список search-доменов кластера. Правило: если в имени меньше 5 точек, сначала перебираются все search-домены. Запрос api.example.com превращается в api.example.com.default.svc.cluster.local, ...svc.cluster.local, ...cluster.local — и только потом настоящий. Каждый — по A и AAAA. Большинство кончаются NXDOMAIN: лишняя нагрузка на CoreDNS и задержка.
Лечат: писать внешние имена с точкой в конце (api.example.com.), снизить ndots в dnsConfig пода, поставить NodeLocal DNSCache.
Коротко: при ndots:5 короткое имя сначала перебирает все search-домены — лишние запросы; лечат точкой в конце или меньшим ndots."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:784-797"
kind = "М"
keys = [
  "search | перебир | лишн запрос",
  "точк в конц | точкой | fqdn | dnsconfig | меньш ndots | nodelocal",
]

[[card]]
id = "z-configmap-reload"
q = "Поменял ConfigMap, а приложение работает со старыми настройками. Почему?"
a = """Зависит от того, как ConfigMap передан.
Через переменные окружения — они читаются только при старте контейнера. Нужен перезапуск: `kubectl rollout restart deploy/web`.
Через том (файлы) — kubelet обновит файлы сам, но с задержкой до минуты, и приложение должно само перечитать файл.
Через subPath — не обновляется никогда.
Автоматизировать: хэш конфига в аннотации пода (в Helm checksum/config) — изменился конфиг, изменился под, Deployment перекатится. Или Reloader.
Коротко: env читается только при старте — нужен rollout restart; том обновится сам с задержкой; subPath — никогда."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:814-828"
