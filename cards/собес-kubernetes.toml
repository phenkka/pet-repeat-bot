[[card]]
id = "z-priorityclass"
q = "Что такое PriorityClass и preemption, и чем это опасно, если раздать высокий приоритет кому попало?"
a = """PriorityClass — объект с числом-приоритетом, под ссылается на него через priorityClassName. Если важный под не помещается ни на одну ноду, scheduler выгоняет (preemption) поды с меньшим приоритетом, чтобы освободить место. Приоритет учитывается и при выселении при нехватке ресурсов.
Опасность: если любой может создать под с высоким приоритетом, он может вытеснить чужие важные поды — это способ уронить соседей. Поэтому использование высоких классов ограничивают квотами. Системные классы system-cluster-critical и system-node-critical — только для компонентов кластера.
Коротко: приоритет пода; важный под может вытеснить менее важные; раздача высокого приоритета всем — способ выгнать чужие поды."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:910-928"
kind = "М"
keys = [
  "приоритет | priority",
  "вытесн | preempt | выгоня",
]

[[card]]
id = "z-quota-limitrange"
q = "Зачем на namespace команды ставят ResourceQuota и LimitRange вместе?"
a = """ResourceQuota ограничивает сумму на весь namespace: сколько всего CPU, памяти, подов, дисков может взять команда. Одна команда не съест весь кластер.
LimitRange задаёт правила для каждого отдельного контейнера: requests и limits по умолчанию, минимум и максимум.
Вместе потому, что при включённой квоте под без requests/limits просто не создастся. LimitRange подставляет значения по умолчанию — и поды без явных ресурсов не ломаются.
Коротко: ResourceQuota — сколько всего на namespace, LimitRange — значения по умолчанию и рамки на контейнер; без LimitRange поды без ресурсов отклонит квота."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:929-951"
kind = "М"
keys = [
  "quota | квот | сумм | весь namespace",
  "limitrange | по умолчан | default | на контейнер",
]

[[card]]
id = "z-pdb"
q = "От чего защищает PodDisruptionBudget, а от чего нет? Почему из-за него может навсегда зависнуть drain?"
a = """PDB говорит: «у этого приложения одновременно должно работать минимум N подов» (minAvailable) или «не больше M недоступно» (maxUnavailable). Работает только для добровольных прерываний — drain ноды, обновление нод, автоскейлер. От падения ноды или OOM не защищает.
drain зависнет навсегда, если minAvailable равен числу реплик (или maxUnavailable: 0) — выгнать нельзя ни один под. Та же беда с PDB на Deployment с одной репликой.
Проверить: `kubectl get pdb` — колонка ALLOWED DISRUPTIONS; если 0, drain будет ждать.
Коротко: PDB — минимум живых подов при добровольных прерываниях (drain), не при падениях; minAvailable = реплики — drain виснет."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:952-972"
kind = "М"
keys = [
  "добровольн | drain | обновлен нод",
  "не защища | падени нод | oom",
  "minavailable | реплик | одна реплик | allowed",
]
need = 2

[[card]]
id = "z-drain-node"
q = "Как безопасно вывести ноду на обслуживание, и что при этом может потеряться?"
a = """`kubectl cordon node1` — запретить новые поды; `kubectl drain node1 --ignore-daemonsets --delete-emptydir-data` — выселить поды (с учётом PDB); после работ `kubectl uncordon node1`.
Что может потеряться или не переехать:
данные emptyDir — удалятся (поэтому флаг надо указать явно);
«голые» поды без контроллера — не пересоздадутся, нужен --force;
поды с локальным диском (local PV) — не запустятся на другой ноде;
поды DaemonSet и static pods не выселяются.
Перед обслуживанием смотреть `kubectl get pdb -A` — не заблокирует ли бюджет.
Коротко: cordon → drain → работы → uncordon; теряются emptyDir и голые поды, local PV не переедут."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:997-1016"
kind = "М"
keys = [
  "cordon",
  "drain",
  "emptydir | голые | без контроллер | local",
]
need = 2

[[card]]
id = "z-helm-vs-kustomize"
q = "Helm или Kustomize - чем отличаются и когда что брать?"
a = """Helm — пакетный менеджер: чарт — это шаблоны плюс values.yaml. Установленный чарт — релиз с историей версий: можно откатить (`helm rollback`). Есть зависимости и хуки. Хорош для чужих приложений с кучей параметров.
Kustomize — без шаблонов: базовые манифесты плюс оверлеи с патчами под окружения (dev, prod). Встроен в kubectl: `kubectl apply -k overlays/prod`. Релизов и истории нет. Хорош для своих манифестов, которые немного отличаются между окружениями.
Часто сочетают: Kustomize поверх того, что выдал Helm, — так умеют и Argo CD, и Flux.
Коротко: Helm — шаблоны, релизы, откат, для чужих чартов; Kustomize — патчи поверх базы без шаблонов, для своих манифестов."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:1017-1035"
kind = "М"
keys = [
  "helm | шаблон | релиз | rollback",
  "kustomize | патч | оверле | overlay | без шаблон",
]

[[card]]
id = "z-gitops-pull"
q = "Что такое GitOps и почему pull-модель безопаснее, чем деплой из CI командой kubectl?"
a = """GitOps: желаемое состояние кластера описано в git, а агент внутри кластера (Argo CD или Flux) постоянно сверяет git с реальностью и приводит кластер к нему. Изменения — через merge request, откат — revert коммита. Ручные правки в кластере видно, и агент их исправит.
Безопаснее потому, что CI больше не нужен доступ к кластеру. При push-модели в CI лежат учётные данные с правами деплоить в прод — взломали CI, получили кластер. При pull агент сам тянет изменения изнутри, а снаружи в кластер никто не ходит.
Argo CD — с веб-интерфейсом и многими кластерами из одного места; Flux — набор контроллеров без обязательного UI.
Коротко: агент в кластере тянет состояние из git; CI не нужен доступ к кластеру — взлом CI не даёт кластер."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:1036-1047"
kind = "М"
keys = [
  "git | желаем состояни | декларатив",
  "агент | argo | flux | pull | тянет",
  "ci не нужен | доступ к кластер | учетн | без доступ",
]
need = 2

[[card]]
id = "z-finalizer-terminating"
q = "Namespace завис в Terminating на несколько дней. Что такое finalizer и почему так бывает?"
a = """Finalizer — пометка на объекте «перед удалением надо прибраться». Пока она стоит, объект при удалении не исчезает, а ждёт: контроллер должен выполнить очистку (удалить облачный балансировщик, диск) и снять пометку.
Если контроллер, который должен снять finalizer, удалён или сломан, — пометку никто не снимет. Объект висит, а вместе с ним и весь namespace в Terminating.
Правильно — починить или вернуть контроллер. Крайняя мера — снять finalizer руками (kubectl patch с пустыми finalizers), понимая, что внешние ресурсы (балансировщик, диск) останутся висеть и стоить денег.
Коротко: finalizer ждёт, пока контроллер приберётся; контроллер сломан — никто не снимет, namespace висит; чинить контроллер, снимать руками — крайний случай."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:1048-1064"
kind = "М"
keys = [
  "finalizer | пометк | очистк | прибра",
  "контроллер | оператор | сломан | удален",
]

[[card]]
id = "z-cri-crictl"
q = "Почему Kubernetes больше не работает с Docker, сломаются ли твои образы, и чем смотреть контейнеры на ноде?"
a = """kubelet общается с container runtime через интерфейс CRI. Docker его не реализует, и раньше работал через прослойку dockershim — её удалили в 1.24. Теперь на нодах containerd или CRI-O, а они запускают контейнеры через runc.
Образы не сломаются: Docker собирает стандартные OCI-образы, их запускает любой runtime.
На ноде вместо docker — crictl: `crictl ps -a`, `crictl logs <id>`, `crictl inspect <id>`, `crictl pull`. У containerd ещё есть ctr (образы Kubernetes в namespace k8s.io) и nerdctl.
Коротко: Docker не умеет CRI, dockershim убрали в 1.24; образы OCI работают; на ноде — crictl."""
src = "kubernetes/теория/собес-zubat-kubernetes.md:1065-1084"
